Ads.Delivery:
  domain: advertising
  role: primary_fact
  description: Unified ad delivery (Meta ∪ Google), ad × day (the hourly grain is
    Ads.DeliveryHourly)
  physical_bindings:
    daily: serve.fct_ad_delivery
  grain:
    declared_keys:
    - brand_id
    - report_date
    - ad_platform
    - account_id
    - campaign_id
    - adset_id
    - ad_id
    - device
    - network
  date_policy:
    default: report_date
    meaning: ad_delivery_date
  supported_platforms:
  - meta
  - google
  certification:
    status: certified
    certified_on: '2026-10-16'
    evidence: doc/semantic_v3/results/datasets/certification.json
Ads.DeliveryHourly:
  domain: advertising
  role: primary_fact
  description: Unified ad delivery (Meta ∪ Google), ad × day × hour (split from Ads.Delivery
    in v3 because the hourly grain has hour_of_day in its key)
  physical_bindings:
