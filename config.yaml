# Non-secret application settings. Secrets stay in .env / .env.local.
# Env vars still override any key here (useful for tests and one-off ops).

cube:
  # Cube model: data_platform/mage-ai/infra/cube/ (NOT Base_Agent/cube/).
  # docker compose mounts that path at 127.0.0.1:4001.
  api_url: http://127.0.0.1:4001

pipeboard:
  mcp_url: https://meta-ads.mcp.pipeboard.co

gateway:
  # Global kill switch for write actions. Must be true to allow commits.
  write_enabled: false
  # Scopes granted to the caller
  scopes:
    - metrics:read
    - meta_ads:write:status

storage:
  # SQLite path relative to project root (or absolute)
  db_path: var/seleric_mcp.db

defaults:
  # Injected when metrics_query has no brand filter (default tenant: Tilting Heads).
  # Other brands: Sniff Theory=26, Urthend=25, Mannmore=27, The Billy Company=24 —
  # see catalogue/brands.yaml; pass brand_id filter when the user names one.
  brand_id: "20"

tunables:
  # Term-resolution confidence bands (SequenceMatcher ratio, 0..1)
  resolve_auto_threshold: 0.85
  resolve_ambiguous_threshold: 0.60
  resolve_runner_up_margin: 0.05
  # Query limits / timeouts — 0 default_row_limit = unlimited when limit omitted
  default_row_limit: 0
  max_row_limit: 100000
  cube_timeout_seconds: 120
  # Stored query results and action idempotency windows
  result_ttl_minutes: 60
  idempotency_window_hours: 24
  # Insight engine
  top_movers_limit: 10
  anomaly_sigma: 3.0
  anomaly_min_points: 14
  # Freshness resource cache + fail-closed gate
  freshness_cache_ttl_seconds: 600
  freshness_enforcement: true
  freshness_grace_days: 1

# Terminal / web chat clients (scripts/chat_*.py). API key stays in .env.
# One Azure AI Foundry endpoint serves every model below — routing just swaps
# the model name. `deployment` is the legacy single-model fallback used when
# the `llm` section is absent.
azure:
  endpoint: https://llama4-maverick-prod-resource.cognitiveservices.azure.com
  deployment: gpt-5-mini
  api_version: 2024-12-01-preview

# Task-tier model routing + client-side rate limiting (see src/seleric_mcp/llm/).
# Models within a tier are tried left-to-right; the first with rate-limit
# headroom wins. On a 429 we fail over immediately to the next, then to the
# global fallback. Each model has its own independent bucket.
llm:
  tiers:
    # Fast/cheap models drive the agentic tool-calling loop.
    tools: [gpt-4o-code, DeepSeek-V4-Flash]
    # Stronger models produce the final synthesis / answer pass.
    reasoning: [gpt-5-mini, DeepSeek-V4-Pro]
  # Last resort for any tier when everything above is exhausted.
  fallback: Kimi-K2.6
  # Per-model limits (each model independent). Provider caps: 20k TPM, 20 RPM.
  limits:
    requests_per_minute: 20
    tokens_per_minute: 20000
  # Tokens reserved per call for the not-yet-generated completion.
  completion_reserve: 1024
  # Optional per-model overrides, e.g.:
  # model_limits:
  #   Kimi-K2.6: { requests_per_minute: 10, tokens_per_minute: 10000 }

chat:
  max_tool_rounds: 1100
  web_port: 8766
  tool_preview_chars: 4000

# OpenMetadata sidecar (metadata only — not used for metric math).
# Auth token: OM_JWT_OR_PAT in .env / .env.local
openmetadata:
  base_url: http://127.0.0.1:8585
  registry_file: catalogue/openmetadata/registry.yaml
