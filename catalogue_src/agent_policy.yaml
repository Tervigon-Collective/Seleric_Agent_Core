# Agent policy per catalogue metric. Hand-authored; copied onto catalogue/metrics/*.yaml (direction_bad, agent_domain).
#   direction_bad: which way is bad for the business ("up" = a rise is bad, e.g. a cost; "down" = a fall is bad, e.g. sales).
#                  Unset means "up" for the agent.
#   domain:        the swarm domain whose agent owns the metric, only where it differs from the one the catalogue
#                  category gives (commerce, attribution, funnel, product, performance, finance, customer, operations).
# This replaces Seleric_Agent/config/metric_registry.yaml (retired 2026-10-26): the catalogue is the only metric registry.
