# THE Cube + MCP stack for this host.
# Cube YAML lives in /opt/seleric/mage-ai/infra/cube (not this repo).
# Do not start mage-ai/infra/cube/docker-compose.yml or mcp_stack Cube here —
# both would fight :4001 / duplicate the semantic layer.
#
#   docker compose up -d
#   uv run python scripts/smoke_cube.py
#
# Public:
#   https://mcp.seleric.com/mcp   → 127.0.0.1:8765  (Agent Core, on cube-v2 + catalogue_v2)
#   https://mcp.seleric.com/cube/ → 127.0.0.1:4001  (v1 cube service; seleric_systems daily_pnl.*)
name: seleric-mcp

services:
  cube:
    image: cubejs/cube:latest
    container_name: seleric-mcp-cube-1
    restart: unless-stopped
    volumes:
      - ../mage-ai/infra/cube/model:/cube/conf/model:ro
      - ../mage-ai/infra/cube/cube.js:/cube/conf/cube.js:ro
    env_file:
      - ../mage-ai/infra/cube/.env
    ports:
      - "127.0.0.1:${CUBE_HOST_PORT:-4001}:4000"
    extra_hosts:
      - "clickhouse.seleric.com:72.61.228.168"
      - "host.docker.internal:host-gateway"

  # Semantic v2 Cube (doc/semantic_v2): conformed model in mage-ai/infra/cube/model_v2, serve-only
  # ClickHouse login (cube_serve via .env.v2), pinned image. The agent moves here at the Phase 5 cutover;
  # v1 `cube` stays for seleric_systems (daily_pnl.* via nginx /cube/).
  cube-v2:
    image: cubejs/cube:v1.6.48
    container_name: seleric-mcp-cube-v2-1
    restart: unless-stopped
    # Mount the stable parent (tracked on every branch) and select model_v2 inside it: a
    # directory bind mount of model_v2 itself goes stale when git deletes and recreates
    # that folder on a branch switch (Cube then serves an empty model, 2026-10-04).
    volumes:
      - ../mage-ai/infra/cube:/cube/conf/src:ro
      - ../mage-ai/infra/cube/cube.js:/cube/conf/cube.js:ro
    env_file:
      - ../mage-ai/infra/cube/.env
      - ../mage-ai/infra/cube/.env.v2
    environment:
      CUBEJS_SCHEMA_PATH: src/model_v2
      # Semantic SQL (Postgres-protocol). Agent talks via /cubejs-api/v1/cubesql REST;
      # psql/BI clients use this port. See doc/semantic_v2/PHASE6.md.
      CUBEJS_PG_SQL_PORT: "15432"
      CUBEJS_CUBESTORE_URL: ws://cubestore:3030
    ports:
      - "127.0.0.1:${CUBE_V2_HOST_PORT:-4002}:4000"
      - "127.0.0.1:${CUBE_V2_SQL_PORT:-15432}:15432"
    extra_hosts:
      - "clickhouse.seleric.com:72.61.228.168"

  # Semantic v3 Cube (doc/semantic_v3, Phase 5): model_v3 + cube_v3.js (brand scope plus the capability refusals of refusals_v3.json), dev mode OFF,
  # same serve-only login as cube-v2 (SELECT only; no pre-aggregations are defined because Cube's ClickHouse driver would CREATE TABLE in the source DB).
  # Runbook: after a model edit, `docker restart seleric-mcp-cube-v3-1`, then regenerate the catalogue. The MCP moves here at the Phase 8 cutover
  # (rollback = env flip); until then this service is parallel and unused. Stays on the semantic-v3 branch until cutover (a push to main triggers a deploy).
  cube-v3:
    image: cubejs/cube:v1.6.48
    container_name: seleric-mcp-cube-v3-1
    restart: unless-stopped
    volumes:
      - ../mage-ai/infra/cube:/cube/conf/src:ro
      - ../mage-ai/infra/cube/cube_v3.js:/cube/conf/cube.js:ro
    env_file:
      - ../mage-ai/infra/cube/.env
      - ../mage-ai/infra/cube/.env.v2
    environment:
      CUBEJS_DEV_MODE: "false"
      CUBEJS_SCHEMA_PATH: src/model_v3
      CUBEJS_PG_SQL_PORT: "15432"
      CUBEJS_CUBESTORE_URL: ws://cubestore:3030
    ports:
      - "127.0.0.1:${CUBE_V3_HOST_PORT:-4003}:4000"
      - "127.0.0.1:${CUBE_V3_SQL_PORT:-15433}:15432"
    extra_hosts:
      - "clickhouse.seleric.com:72.61.228.168"

  mcp:
    build: .
    image: seleric-mcp-mcp
    container_name: seleric-mcp-mcp-1
    restart: unless-stopped
    depends_on:
      - cube-v2
    env_file:
      - .env
    environment:
      # Semantic v2 (doc/semantic_v2, Phase 5 cutover 2026-10-04): catalogue_v2 on Cube v2.
      # Rollback: CUBE_API_URL http://cube:4000 + drop SELERIC_CATALOGUE_DIR (v1 catalogue/ stays shipped).
      CUBE_API_URL: http://cube-v2:4000
      # Semantic SQL (Phase 6): Postgres-protocol SQL API on cube-v2:15432.
      # Dev default matches CUBEJS_DEV_MODE=true (user/password). Prod: set a real DSN.
      CUBE_SQL_DSN: postgresql://user:password@cube-v2:15432/cube
      SELERIC_CATALOGUE_DIR: catalogue_v2
      SELERIC_MCP_DB: /data/seleric_mcp.db
      OPENMETADATA_BASE_URL: http://host.docker.internal:8585
      # FastMCP DNS-rebinding / CORS — same public domain via nginx
      # mcp:* = in-network callers (Seleric_Agent api/recovery via seleric-mcp_default)
      MCP_ALLOWED_HOSTS: mcp.seleric.com,127.0.0.1:*,localhost:*,mcp:*
      MCP_ALLOWED_ORIGINS: https://mcp.seleric.com,http://127.0.0.1:*,http://localhost:*
    volumes:
      - ./catalogue:/app/catalogue:ro
      - ./catalogue_v2:/app/catalogue_v2:ro
      # QueryPlanner.load_dataset_contracts() reads catalogue_v2_src/datasets.yaml
      - ./catalogue_v2_src:/app/catalogue_v2_src:ro
      # Semantic v3 (Phase 8 cutover is an env flip, not a rebuild): shipped now, read only when
      # SELERIC_CATALOGUE_DIR=catalogue_v3 and CUBE_API_URL=http://cube-v3:4000
      - ./catalogue_v3:/app/catalogue_v3:ro
      - ./catalogue_v3_src:/app/catalogue_v3_src:ro
      - ./config.yaml:/app/config.yaml:ro
      - mcp-data:/data
    ports:
      - "127.0.0.1:8765:8765"

  # Cube Store: pre-aggregation cache for model_v2 (Phase 6).
  cubestore:
    image: cubejs/cubestore
    container_name: seleric-mcp-cubestore-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - cubestore-data:/cube/conf/.cubestore

volumes:
  mcp-data:
  cubestore-data:
