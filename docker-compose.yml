# Canonical Cube model: mage-ai/infra/cube ONLY.
# Base_Agent/cube/model is a stub — do not mount ./cube here.
#
#   docker compose up -d --build --force-recreate
#   uv run python scripts/smoke_cube.py
#
# Public (unchanged nginx):
#   https://mcp.seleric.com/mcp   → 127.0.0.1:8765
#   https://mcp.seleric.com/cube/ → 127.0.0.1:4001
#
# Note: if mage-cube is already bound to 127.0.0.1:4001, skip the cube service
# and point CUBE_API_URL / config.yaml at that instance instead.
name: seleric-mcp

services:
  cube:
    image: cubejs/cube:latest
    container_name: seleric-mcp-cube-1
    restart: unless-stopped
    volumes:
      - ../data_platform/mage-ai/infra/cube/model:/cube/conf/model:ro
      - ../data_platform/mage-ai/infra/cube/cube.js:/cube/conf/cube.js:ro
    env_file:
      - ../data_platform/mage-ai/infra/cube/.env
    ports:
      - "127.0.0.1:${CUBE_HOST_PORT:-4001}:4000"
    extra_hosts:
      - "clickhouse.seleric.com:72.61.228.168"
      - "host.docker.internal:host-gateway"

  mcp:
    build: .
    image: seleric-mcp-mcp
    container_name: seleric-mcp-mcp-1
    restart: unless-stopped
    depends_on:
      - cube
    env_file:
      - .env
    environment:
      # In-compose Cube (not host loopback)
      CUBE_API_URL: http://cube:4000
      SELERIC_MCP_DB: /data/seleric_mcp.db
      OPENMETADATA_BASE_URL: http://host.docker.internal:8585
      # FastMCP DNS-rebinding / CORS — same public domain via nginx
      MCP_ALLOWED_HOSTS: mcp.seleric.com,127.0.0.1:*,localhost:*
      MCP_ALLOWED_ORIGINS: https://mcp.seleric.com,http://127.0.0.1:*,http://localhost:*
    volumes:
      - ./catalogue:/app/catalogue:ro
      - ./config.yaml:/app/config.yaml:ro
      - mcp-data:/data
    ports:
      - "127.0.0.1:8765:8765"

volumes:
  mcp-data:
