# Reviewed exceptions for scripts/reconcile_layers.py.
#
# Key is "<CODE>:<subject>" exactly as the report prints it; the value is why the
# gap is accepted. A waived finding still appears in the report, marked WAIVED,
# and never gates CI — so accepted debt stays visible and attributable rather
# than vanishing. Delete the entry when the gap is closed.
#
# Do NOT waive to quiet a real gap. Waive only when the object is genuinely not
# meant to reach the serve layer.

waivers:
  # Superseded upstream: the breakdown fact is served through the mart built on
  # top of it (gold.mart_meta_ad_breakdown_daily -> serve.meta_ads_breakdown_daily).
  GOLD_NOT_SERVED:gold.fct_meta_ads_breakdown_daily: >
    Upstream of gold.mart_meta_ad_breakdown_daily, which is served as
    serve.meta_ads_breakdown_daily. Serving both would duplicate the same grain.
  GOLD_NOT_SERVED:gold.fct_daily_pnl: >
    Broken cost basis (negative COGS, net_profit > net_revenue, spend columns 0
    for history). Superseded by serve.canonical_pnl. Do not serve.
  GOLD_NOT_SERVED:gold.fct_product_variant_cost: >
    Cost lives on product_performance / order items; serving the dim-like cost
    table would duplicate grain. Keep gold-only.
  GOLD_NOT_SERVED:gold.fct_product_variant_cost_history: >
    Cost history is consumed into order-item COGS; serving both duplicates grain.
  GOLD_NOT_SERVED:gold.fct_amazon_sp_settlements: >
    Upstream of Finance.AmazonAccounts (amazon_settlement_reconciliation). Serving
    both would duplicate the settlement grain.
  GOLD_NOT_SERVED:gold.fct_amazon_sp_settlement_lines: >
    Upstream of Finance.AmazonAccounts settlement reconciliation. Keep gold-only.
  GOLD_NOT_SERVED:gold.fct_order_attribution_credit: >
    Superseded by gold.fct_order_attribution last-touch; multi-touch already on
    serve.attribution_paths.
  GOLD_NOT_SERVED:gold.fct_amazon_ads_ad_order_attribution: >
    Platform-reported Amazon ad-order attribution. Attribution boundary — ACOS/ROAS
    stay in gold, same as campaign-day.
  GOLD_NOT_SERVED:gold.mart_ad_funnel_daily: >
    Unused growth mart; session funnel is served from fct_session_funnel /
    mart_funnel_daily. No dashboard card.
  GOLD_NOT_SERVED:gold.mart_landing_page_daily: >
    Unused growth mart. Landing path already on session_funnel. No dashboard card.
  GOLD_NOT_SERVED:gold.mart_meta_ad_neurotag_daily: >
    Unused neurotag mart. Certified path is dim_ad_neurohack_map arrays on Meta
    daily/hourly/breakdown. No dashboard card.
  GOLD_NOT_SERVED:gold.mart_meta_ad_daily_combined: >
    Unused combined Meta mart. Certified path is serve.meta_ads_daily +
    meta_ad_attribution. No dashboard card.
  GOLD_NOT_SERVED:gold.mart_meta_ad_daily_performance: >
    Unused Meta performance mart. Certified path is serve.meta_ads_daily.
  GOLD_NOT_SERVED:gold.mart_geo_product_opportunity: >
    Unused geo opportunity mart. No dashboard card; do not port.
  GOLD_NOT_SERVED:gold.mart_geo_whitespace: >
    Unused geo whitespace mart. No dashboard card; do not port.
  GOLD_NOT_SERVED:gold.mart_city_campaign_attributed: >
    Unused city-campaign mart. No dashboard card; do not port.
  GOLD_NOT_SERVED:gold.mart_city_product_sales: >
    Unused city-product mart. No dashboard card; do not port.
  GOLD_NOT_SERVED:gold.mart_city_weather_sales_lag: >
    Unused city-weather lag mart. No dashboard card; do not port.
  GOLD_NOT_SERVED:gold.fct_city_weather_day: >
    Weather lookup with no dashboard card. Do not port onto the certified path.
  NOT_DENORMALISED:serve.google_ads_hourly -> gold.dim_customers: >
    google_ads_hourly.customer_id is the Google Ads customer/account id, not a
    Shopify customer_id. Joining dim_customers would be a false grain match.
  CUBE_NOT_IN_VIEW:serve_commerce_order_events: >
    Join-only cube under commerce_orders (serve_commerce_orders.serve_commerce_order_events).
    Not a standalone certified view.
  CUBE_NOT_IN_VIEW:serve_product_ad_spend_daily: >
    Restore-later cube; serve.product_ad_spend_daily was removed 2026-09-07.
    Keep the cube for restore, do not certify without a contract.
  NOT_DENORMALISED:serve.ad_channel_pnl_daily -> gold.dim_adset_geo: >
    dim_adset_geo is 1:many targeting (included/excluded cities and regions).
    Joining it would explode campaign/adset/ad P&L grain. Arrays only if grain holds.
  NOT_DENORMALISED:serve.meta_ads_daily -> gold.dim_adset_geo: >
    dim_adset_geo is 1:many geo targeting. Do not join onto ad-day delivery grain.
  NOT_DENORMALISED:serve.meta_ads_status_history -> gold.dim_ad: >
    Status history already carries entity_name/status at the snapshot. Joining
    current dim_ad would mix present-state labels onto historical change rows.
  NOT_DENORMALISED:serve.meta_ads_status_history -> gold.dim_ad_neurohack_map: >
    Snapshot change log, not ad-day delivery. Neurohack tags belong on meta_ads_daily.
  NOT_DENORMALISED:serve.meta_ads_status_history -> gold.dim_adset: >
    Snapshot change log already has entity_name/status; current dim_adset would drift.
  NOT_DENORMALISED:serve.meta_ads_status_history -> gold.dim_adset_geo: >
    dim_adset_geo is 1:many targeting. Out of grain for a status-change log.
  NOT_DENORMALISED:serve.meta_ads_status_history -> gold.dim_campaign: >
    Snapshot change log already has campaign_id and entity_name. Current dim_campaign
    would overwrite historical names/status.
  NOT_DENORMALISED:serve.meta_ads_status_history -> gold.dim_creative: >
    Snapshot change log; creative attributes belong on meta_ads_daily, not history.
  NOT_DENORMALISED:serve.google_ads_status_history -> gold.dim_ad: >
    Snapshot change log already has entity_name/status. Current dim_ad would drift.
  NOT_DENORMALISED:serve.google_ads_status_history -> gold.dim_ad_neurohack_map: >
    Neurohack map is Meta-only; Google status history must not join it.
  NOT_DENORMALISED:serve.google_ads_status_history -> gold.dim_campaign: >
    Snapshot change log already has entity_name/status. Current dim_campaign would drift.
  GOLD_NOT_SERVED:gold.dim_adset_geo: >
    1:many geo targeting. Certified path does not explode ad-day grain. Keep gold-only.
  GOLD_NOT_SERVED:gold.dim_amazon_listings: >
    Listing master data; Amazon item grain is serve.amazon_order_items. Keep gold-only.
  GOLD_NOT_SERVED:gold.dim_amazon_settlement_charge_type: >
    Upstream taxonomy of AmazonAccounts settlement lines. Keep gold-only.
  GOLD_NOT_SERVED:gold.dim_neurohack: >
    Certified path uses dim_ad_neurohack_map arrays on Meta serve ports, not this dim.
  GOLD_NOT_SERVED:gold.dim_shopify_inventory_items: >
    Inventory master data; not on the certified commerce/product path. Keep gold-only.
  GOLD_NOT_SERVED:gold.dim_th_sku_seasonal_map: >
    Seasonal SKU map with no dashboard card. Keep gold-only.
  GOLD_NOT_SERVED:gold.v_geo_discovery: >
    Unused geo discovery view. No dashboard card; do not port.
  GOLD_NOT_SERVED:gold.v_geo_region_rollup: >
    Unused geo region rollup. No dashboard card; do not port.
