views:
- name: commerce
  title: Commerce
  date_dimension: order_date
  datetime_dimension: order_created_at
  freshness:
    source: Cube v3 view commerce (serve.* via cube_serve)
    expected_cadence: every 5 minutes after gold (semantic v3 tables), IST
  description: 'Shopify sale orders: order counts, tax-inclusive AOV / total sales (labelled), ex-GST gross / net
    sales and deductions from the ledger, cancelled / RTO / returned counts and revenue, payment mix, new customers,
    customer sequence. ORDER date by default (order_date); event_date (on order_events) is when cancels / RTOs /
    returns happened, Undated shown. Slice by traffic, campaign and geography.'
- name: finance
  title: Finance
  date_dimension: order_date
  freshness:
    source: Cube v3 view finance (serve.* via cube_serve)
    expected_cadence: every 5 minutes after gold (semantic v3 tables), IST
  description: 'Finance P&L for BOTH date axes (semantic v3, D-28): net sales, deductions (cancelled / RTO / returned
    separately), product and fulfilment cost, contribution before and after ads, MER / ROAS, order counts. order_date
    (default) is the cohort of orders placed; event_date is when cancels / RTOs / returns happened (Undated shown,
    D-32). Use one of the two time dimensions per query. Ad spend is delivery-dated and never allocated (D-07).
    Slice by finance_channel, sub_channel, is_paid, is_new_customer, shipping_region, payment_bucket; drill campaign
    → ad set → ad.'
- name: product_profit
  title: Product Profit
  date_dimension: order_date
  freshness:
    source: Cube v3 view product_profit (serve.* via cube_serve)
    expected_cadence: every 5 minutes after gold (semantic v3 tables), IST
  description: 'Product / variant P&L before ads on BOTH date axes (semantic v3, D-34): net sales, cancelled / RTO
    / returned, product and fulfilment cost, contribution margin, order counts by product, SKU or product type,
    sliced by the order''s channel, traffic and campaign. order_date (default) or event_date; Undated shown (D-32).
    Allocated ad spend / ROAS / net profit after ads are the separate cohort-only allocated family (D-19o, D-34).'
- name: product_ads
  title: Product Ads
  date_dimension: report_date
  freshness:
    source: Cube v3 view product_ads (serve.* via cube_serve)
    expected_cadence: every 5 minutes after gold (semantic v3 tables), IST
  description: 'Allocated product-ad family (D-19o): ad spend, ROAS, MER, CAC, net profit after allocated ads and
    delivery counts by product, campaign and ad. A model (campaign-day spend spread over credited sale lines), ORDER-DATE
    ONLY (event_date refused, D-34), shown only on explicit request. Unallocated spend is its own row so totals
    equal delivery.'
- name: paid_media
  title: Paid Media
  date_dimension: report_date
  freshness:
    source: Cube v3 view paid_media (serve.* via cube_serve)
    expected_cadence: 5-min gold sync after dbt orchestrator; platform account day
  description: 'Ad delivery (Meta + Google) by delivery date: spend, impressions, clicks, CTR, CPC, CPM. Filter
    ad_platform for one platform; drill campaign → ad set → ad.'
- name: paid_media_hourly
  title: Paid Media Hourly
  date_dimension: report_date
  datetime_dimension: report_hour
  freshness:
    source: Cube v3 view paid_media_hourly (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: Hourly binding of paid_media (granularity hour on report_hour, IST). Includes website landing page
    views by IST hour.
- name: paid_media_breakdowns
  title: Paid Media Breakdowns
  date_dimension: report_date
  freshness:
    source: Cube v3 view paid_media_breakdowns (serve.* via cube_serve)
    expected_cadence: 5-min gold sync after dbt orchestrator; platform account day
  description: Meta delivery by audience breakdown (age, gender, placement, device, geo). Filter one breakdown_type.
- name: paid_media_changes
  title: Paid Media Changes
  date_dimension: changed_at
  freshness:
    source: Cube v3 view paid_media_changes (serve.* via cube_serve)
    expected_cadence: event-driven (rows only when an ad entity changes)
  description: Ad change log (status / budget / bid strategy changes), Meta + Google.
- name: web_sessions
  title: Web Sessions
  date_dimension: session_date
  datetime_dimension: session_start
  freshness:
    source: Cube v3 view web_sessions (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Web sessions (Snowplow) by session date: sessions, funnel rates, add-to-carts, time to convert.
    Slice by traffic source and campaign.'
- name: web_funnel
  title: Web Funnel
  date_dimension: report_date
  freshness:
    source: Cube v3 view web_funnel (serve.* via cube_serve)
    expected_cadence: daily after dw/mart run; 26h SLA
  description: 'Daily funnel mart: bounce rate, Snowplow purchases and revenue by day and channel / platform.'
- name: web_events
  title: Web Events
  date_dimension: report_date
  freshness:
    source: Cube v3 view web_events (serve.* via cube_serve)
    expected_cadence: daily after dw/mart run; 26h SLA
  description: Daily web event counts by event type (page views, product views, add-to-carts, searches).
- name: web_event_detail
  title: Web Event Detail
  date_dimension: event_date
  datetime_dimension: event_timestamp
  freshness:
    source: Cube v3 view web_event_detail (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Event-level web analytics (per page / product): events per session and event drill-through.'
- name: attribution
  title: Attribution
  date_dimension: order_date
  datetime_dimension: touch_ts
  freshness:
    source: Cube v3 view attribution (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Pre-purchase touchpoints by order date: touches and orders with touchpoints, sliced by the touch''s
    traffic source and its session''s campaign.'
- name: attribution_paths
  title: Attribution Paths
  date_dimension: order_date
  freshness:
    source: Cube v3 view attribution_paths (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Attribution paths per order and model: average touches per path, conversion paths; sliced by the
    order''s last-touch traffic and campaign.'
- name: customers
  title: Customers
  date_dimension: last_order_at
  freshness:
    source: Cube v3 view customers (serve.* via cube_serve)
    expected_cadence: every 5 minutes after gold (semantic v3 tables), IST
  description: 'Customers with lifetime totals: customers, repeat customers, repeat rate.'
- name: returns
  title: Returns
  date_dimension: refund_date
  freshness:
    source: Cube v3 view returns (serve.* via cube_serve)
    expected_cadence: every 5 minutes after gold (semantic v3 tables), IST
  description: 'Refund events by refund date (cash clock, ignores date_axis): refund count, refunded amount, returns
    value, refunded lines and recovered COGS; drill to product. Refunds of exchanged items are excluded (exchanges
    are not returns, D-01) and shown in exchange_refund_count. Slice by the order''s v3 outcome (RTO, cancelled,
    returned …) and type.'
- name: payments
  title: Payments
  date_dimension: transaction_date
  freshness:
    source: Cube v3 view payments (serve.* via cube_serve)
    expected_cadence: every 5 minutes after gold (semantic v3 tables), IST
  description: Payment transactions by transaction date.
- name: funnel_orders
  title: Funnel Orders
  date_dimension: order_date
  freshness:
    source: Cube v3 view funnel_orders (serve.* via cube_serve)
    expected_cadence: daily after dw/mart run; 26h SLA
  description: 'Funnel purchases and revenue per order (order date): the funnel mart''s purchases sliced by the
    order''s traffic, campaign and products (basket_*: orders containing the product).'
- name: stock_movements
  title: Stock Movements
  date_dimension: movement_date
  freshness:
    source: Cube v3 view stock_movements (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Stock ledger: units in / out / net by movement date (IST), by movement type, reference, SKU and
    warehouse. Native clock; no order-date axis.'
- name: stock_levels
  title: Stock Levels
  date_dimension: last_movement_date
  freshness:
    source: Cube v3 view stock_levels (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Current stock now: on hand, reserved, available, FIFO stock value, out-of-stock and slow-mover items.
    A snapshot as of the last sync; history by day comes from stock_movements (closing quantities are in the gold
    fct_inventory_item_daily).'
- name: stock_layers
  title: Stock Layers
  date_dimension: receipt_date
  freshness:
    source: Cube v3 view stock_layers (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'FIFO receipt layers: received vs remaining units and landed value by receipt date, vendor and age.'
- name: stock_sync_errors
  title: Stock Sync Errors
  date_dimension: error_date
  freshness:
    source: Cube v3 view stock_sync_errors (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: Inventory posting failures from Shopify / Amazon (open vs resolved, hours to resolve).
- name: purchase_orders
  title: Purchase Orders
  date_dimension: order_date
  freshness:
    source: Cube v3 view purchase_orders (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Purchase requests / POs: counts, value, open and overdue, fill rate and lead times by vendor and
    status.'
- name: purchase_order_lines
  title: Purchase Order Lines
  date_dimension: order_date
  freshness:
    source: Cube v3 view purchase_order_lines (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Purchase request lines: ordered vs received units and value by product, vendor and QC status.'
- name: quality_checks
  title: Quality Checks
  date_dimension: inspection_date
  freshness:
    source: Cube v3 view quality_checks (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Inbound quality checks: damage, shortfall and rejection rates by vendor, product and inspection
    date.'
- name: vendors
  title: Vendors
  date_dimension: vendor_created_date
  freshness:
    source: Cube v3 view vendors (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: Vendor directory (name, GSTIN, status).
- name: procurement_sampling
  title: Procurement Sampling
  date_dimension: variant_created_date
  freshness:
    source: Cube v3 view procurement_sampling (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Procurement sampling pipeline: variants, MRP / COGS / margin, MOQ and sample quantities by product
    status.'
- name: pdp_visits
  title: PDP Visits
  date_dimension: page_view_date
  freshness:
    source: Cube v3 view pdp_visits (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Product-page views (bots excluded) from the tracker cutoff 2026-10-26 18:19 UTC: views, engaged and add-to-cart
    rates, credited orders; by product, template, layout, device, channel and campaign. Measured, not modelled.'
- name: pdp_section_reach
  title: PDP Section Reach
  date_dimension: page_view_date
  freshness:
    source: Cube v3 view pdp_section_reach (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: Reach and dwell per product-page section instance (gallery, buy_box, delivery, features, size_guide, faq, reviews,
    recommendations, banner, page_end). Pool across products by template and layout; per-product rows are small.
- name: pdp_interaction_log
  title: PDP Interactions
  date_dimension: event_date
  freshness:
    source: Cube v3 view pdp_interaction_log (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: Tracked product-page interactions (variant select, media change, accordions, offers, add-to-cart / buy-now
    clicks) with the section they happened in.
- name: listing_card_events
  title: Listing Card Events
  date_dimension: event_date
  freshness:
    source: Cube v3 view listing_card_events (serve.* via cube_serve)
    expected_cadence: hourly after gold sync, IST
  description: 'Collection / home / search card interactions: quick add, add to cart, Buy it now, product click. Empty until
    the theme flag seleric_listing_enabled is on.'
