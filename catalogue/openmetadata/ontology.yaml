# DERIVED FIELDS: each domain's owner_team, data_products and cube_views are
# generated from mage-ai/openmetadata/domains|products/*.yml via
# scripts/sync_catalogue_from_sources.py and overlaid at load time. To add a Cube
# view to a domain, declare it as a `- cube_view:` output port on the owning data
# product — do NOT add it here.
# Entries kept here that no data product claims still work, and are reported as
# VIEW_HAND_MAINTAINED until the view gets an owner.
# Still hand-authored here: grain, date_axes, notes, entity_clusters,
# attribution_boundary, grain_defaults and unclustered — business semantics no system derives.
# Business ontology crosswalk (agent catalogue ↔ OpenMetadata glossaries).
# Full OM specs: mage-ai/openmetadata/glossary/*.yml

domains:
  Commerce:
    om_glossary: Commerce
    owner_team: commerce-data-team
    data_products: [CommercePerformance]
    cube_views:
      - commerce_orders
      - commerce_performance
      - orders_all_channels
    grain: Order
    date_axes: [placement, event]
  Product:
    om_glossary: Product
    owner_team: commerce-data-team
    data_product: ProductPerformance
    cube_views: [product_performance]
    grain: OrderLine
    date_axes: [placement]
  PaidMedia:
    om_glossary: Paid Media
    owner_team: growth-paid-media
    data_products: [MetaAdsPerformance, GoogleAdsPerformance]
    cube_views:
      - meta_ad_performance
      - meta_ad_performance_hourly
      - meta_ad_breakdown_performance
      - google_ad_performance
      - google_ad_performance_hourly
    grain: Daily (+ Meta/Google hourly)
    date_axes: [report_date]
    notes: >
      Delivery metrics only — platform attribution excluded from certified ports.
  Attribution:
    om_glossary: Attribution
    owner_team: growth-attribution
    data_products: [MarketingAttribution, ChannelAttribution]
    cube_views: [order_attribution, meta_ad_attribution, touchpoints, attribution_paths, channel_attribution, ad_channel_pnl]
    grain: Order (+ Meta ad-day + channel-day + ad-grain P&L)
    date_axes: [order_date, report_date]
    notes: >
      Last-touch, first-party revenue, Shopify orders + Meta/Google touchpoints.
      ChannelAttribution adds the channel-day closed set (meta/google/organic_shopify/unattributed).
  Customer:
    om_glossary: Customer
    owner_team: growth-retention
    data_products: [CustomerIntelligence, CustomerData]
    cube_views: [customer_ltv, purchase_sequence, customer_data]
    grain: Customer (+ Order sequence + profile)
    date_axes: [last_order_at, order_date]
    notes: >
      Hashed PII only; Shopify customers only. CustomerData = profile only.
  WebAnalytics:
    om_glossary: Web Analytics
    owner_team: growth-analytics
    data_products: [SessionFunnel, EventStream]
    cube_views: [session_funnel, funnel_daily, web_events, web_events_daily]
    grain: Session + Event (+ channel-day rollups)
    date_axes: [session_date, event_date, report_date]
    notes: >
      Snowplow website behaviour; funnel stages are event-based and deeper
      stages can skip earlier ones. Rates are ratio-of-aggregates only.
      EventStream is the event-grain companion (paths only, no visitor
      identifiers); server-side purchase events have no session.
  Finance:
    om_glossary: Finance
    owner_team: finance-team
    data_products: [CanonicalPnl]
    cube_views:
      - canonical_pnl
    grain: Daily
    date_axes: [report_date]
    notes: >
      CanonicalPnl InProgress.
  Operations:
    om_glossary: Operations
    owner_team: ops-team
    data_product: ReturnsRefunds
    cube_views: [refund_events, return_lifecycle]
    grain: RefundEvent (+ RefundLine port)
    date_axes: [refund_date]
    notes: >
      Shopify refunds/returns only. Shopify's cancelled_orders/refunded_orders/
      returns_cancels live on Commerce.commerce_orders rather than
      Operations.refund_events.

entity_clusters:
  commerce_order:
    glossary: Commerce.CommerceOrder
    related: [Commerce.EligibleOrder, Commerce.ActiveOrder, Commerce.CancelledOrder, Commerce.ReturnedOrder]
    catalogue_metrics: [orders, active_orders, new_customer_orders]
  commerce_revenue:
    glossary: Commerce.NetSales
    related: [Commerce.GrossSales, Commerce.TotalSales, Commerce.Discounts, Commerce.ReturnCancelRevenue]
    catalogue_metrics: [commerce_net_revenue, commerce_net_revenue_daily, gross_sales, total_sales, discounts, return_cancel_revenue]
  commerce_events:
    glossary: Commerce.EventAxis
    related: [Commerce.CancelledOrder, Commerce.ReturnedOrder, Commerce.returnsCancels]
    catalogue_metrics: [cancelled_orders, refunded_orders, returns_cancels]
  product_line:
    glossary: Product.ProductOrder
    related: [Product.UnitsSold, Product.ProductNetRevenue, Product.ProductCOGS]
    catalogue_metrics: [product_orders, units_sold, product_net_revenue, product_cogs, returned_units, product_return_revenue]
  product_margin:
    glossary: Product.ProductGrossProfit
    related: [Product.ProductGrossMargin, Product.AverageSellingPrice]
    catalogue_metrics: [product_gross_profit, product_gross_margin_pct, average_selling_price]
  paid_delivery:
    glossary: Paid Media.Spend
    related: [Paid Media.CTR, Paid Media.CPC, Paid Media.CPM, Paid Media.ReportDate, Paid Media.IsFinal]
    catalogue_metrics: [meta_spend, google_spend, meta_status_changes, google_status_changes]
  pnl_spend:
    glossary: Finance.Canonical P&L
    related: [Paid Media.Spend]
    cube_members: [canonical_pnl.meta_spend, canonical_pnl.google_spend, canonical_pnl.total_ad_spend]
  paid_video_meta:
    glossary: Paid Media.HookRate(Meta)
    related: [Paid Media.ThruPlay, Paid Media.HoldRate(Meta)]
    catalogue_metrics: [meta_hook_rate, meta_thruplays, meta_video_completion_rate, meta_hold_rate_15s]
  finance_pnl:
    glossary: Finance.NetProfit
    related: [Finance.GrossProfit, Finance.ContributionMargin, Finance.MER, Finance.NetCogs, Finance.CostCoverage]
    catalogue_metrics:
      - net_cogs
      - shipping_cost
      - packaging_cost
      - payment_gateway_fees
      - rto_cost
      - operating_cost
      - total_ad_spend
      - gross_profit
      - contribution_margin
      - net_profit
      - gross_margin_pct
      - contribution_margin_pct
      - net_margin_pct
      - mer
      - cost_coverage_pct
  order_attribution:
    glossary: Attribution.AttributedOrder
    related: [Attribution.AttributedNetRevenue, Attribution.AttributionRate, Attribution.LastTouch]
    catalogue_metrics:
      - attributed_orders
      - attributed_net_revenue
      - attributed_gross_revenue
      - attributed_refund_amount
      - attributed_new_customer_orders
      - touch_attributed_orders
      - attribution_rate
      - avg_attribution_confidence
      - attributed_aov
      - pre_purchase_touches
      - touch_distinct_orders
      - attribution_path_orders
      - avg_touch_count
  ad_channel_pnl:
    glossary: Attribution.AdChannelPnl
    related: [Attribution.AttributedNetRevenue, Paid Media.Spend, Finance.NetProfit]
    catalogue_metrics:
      - ad_channel_spend
      - ad_channel_orders
      - ad_channel_net_sales
      - ad_channel_net_profit
      - ad_channel_roas
  customer_ltv:
    glossary: Customer.LifetimeValue
    related: [Customer.RepeatCustomer, Customer.AcquisitionChannel, Customer.HashedPII]
    catalogue_metrics:
      - customers
      - repeat_customers
      - lifetime_net_revenue
      - lifetime_gross_revenue
      - lifetime_orders
      - avg_ltv
      - repeat_rate
      - avg_orders_per_customer
      - avg_days_since_last_order
  purchase_sequence:
    glossary: Customer.PurchaseSequence
    related: [Customer.LifetimeValue, Customer.RepeatCustomer]
    catalogue_metrics:
      - repeat_purchase_orders
      - first_orders
      - repeat_orders
      - repeat_purchase_net_revenue
      - repeat_order_share
      - avg_days_between_orders

attribution_boundary:
  excluded_from_certified:
    - platform_reported_purchases
    - platform_reported_roas
    - platform_reported_conversion_value
  om_glossary_term: Paid Media.Platform-ReportedConversion
  agent_policy: >
    Never answer ROAS/CPA/attributed revenue from platform-reported fields.
    Use the certified MarketingAttribution product (order_attribution /
    meta_ad_attribution — first-party revenue, last-touch, Meta/Google only)
    for attributed revenue.

# Grain-first defaults when an operator names a dimension and no measure.
# Agents must not invent these; catalogue_resolve_dimension + this block are
# the vocabulary. Hand-authored (same class as attribution_boundary).
grain_defaults:
  by_platform:
    when: >
      "ad performance" / "how are my ads doing" / "ad spend" / "roas by platform" /
      "paid media" with no single platform named.
    dimension_id: channel
    product: ChannelAttribution
    view: ad_channel_pnl
    value_space: meta/google (+ organic/unattributed rows present; filter to meta/google for paid ads)
    default_measures: [ad_channel_spend, ad_channel_roas, ad_channel_net_profit, ad_channel_orders]
    agent_policy: >
      Channel-agnostic ad-performance questions default to ad_channel_pnl sliced by channel so
      BOTH Meta and Google are returned — never answer "ad performance" from one platform's
      delivery view alone. For channel/period TOTALS sum all rows; for a campaign/adset/ad
      breakdown filter row_type='detail'. Drill order: channel → campaign → adset → ad (adset/ad
      are Meta-deep; Google resolves to campaign, with unplaceable spend in the is_unattributed
      bucket). For platform-specific creative/video/hourly delivery use meta_ad_performance /
      google_ad_performance.
  by_channel:
    when: unspecified "by channel" / "channel-wise" report with no measure named
    dimension_id: channel
    product: ChannelAttribution
    view: channel_attribution
    value_space: closed set (meta/google/organic_shopify/unattributed)
    default_measure: channel_orders
    revenue_companion: channel_net_revenue
    revenue_companion_status: draft
    agent_policy: >
      Do not invent this default. Unspecified by-channel grain is
      ChannelAttribution + dimension channel (closed set). Query channel_orders
      (certified) until channel_net_revenue is certified. Never slice
      commerce_net_revenue_daily, gross_sales, or orders by channel or
      lt_channel — those Shopify commerce metrics have no channel dimension.
    alternates:
      - dimension_id: lt_channel
        product: MarketingAttribution
        view: order_attribution
        measures: [attributed_net_revenue, attributed_orders]
        note: FINE last-touch (ig_feed/fb_feed/google_pmax/...) — not the closed set
      - dimension_id: channel
        product: CrossChannelCommerce
        views: [orders_all_channels, sales_all_channels]
        note: marketplace shopify
      - dimension_id: channel
        product: SessionFunnel
        views: [funnel_daily, session_funnel]
        note: FINE session/funnel channel (ig_feed, google_search, organic, ...)
      - dimension_id: channel
        product: ChannelAttribution
        view: channel_pnl
        measures: [meta_attribution_net_sales, google_attribution_net_sales]
        note: P&L Meta/Google/organic/unattributed — Attribution Analysis Overview

# Declared drill-down hierarchies: the legal drill order per axis and, for ad
# delivery, the per-platform depth ceiling. Agents drill in this order and degrade
# gracefully. non_drillable names non-additive / coarse-grain metrics that must
# never be broken out below their native grain (parts will not sum to the whole).
hierarchies:
  ad_delivery:
    view: ad_channel_pnl
    path: [channel, campaign_id, adset_id, ad_id]
    labels: {campaign_id: campaign_name, adset_id: adset_name, ad_id: ad_name}
    available_on:
      adset_id: [meta]
      ad_id: [meta]
    note: >
      Cross-platform ad economics (ad_channel_spend / ad_channel_roas /
      ad_channel_net_profit / ad_channel_orders / ad_channel_net_sales). Google
      resolves to campaign grain; deeper Meta creative/placement/hourly detail lives
      on meta_ad_performance / meta_ad_breakdown_performance / *_hourly. For channel or
      period TOTALS sum all rows; for a campaign/adset/ad breakdown filter
      row_type='detail' so the reconciliation residual is not a phantom campaign.
  time:
    path: [year, quarter, month, week, day, hour]
    note: >
      hour granularity only on the *_hourly paid-media views
      (meta_ad_performance_hourly / google_ad_performance_hourly); every other view
      stops at day.
  date_spine:
    note: >
      One logical "date" spans six physical day axes by domain — join cross-domain on
      the domain's native axis, never mix them. All are IST calendar days.
    by_domain:
      PaidMedia: report_date
      Finance: report_date
      Attribution: {orders: order_date, channel_day: report_date}
      Commerce: {orders: order_date, revenue_and_returns: event_date}
      Operations: refund_date
      WebAnalytics: {sessions: session_date, events: event_date}
  non_drillable:
    total_ad_spend: brand x day only (no campaign/ad grain) — drill via ad_channel_spend.
    mer: ratio, brand x day — never sum across campaigns; undefined below daily brand grain.
    net_roas: contribution ratio, brand x day — not additive.
    net_roas_all_channels: contribution ratio, brand x day — not additive; do not break out by campaign.
    gross_roas_all_channels: ratio, brand x day — not additive.
    be_roas_all_channels: ratio, brand x day — not additive.

# Metrics not listed in entity_clusters. Lookup order: by_metric, by_view,
# by_category, then default. Agents treat these as view-siblings, not a
# shared business object.
unclustered:
  default: >
    No entity cluster declared. Treat as a sibling of other metrics on the
    same Cube view, not as a shared business object.
  by_view:
    session_funnel: Session-grain funnel stages; rates are ratio-of-aggregates, not an entity cluster.
    funnel_daily: Channel-day funnel rollup; companion of SessionFunnel, not a shared object cluster.
    web_events: Event-grain EventStream counts; no durable visitor identity.
    web_events_daily: Daily EventStream rollup; distinct counts are not additive.
    refund_events: Shopify refund-event grain; return revenue oracle stays on Commerce.
    return_lifecycle: Refund-line companion of ReturnsRefunds; not clustered with commerce_events.
    channel_attribution: Channel-day attribution rollup with mixed GST basis; not last-touch order grain.
    customer_data: Profile/consent master data; lifetime metrics live on CustomerIntelligence.
    meta_ad_breakdown_performance: Placement/device/age breakdown of Meta delivery; parent cluster is paid_delivery.
    touchpoints: Pre-purchase journey touches; not last-touch credited orders.
    attribution_paths: Per-model conversion paths; last-touch credit is order_attribution.
    orders_all_channels: All-channels placement orders (Shopify); not a single cluster.
  by_category:
    paid_media_meta: Delivery/engagement siblings of paid_delivery (spend + Meta video are clustered).
    paid_media_google: Delivery siblings of paid_delivery (google_spend is clustered).
