instance:
  base_url: http://127.0.0.1:8585
  version: 1.13.1
  auth_env: OM_JWT_OR_PAT
agent_ready_tag: DataProduct.AgentReady
release_status_tag: ReleaseStatus.Certified
currency: INR
data_products:
- name: CommercePerformance
  domain: Commerce
  owner_team: commerce-data-team
  primary_serve_table: clickhouse.default.serve.commerce_orders
  contract: commerce_performance_contract_v1
  secondary_contracts:
  - commerce_order_events_contract_v1
  - commerce_performance_daily_contract_v1
  cube_views:
  - commerce_orders
  - commerce_performance
  platforms:
  - Shopify
  notes: 'Shopify-only by frozen dashboard-oracle policy. Amazon marketplace orders are the sibling product
    AmazonCommercePerformance (not unioned here).

    '
- name: AmazonCommercePerformance
  domain: Commerce
  owner_team: commerce-data-team
  primary_serve_table: clickhouse.default.serve.amazon_orders
  contract: amazon_orders_contract_v1
  secondary_contracts:
  - amazon_commerce_daily_contract_v1
  cube_views:
  - amazon_commerce_performance
  - amazon_daily_pnl
  - amazon_attribution_overview
  - amazon_orders
  - amazon_order_items
  - amazon_returns_daily
  - amazon_finance_charge_types_daily
  platforms:
  - AmazonSP
  notes: 'Marketplace-reported revenue INCLUDES GST. Never mix with Shopify ex-GST CommercePerformance
    without stating the basis. Ads stay on AmazonAdsPerformance. amazon_commerce_performance now also
    carries Amazon''s own cancelled/returned order axis (cancelled_orders on purchase_date, returned_orders
    + returned_revenue on refund-posted date; returns_cancels = the sum) — the Amazon-only counterpart
    to CommercePerformance''s Shopify event-date cancelled_orders/refunded_orders/returns_cancels/return_revenue,
    per the Seleric Dashboard Historical Analytics Amazon Seller Partner Returns / Cancellations cards.
    Amazon has no "cancelled revenue" figure — CANCELED orders are excluded from P&L entirely (₹0), unlike
    Shopify''s cancel_revenue. Pending customer refunds not yet posted to Amazon settlement (gold.int_amazon_return_reconciliation)
    are a Seleric Dashboard Node-Backend accrual overlay, not reflected in the certified Cube measure.

    '
- name: CrossChannelCommerce
  domain: Commerce
  owner_team: commerce-data-team
  primary_serve_table: clickhouse.default.serve.orders_all_channels
  contract: cross_channel_orders_contract_v1
  secondary_contracts:
  - sales_all_channels_contract_v1
  - returns_cancels_all_channels_contract_v1
  cube_views:
  - orders_all_channels
  - sales_all_channels
  - returns_cancels_all_channels
  platforms:
  - Shopify
  - AmazonSP
  notes: 'Shopify + Amazon SP unions on a single placement axis. BASIS WARNING: Shopify rows are ex-GST;
    Amazon SP rows INCLUDE GST. Never present a single cross-channel total as if one basis applied. Prefer
    CommercePerformance or AmazonCommercePerformance when the question does not span channels.'
- name: ProductPerformance
  domain: Product
  owner_team: commerce-data-team
  primary_serve_table: clickhouse.default.serve.product_performance
  contract: product_performance_contract_v1
  cube_views:
  - product_performance
  platforms:
  - Shopify
  notes: 'Amazon SP order lines and listings (gold.fct_amazon_order_items, gold.dim_amazon_listings) =
    V2 port.

    '
- name: MetaAdsPerformance
  domain: PaidMedia
  owner_team: growth-paid-media
  primary_serve_table: clickhouse.default.serve.meta_ads_daily
  contract: paid_media_meta_contract_v1
  cube_views:
  - meta_ad_performance
  - meta_ad_breakdown_performance
  - meta_ad_performance_hourly
  - meta_ads_status_history
  platforms:
  - Meta
  notes: 'Delivery + video engagement only. Platform-reported purchases/ROAS stay in gold as diagnostics
    — not certified (attribution boundary).

    '
- name: GoogleAdsPerformance
  domain: PaidMedia
  owner_team: growth-paid-media
  primary_serve_table: clickhouse.default.serve.google_ads_daily
  contract: paid_media_google_contract_v1
  cube_views:
  - google_ad_performance
  - google_ad_performance_hourly
  - google_ads_status_history
  platforms:
  - GoogleAds
- name: AmazonAdsPerformance
  domain: PaidMedia
  owner_team: growth-paid-media
  primary_serve_table: clickhouse.default.serve.amazon_ads_daily
  contract: paid_media_amazon_contract_v1
  cube_views:
  - amazon_ad_performance
  - amazon_ads_ads
  - amazon_ads_ad_groups
  platforms:
  - AmazonAds
  notes: 'Sponsored Products (SP) campaign daily grain only — SB/SD/DSP not ingested. No attributed sales/ACOS/ROAS
    (attribution boundary).

    '
- name: MarketingAttribution
  domain: Attribution
  owner_team: growth-attribution
  primary_serve_table: clickhouse.default.serve.order_attribution
  contract: attribution_order_contract_v1
  secondary_contracts:
  - attribution_meta_ad_contract_v1
  cube_views:
  - order_attribution
  - meta_ad_attribution
  - ad_channel_pnl
  - touchpoints
  - attribution_paths
  platforms:
  - Shopify
  - Meta
  - GoogleAds
  notes: 'Last-touch, Shopify orders + Meta/Google touchpoints, first-party revenue only. Amazon ad→order
    linkage (gold.fct_amazon_ads_ad_order_attribution) = V2 port; platform-attributed sales/ACOS excluded.

    '
- name: ChannelAttribution
  domain: Attribution
  owner_team: growth-attribution
  primary_serve_table: clickhouse.default.serve.channel_attribution_daily
  contract: channel_attribution_daily_contract_v1
  cube_views:
  - channel_attribution
  - channel_pnl
  - platform_attribution_commerce
  platforms:
  - Shopify
  - Meta
  - GoogleAds
  - AmazonSP
  notes: 'Closed channel set (meta/google/organic_shopify/amazon/organic_amazon). Shopify rows use first-party
    ex-GST; Amazon rows use marketplace incl-GST.

    '
- name: CustomerIntelligence
  domain: Customer
  owner_team: growth-retention
  primary_serve_table: clickhouse.default.serve.customer_ltv
  contract: customer_ltv_contract_v1
  secondary_contracts:
  - purchase_sequence_contract_v1
  cube_views:
  - customer_ltv
  - purchase_sequence
  - ltv_cac
  platforms:
  - Shopify
  notes: 'Hashed PII only. Amazon SP-API exposes no durable buyer identity — Amazon orders cannot join
    LTV (permanent boundary, not V2).

    '
- name: CustomerData
  domain: Customer
  owner_team: growth-retention
  primary_serve_table: clickhouse.default.serve.customer_data
  contract: customer_data_contract_v1
  cube_views:
  - customer_data
  platforms:
  - Shopify
  notes: 'Master-data profile/consent/acquisition only — no lifetime counts or revenue (those stay on
    CustomerIntelligence).

    '
- name: SessionFunnel
  domain: WebAnalytics
  owner_team: growth-analytics
  primary_serve_table: clickhouse.default.serve.session_funnel
  contract: session_funnel_contract_v1
  secondary_contracts:
  - funnel_daily_contract_v1
  cube_views:
  - session_funnel
  - funnel_daily
  platforms:
  - Shopify
  notes: 'Snowplow website funnel (browse/product_view/add_to_cart/reached_checkout/ purchased). No visitor
    identifiers on serve. FINE channel — the closed 5-channel set is ChannelAttribution. funnel_daily
    purchases/revenue are order-grain last-touch attribution.

    '
- name: EventStream
  domain: WebAnalytics
  owner_team: growth-analytics
  primary_serve_table: clickhouse.default.serve.web_events
  contract: web_events_contract_v1
  secondary_contracts:
  - web_events_daily_contract_v1
  cube_views:
  - web_events
  - web_events_daily
  platforms:
  - Shopify
  notes: 'Snowplow website event stream (event grain) — page/product/collection views, cart interactions,
    checkout steps, searches, purchases. Paths + business keys only, no visitor identifiers or full URLs
    on serve. channel is the session-resolved FINE channel; server-side purchase events have no session
    (''unattributed''). Daily rollup is counts-only; its per-row distinct counts (unique_visitors/unique_pages)
    are not additive.

    '
- name: CanonicalPnl
  domain: Finance
  owner_team: finance-team
  primary_serve_table: clickhouse.default.serve.canonical_pnl
  contract: canonical_pnl_contract_v1
  cube_views:
  - canonical_pnl
  - daily_pnl
  - finance_waterfall
  - payments
  platforms:
  - Shopify
  - Meta
  - GoogleAds
  - AmazonAds
  - AmazonSP
  agent_ready: false
  notes: 'OM certification InProgress until cost-basis gates close. Net sales = Shopify oracle; additive
    amazon_* block; spend from certified ads serve.

    '
- name: AmazonAccounts
  domain: Finance
  owner_team: finance-team
  primary_serve_table: clickhouse.default.serve.amazon_settlement_reconciliation
  contract: amazon_settlement_reconciliation_contract_v1
  secondary_contracts:
  - amazon_order_item_pnl_contract_v1
  - amazon_daily_pnl_actual_contract_v1
  - amazon_accounts_exceptions_contract_v1
  cube_views:
  - amazon_settlement_reconciliation
  - amazon_order_item_pnl
  - amazon_daily_pnl_actual
  - amazon_accounts_exceptions
  platforms:
  - AmazonSP
  notes: ACTUAL_ONLY Amazon Seller Central accounts — settlement reconciliation, item/daily P&L, close
    exceptions. Never mix with AmazonCommercePerformance placement estimates. Flat 18% reverse-GST estimate
    only; statutory GST report not modeled.
- name: ReturnsRefunds
  domain: Operations
  owner_team: ops-team
  primary_serve_table: clickhouse.default.serve.refund_events
  contract: refund_events_contract_v1
  secondary_contracts:
  - return_lifecycle_contract_v1
  cube_views:
  - refund_events
  - return_lifecycle
  platforms:
  - Shopify
  notes: 'Return REVENUE oracle remains Commerce (commerce_order_events for Shopify; amazon_commerce_performance
    for Amazon SP — see AmazonCommercePerformance). Amazon''s own line-item return detail (gold.fct_amazon_return_items,
    gold.fct_amazon_returns_daily, gold.int_amazon_return_reconciliation at return/line grain, incl. pending-refund
    and return-label-fee accruals) remains a V2 port — only the AmazonCommercePerformance daily-grain
    rollup (cancelled_orders/returned_orders/returned_revenue) is certified today.

    '
