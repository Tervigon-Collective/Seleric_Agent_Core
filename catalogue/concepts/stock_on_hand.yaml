id: stock_on_hand
display_name: Stock on hand
one_liner: Units and FIFO value in stock now (snapshot, not historical).
aliases:
- stock
- stock on hand
- inventory
- inventory on hand
- current stock
- units in stock
- inventory value
- stock value
axes:
  measure:
    values:
    - units
    - available
    - reserved
    - value
    - items
    default: units
resolves:
- when:
    measure: units
  metric: on_hand_units
- when:
    measure: available
  metric: available_units
- when:
    measure: reserved
  metric: reserved_units
- when:
    measure: value
  metric: stock_value_fifo
- when:
    measure: items
  metric: stocked_items
disambiguation: 'A snapshot as of the last sync; it cannot be asked for a past date. Value is FIFO landed cost ex-GST
  of the open layers (items whose balance disagrees with their layers are counted by items_with_layer_gap).

  '
