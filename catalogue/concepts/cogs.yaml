id: cogs
display_name: COGS
one_liner: Net COGS of the orders placed in the period (order date) — product + operating cost, net of returns.
aliases:
- cogs
- net cogs
- cost of goods
- cost of goods sold
- operating cost
- total operating cost
- gross cogs
axes:
  component:
    values:
    - total
    - product
    - shipping
    - packaging
    - gateway
    - rto
    - operating
    - gross
    default: total
  scope:
    values:
    - all
    - product
    default: all
  date:
    values:
    - order
    - finance
    default: order
  channel:
    values:
    - all
    - meta
    - google
    - whatsapp
    - organic
    - unattributed
    default: all
  paid:
    values:
    - all
    - paid
    default: all
axis_filters:
  channel:
    meta:
      finance_channel: meta
    google:
      finance_channel: google
    whatsapp:
      finance_channel: whatsapp
    organic:
      finance_channel: organic
    unattributed:
      finance_channel: unattributed
  paid:
    paid:
      is_paid: 'true'
resolves:
- when:
    component: total
    scope: product
  metric: product_order_net_cogs
- when:
    component: product
    scope: product
  metric: product_order_product_cost
- when:
    component: gross
    scope: product
  metric: product_gross_cogs
- when:
    component: shipping
    scope: product
  metric: product_shipping_cost
- when:
    component: packaging
    scope: product
  metric: product_packaging_cost
- when:
    component: gateway
    scope: product
  metric: product_payment_gateway_fees
- when:
    component: rto
    scope: product
  metric: product_rto_cost
- when:
    component: operating
    scope: product
  metric: product_operating_cost
- when:
    component: total
  metric: net_cogs
- when:
    component: product
  metric: product_cost
- when:
    component: shipping
  metric: shipping_cost
- when:
    component: packaging
  metric: packaging_cost
- when:
    component: gateway
  metric: payment_gateway_fees
- when:
    component: rto
  metric: rto_cost
- when:
    component: operating
  metric: operating_cost
- when:
    component: gross
  metric: gross_cogs
disambiguation: '"total operating cost" in v1 meant net COGS (component=total); operating cost alone is shipping
  + packaging + gateway + RTO. gross COGS = placement cost of every unit placed (no return adjustment). scope=product
  (by product / variant / SKU, order date): total = product_net_cogs, product = product_line_cost, gross = product_gross_cogs;
  the shipping / packaging / gateway / RTO components by product are each order''s costs spread over its lines by
  revenue share (product_shipping_cost …, P&L basis; date_axis=event_date for the event-date view).

  '
