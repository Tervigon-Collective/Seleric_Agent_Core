id: quality_check_outcomes
display_name: Quality check outcomes
one_liner: Damage, shortfall and rejection on inbound goods by inspection date.
aliases:
- quality checks
- qc
- damage rate
- shortfall rate
- rejected qc
- vendor quality
- damaged units
- short units
axes:
  measure:
    values:
    - count
    - rejected
    - damage_units
    - shortfall_units
    - damage_rate
    - shortfall_rate
    - damage_value
    default: damage_rate
resolves:
- when:
    measure: count
  metric: qc_count
- when:
    measure: rejected
  metric: rejected_quality_checks
- when:
    measure: damage_units
  metric: qc_damage_units
- when:
    measure: shortfall_units
  metric: qc_shortfall_units
- when:
    measure: damage_rate
  metric: qc_damage_rate
- when:
    measure: shortfall_rate
  metric: qc_shortfall_rate
- when:
    measure: damage_value
  metric: qc_damage_value
disambiguation: Damage rate = damaged / actual received; shortfall rate = short / invoiced. Slice by vendor_name
  for vendor comparisons.
