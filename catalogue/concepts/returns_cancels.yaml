id: returns_cancels
display_name: Returns and cancellations
one_liner: Return + cancellation revenue of the orders placed in the period (order date); date_axis=event_date books
  them on the day they happen.
aliases:
- returns
- cancels
- returns and cancels
- returns/cancels
- cancellations
- return revenue
- cancel revenue
axes:
  action:
    values:
    - both
    - return
    - cancel
    default: both
  measure:
    values:
    - revenue
    - orders
    default: revenue
  date:
    values:
    - order
    - finance
    default: order
  scope:
    values:
    - all
    - product
    default: all
  channel:
    values:
    - all
    - meta
    - google
    - whatsapp
    - organic
    - unattributed
    default: all
  paid:
    values:
    - all
    - paid
    default: all
axis_filters:
  channel:
    meta:
      finance_channel: meta
    google:
      finance_channel: google
    whatsapp:
      finance_channel: whatsapp
    organic:
      finance_channel: organic
    unattributed:
      finance_channel: unattributed
  paid:
    paid:
      is_paid: 'true'
resolves:
- when:
    action: return
    measure: revenue
    scope: product
  metric: product_order_return_revenue
- when:
    action: cancel
    measure: revenue
    scope: product
  metric: product_order_cancel_revenue
- when:
    action: both
    measure: revenue
  metric: return_cancel_revenue
- when:
    action: return
    measure: revenue
  metric: return_revenue
- when:
    action: cancel
    measure: revenue
  metric: cancel_revenue
- when:
    action: both
    measure: orders
  metric: returned_or_cancelled_orders
- when:
    action: return
    measure: orders
  metric: returned_orders
- when:
    action: cancel
    measure: orders
  metric: cancelled_orders
disambiguation: 'date_axis=event_date counts a return / cancel on the day it happened (P&L); order_date counts the
  returns / cancels of the orders placed in the period (cohort). Refund amounts and lines are the refunds concept.

  '
