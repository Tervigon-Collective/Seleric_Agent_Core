id: ad_channel_roas
display_name: Ad ROAS (net sales / spend, ad grain)
category: attribution
status: certified
description: >-
  Revenue ROAS per ad channel, campaign, adset and ad (Meta and Google) — "ROAS by campaign", "how are my ads doing", "which ads are efficient" (id: ad_channel_roas); formula: SUM(net_sales) / SUM(ad_spend) on ad_channel_pnl (ratio of aggregates, recomputed per slice, do not average row ROAS); grain: daily campaign/adset/ad × channel, ratio; date axis: report_date; scope: first-party Shopify net sales, event-date basis; siblings: for business-wide contribution ROAS use net_roas_all_channels, for sales ÷ total spend use mer, for net sales companion use ad_channel_net_sales.
formula:
  human_readable: SUM(net_sales) / SUM(ad_spend)
  authoritative_source: cube
cube_mapping:
  view: ad_channel_pnl
  measure: ad_channel_pnl.net_roas
aggregation: ratio
unit: ratio
grain: daily campaign/adset/ad × channel
supported_dimensions:
- brand_id
- report_date
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
supported_filters:
- date_range
- brand_id
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  scopes:
  - metrics:read
examples:
- question: ROAS by platform last 30 days
  request:
    measures:
    - ad_channel_roas
    dimensions:
    - channel
    time_range:
      preset: last_30d
validation_tests:
- ad_channel_roas equals SUM(net_sales) / SUM(ad_spend) recomputed on any slice
ratio_components:
  numerator: ad_channel_pnl.net_sales
  denominator: ad_channel_pnl.ad_spend
companion_measures:
- ad_channel_net_sales
- ad_channel_spend
