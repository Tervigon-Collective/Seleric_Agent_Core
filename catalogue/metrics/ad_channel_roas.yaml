id: ad_channel_roas
display_name: Ad ROAS (net sales / spend, ad grain)
category: attribution
status: certified
description: >-
  Revenue ROAS per ad channel, campaign, adset and ad (Meta and Google) — "ROAS by campaign", "how are
  my ads doing", "which ads are efficient". = sum(net sales) ÷ sum(ad spend) on
  serve.ad_channel_pnl_daily, recomputed from the two sums for whatever slice you group by (never
  average row ROAS). Uses first-party Shopify net sales, event-date basis. Not this: business-wide
  contribution ROAS ((net sales − COGS) ÷ spend) → net_roas_all_channels; net sales ÷ total spend for
  the whole business → mer. Not platform-reported ROAS.
formula:
  human_readable: SUM(net_sales) / SUM(ad_spend)
  authoritative_source: cube
cube_mapping:
  view: ad_channel_pnl
  measure: ad_channel_pnl.net_roas
aggregation: ratio
unit: ratio
grain: daily campaign/adset/ad × channel
supported_dimensions:
- brand_id
- report_date
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
supported_filters:
- date_range
- brand_id
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  scopes:
  - metrics:read
examples:
- question: ROAS by platform last 30 days
  request:
    measures:
    - ad_channel_roas
    dimensions:
    - channel
    time_range:
      preset: last_30d
validation_tests:
- ad_channel_roas equals SUM(net_sales) / SUM(ad_spend) recomputed on any slice
ratio_components:
  numerator: ad_channel_pnl.net_sales
  denominator: ad_channel_pnl.ad_spend
companion_measures:
- ad_channel_net_sales
- ad_channel_spend
