id: amazon_net_sales
display_name: Net Sales (Amazon-only — ex-GST, net of report returns)
category: commerce
status: certified
description: >
  Amazon SP net sales EX-GST = Gross Sales − Returns Report refunded_amount
  on return_delivery_date. Matches the Amazon Attribution "Net Sales" card
  (June 2026 brand 20 = ₹214,753.49 = 227,645.99 − 12,892.50).
formula:
  human_readable: SUM(effective_gross_revenue - revenue_tax on non-canceled placements) - SUM(report returns on return_delivery_date), ex-GST
  authoritative_source: cube
cube_mapping:
  view: amazon_attribution_overview
  measure: amazon_attribution_overview.net_sales
  time_dimension: amazon_attribution_overview.report_date
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
  - brand_id
  - report_date
supported_filters:
  - date_range
  - brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst, ops]
  scopes: [metrics:read]
validation_tests:
  - June 2026 brand 20 = ₹214,753.49
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: amazonSummaryMetrics.js amazonDisplayNetSales; applyAmazonReportReturnsOverride
