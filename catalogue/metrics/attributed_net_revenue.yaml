id: attributed_net_revenue
display_name: Attributed Net Revenue
category: attribution
status: certified
description: >-
  Net sales of orders placed in the period, split by last-touch marketing source — use for "revenue by
  UTM source / campaign / platform" at order grain. Sums each order's net sales (ex-GST) on its order
  date from serve.order_attribution; returns/cancels that happen later are NOT deducted from the
  period. Cancelled/voided orders count 0; unpaid COD counts gross − discounts until
  cancelled/returned. Covers every Shopify order (the full Total Orders population); orders with no
  touch have lt_platform='unattributed'. Slice: lt_platform
  (meta|google|unattributed|other|ai|organic|email), lt_channel (ig_feed, fb_feed, google_pmax,
  google_search, google_shopping, organic, …), lt_utm_*, lt_campaign_*, geo, payment. Not this:
  Meta/Google Overview card net sales → meta_attribution_net_sales / google_attribution_net_sales;
  per-campaign P&L → ad_channel_net_sales.
formula:
  human_readable: SUM(credited_net_revenue_excl_tax) on last_touch_v1 (one credit row per order)
  authoritative_source: cube
cube_mapping:
  view: order_attribution
  measure: order_attribution.attributed_net_revenue
aggregation: additive
unit: currency
grain: order (last-touch attribution)
supported_dimensions:
- brand_id
- order_date
- lt_platform
- lt_channel
- lt_utm_source
- lt_utm_medium
