id: attributed_net_revenue
display_name: Attributed Net Revenue
category: attribution
status: certified
description: >-
  Net sales of orders placed in the period, split by last-touch marketing source — use for "revenue by UTM source / campaign / platform" at order grain (id: attributed_net_revenue); formula: SUM(credited_net_revenue_excl_tax) on last_touch_v1 (one credit row per order); grain: order (last-touch attribution), additive; date axis: order_date; scope: full Total Orders population, returns/cancels NOT deducted from period, cancelled/voided count 0, unpaid COD counts gross − discounts; siblings: for Meta/Google Overview card net sales use meta_attribution_net_sales / google_attribution_net_sales, for per-campaign P&L use ad_channel_net_sales, for brand-day totals use net_sales_all_channels.
formula:
  human_readable: SUM(credited_net_revenue_excl_tax) on last_touch_v1 (one credit row per order)
  authoritative_source: cube
cube_mapping:
  view: order_attribution
  measure: order_attribution.attributed_net_revenue
aggregation: additive
unit: currency
grain: order (last-touch attribution)
supported_dimensions:
- brand_id
