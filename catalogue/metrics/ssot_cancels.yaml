id: ssot_cancels
display_name: SSOT cancellations
category: finance
status: approved
description: 'Value of cancelled or voided orders, on the day they were cancelled. Formula: sum of the deduction value of
  cancellation events. Date: cancellation date (IST). GST: ex-GST. Shopify: A line is a cancellation event when its refund
  class is CANCELLATION and it is not "kept". Value = cancelled revenue ex-GST; if none, returned revenue; if the order is
  VOIDED or fully reversed with nothing left, the placement value. Cancel events of zero-value reship drafts (revenue-adjustment
  orders, D-120) deduct nothing. Amazon: 0. A cancelled Amazon order carries no revenue, cost or fee at all, so there is nothing
  to deduct (D-103; verified Oct 1-29: 21 cancelled orders, all values 0). Includes: cancelled, voided. Excludes: returns.
  Grain: brand_day_channel. Date axis: native (one hybrid axis, D-07). SSOT P&L view over gold.fct_ssot_pnl_daily (Shopify
  and Amazon, channel amazon; D-104).'
formula:
  human_readable: 'Value of cancelled or voided orders, on the day they were cancelled. Formula: sum of the deduction value
    of cancellation events. Date: cancellation date (IST). GST: ex-GST. Shopify: A line is a cancellation event when its refund
    class is CANCELLATION and it is not "kept". Value = cancelled revenue ex-GST; if none, returned revenue; if the order
    is VOIDED or fully reversed with nothing left, the placement value. Cancel events of zero-value reship drafts (revenue-adjustment
    orders, D-120) deduct nothing. Amazon: 0. A cancelled Amazon order carries no revenue, cost or fee at all, so there is
    nothing to deduct (D-103; verified Oct 1-29: 21 cancelled orders, all values 0). Includes: cancelled, voided. Excludes:
    returns.'
  authoritative_source: cube
  depends_on: []
cube_mapping:
  view: ssot_pnl
  measure: ssot_pnl.cancels
aggregation: additive
unit: INR
grain: brand_day_channel
data_owner: Finance
access_policy:
  roles_allowed:
  - analyst
  - exec
  - finance
  - growth_lead
  - ops
  scopes:
  - metrics:read
version: 1.0.0
replaces: []
date_axis: native
currency_default: INR
