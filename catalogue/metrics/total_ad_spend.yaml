id: total_ad_spend
display_name: Total Ad Spend (all platforms)
category: finance
status: certified
description: >-
  Total advertising spend = Meta + Google ad spend for the period, per brand-day on serve.canonical_pnl (INR) (id: total_ad_spend); formula: SUM(meta_spend) + SUM(google_spend); grain: brand × day, additive; date axis: report_date (IST calendar day); scope: all-platforms P&L; siblings: for Meta only use meta_spend, for Google only use google_spend, for by campaign/ad use ad_channel_spend.
formula:
  human_readable: SUM(meta_spend) + SUM(google_spend)
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.total_ad_spend
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
  - brand_id
  - report_date
supported_filters:
  - date_range
  - brand_id
data_owner: Finance
access_policy:
  roles_allowed: [exec, finance]
  scopes: [metrics:read]
examples:
  - question: Total Performance Marketing / Total Ad Spend (all platforms) for June 2026
    request:
      measures: [total_ad_spend]
      time_range: {start: "2026-06-01", end: "2026-06-30"}
validation_tests:
  - total_ad_spend >= 0 for any slice
  - equals meta_spend + google_spend for the same slice
deprecated_aliases:
  - total_performance_marketing
dashboard_alignment:
  status: unclear
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: src/integrations/historicalAnalytics/historicalQueryHelpers.js:369-370
  note: >
    Serve layer is Shopify-only (2026-09-17), so this equals the Shopify figure. A dashboard
    All-channels card that also counts other marketplaces will not match.
