    false it is taken as booked. The GST taken out is the memo metric shipping_gst. Metric version 2; version 1 (as booked,
    GST-inclusive) is retired.. Shopify: fct_orders.total_shipping_charged (silver trino_shopify_orders.shipping_amount) with
    the GST rule above. Amazon: 0 (Amazon shipping is inside product net, not split). Includes: exchange replacements. Excludes:
    courier cost (that is a cost line).'
  authoritative_source: cube
  depends_on: []
cube_mapping:
