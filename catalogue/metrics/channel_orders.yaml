id: channel_orders
display_name: Channel Orders
category: attribution
status: certified
description: >
  Orders by the closed channel set (meta / google / organic_shopify / amazon /
  organic_amazon) on serve.channel_attribution_daily. Reconciles to Total Orders by
  construction: SUM over all channels == total_orders, and the Shopify channels
  (meta / google / organic_shopify) == total_orders Shopify with the same last-touch
  split as the dashboard Historical channel breakdown (fct_order_attribution,
  argMax lt_platform; unmatched → organic_shopify). Amazon arm excludes Canceled to
  match the Total Orders amazon cohort. organic_shopify.unattributed_orders exposes
  the direct/unresolved count folded into that bucket.
formula:
  human_readable: SUM(orders) by channel
  authoritative_source: cube
cube_mapping:
  view: channel_attribution
  measure: channel_attribution.orders
aggregation: additive
unit: count
grain: brand × day × channel
supported_dimensions:
  - brand_id
  - report_date
  - channel
  - source_platform
  - revenue_basis
supported_filters:
  - date_range
  - brand_id
  - channel
data_owner: Growth / Attribution
access_policy:
  roles_allowed: [exec, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
  - question: Meta vs organic Shopify orders last 30 days
    request:
      measures: [channel_orders]
      dimensions: [channel]
      time_range: {preset: last_30_days}
validation_tests:
  - channel_orders >= 0
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-31'
  source: Seleric_Dashboard/Node-Backend
  evidence: historicalAnalytics/analyticsClickhouse.js:325-348 (getTotalOrders per-channel)
  note: >
    Shopify meta/google/organic_shopify split matches the dashboard Historical
    channel breakdown exactly (getTotalOrders: fct_orders LEFT JOIN
    fct_order_attribution argMax lt_platform, unmatched → organic). Verified live
    2026-07-31 brand 20 June: meta 1302 / google 469 / organic_shopify 78 = 1849
    Shopify + amazon 136 = 1985 total_orders. Amazon channel is an additional
    detail beyond the dashboard's single Historical amazon row. Guard:
    scripts/reconcile_attribution_totals.py.
