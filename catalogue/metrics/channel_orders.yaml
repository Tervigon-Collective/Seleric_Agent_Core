id: channel_orders
display_name: Channel Orders
category: attribution
status: certified
description: >-
  Orders by acquisition channel (meta | google | organic_shopify | unattributed) per day — "orders by
  channel", "how many orders came from Meta". Counts Shopify orders on their order date from
  serve.channel_attribution_daily; the four channels add up to total_orders. organic_shopify = organic
  search plus other non-paid sources (email, AI, referral); unattributed = no identifiable source. Not
  this: per campaign/ad → ad_channel_orders.
formula:
  human_readable: SUM(orders) by channel
  authoritative_source: cube
cube_mapping:
  view: channel_attribution
  measure: channel_attribution.orders
aggregation: additive
unit: count
grain: brand × day × channel
supported_dimensions:
  - brand_id
  - report_date
  - channel
  - source_platform
  - revenue_basis
supported_filters:
  - date_range
  - brand_id
  - channel
data_owner: Growth / Attribution
access_policy:
  roles_allowed: [exec, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
  - question: Meta vs organic Shopify orders last 30 days
    request:
      measures: [channel_orders]
      dimensions: [channel]
      time_range: {preset: last_30_days}
validation_tests:
  - channel_orders >= 0
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-31'
  source: Seleric_Dashboard/Node-Backend
  evidence: historicalAnalytics/analyticsClickhouse.js:325-348 (getTotalOrders per-channel)
  note: >
    2026-07-31: empty-signal orders that were mislabeled organic_shopify are now
    channel=unattributed. True organic search (bing/…) stays organic_shopify.
    SUM(meta+google+organic_shopify+unattributed) still equals Shopify total_orders.
    Guard: scripts/reconcile_attribution_totals.py.
