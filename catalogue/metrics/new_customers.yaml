id: new_customers
display_name: New Customers
category: customer
status: certified
description: >-
  New customers acquired in the period = customers whose first order falls in the period (last-touch
  order cohort), per brand-day on serve.ltv_cac_daily — default for "new customers", "customers
  acquired". Denominator of cac and ltv. Same count as first_orders. By marketing source →
  attributed_new_customer_orders.
formula:
  human_readable: COUNT(new customers where is_new_customer = 1)
  authoritative_source: cube
cube_mapping:
  view: ltv_cac
  measure: ltv_cac.new_customers
aggregation: additive
unit: count
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Growth
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst]
  scopes: [metrics:read]
examples:
- question: New Customers last 30 days
  request:
    measures:
    - new_customers
    time_range:
      preset: last_30d
validation_tests: []
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: historicalAnalytics/analyticsClickhouse.js getNewCustomerMetrics
