id: amazon_returned_orders
display_name: Returned Orders (Amazon-only — delivery-date)
category: commerce
status: certified
description: >
  Distinct Amazon SP orders with a Returns Report delivery in the period
  (return_delivery_date axis). Matches the "returned" leg of the Amazon
  Attribution Returns / Cancels card (June 2026 brand 20 = 9). Rejected
  lines excluded; canonical record_id dedupe. For the combined Returns /
  Cancels count (returned + cancelled = 24) use amazon_returns_cancels /
  amazon_return_count. SUPERSEDES the older refund-posted-date returned_orders
  on amazon_commerce_performance (which counted 11 for the same June window).
formula:
  human_readable: >
    uniqExact(amazon_order_id) from gold.fct_amazon_return_items on
    return_delivery_date (canonical, non-rejected)
  authoritative_source: cube
cube_mapping:
  view: amazon_attribution_overview
  measure: amazon_attribution_overview.returned_orders
  time_dimension: amazon_attribution_overview.report_date
aggregation: additive
unit: count
grain: daily
supported_dimensions:
  - brand_id
  - report_date
supported_filters:
  - date_range
  - brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
  - question: Amazon returned orders last month
    request:
      measures: [amazon_returned_orders]
      time_range: {preset: last_month}
validation_tests:
  - amazon_returned_orders >= 0
  - June 2026 brand 20 = 9
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: amazonReturnsHelpers.js fetchAmazonDeliveryDateReturns
