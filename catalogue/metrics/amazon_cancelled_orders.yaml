id: amazon_cancelled_orders
display_name: Cancelled Orders (Amazon-only)
category: commerce
status: certified
description: >
  Amazon SP orders with order_status cancelled/canceled on purchase_date.
  Matches the cancelled leg of Returns / Cancels (June 2026 brand 20 = 15).
  Cancelled orders contribute ₹0 to Gross/Net Sales.
formula:
  human_readable: >
    COUNT(Amazon SP orders on purchase_date where order_status IN
    (cancelled, canceled))
  authoritative_source: cube
cube_mapping:
  view: amazon_attribution_overview
  measure: amazon_attribution_overview.cancelled_orders
  time_dimension: amazon_attribution_overview.report_date
aggregation: additive
unit: count
grain: daily
supported_dimensions:
  - brand_id
  - report_date
supported_filters:
  - date_range
  - brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
  - question: Amazon cancelled orders last 30 days
    request:
      measures: [amazon_cancelled_orders]
      time_range: {preset: last_30d}
validation_tests:
  - amazon_cancelled_orders >= 0
  - June 2026 brand 20 = 15
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: buildAmazonAttributionPayload.js bumpAmazonOrderCounts
