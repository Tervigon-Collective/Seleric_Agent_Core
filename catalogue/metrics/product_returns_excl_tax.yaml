id: product_returns_excl_tax
display_name: Product returns value (ex-GST)
category: operations
status: certified
description: 'Returns value ex-GST of the refunded lines (refund date), splittable by product / variant / SKU. Refunds
  of exchanged items are excluded: exchanges never enter return metrics (D-01); the refund date is a native cash
  clock and ignores date_axis (D-36). Grain: refund. Date axis: native. Ignores date_axis (its own clock, D-36).
  Redefined in semantic v3 (D-01; D-20; D-36; D-02b; D-22): the id is kept, the number may change.'
formula:
  human_readable: 'Returns value ex-GST of the refunded lines (refund date), splittable by product / variant / SKU.
    Refunds of exchanged items are excluded: exchanges never enter return metrics (D-01); the refund date is a native
    cash clock and ignores date_axis (D-36).'
  authoritative_source: cube
