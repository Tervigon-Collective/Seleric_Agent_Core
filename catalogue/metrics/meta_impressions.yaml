id: meta_impressions
display_name: Meta Impressions
category: paid_media
status: certified
description: >
  Meta ad impressions delivered on report_date from meta_ad_performance. Platform
  delivery only — not reach (non-additive) and not platform-reported purchase value.
formula:
  human_readable: SUM(meta_impressions)
  authoritative_source: cube
cube_mapping:
  view: meta_ad_performance
  measure: meta_ad_performance.meta_impressions
aggregation: additive
unit: count
grain: daily ad grain (brand x account x day x campaign x adset x ad)
supported_dimensions:
- brand_id
- report_date
- ad_account_id
- campaign_id
- campaign_name
- campaign_status
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_id
- creative_type
- creative_name
- creative_cta_type
- ad_format
- adset_optimization_goal
- neurohack_tag_codes
supported_filters:
- date_range
- brand_id
- ad_account_id
- campaign_id
- campaign_name
- campaign_status
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_id
- creative_type
- creative_name
- creative_cta_type
- ad_format
- adset_optimization_goal
- neurohack_tag_codes
data_owner: Growth / Paid Media
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Meta Impressions last 30 days
  request:
    measures:
    - meta_impressions
    time_range:
      preset: last_30d
validation_tests:
- meta_impressions >= 0 for any slice
dashboard_alignment:
  status: match
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: historicalAnalytics/analyticsClickhouse.js:762
