id: meta_status_changes
display_name: Meta Ads Status Changes
category: paid_media
status: certified
description: >-
  Number of times a Meta campaign/adset/ad status actually changed (e.g. ACTIVE → PAUSED), on the
  change date, from serve.meta_ads_status_history — "what did we pause/launch". Not delivery.
formula:
  human_readable: status_changes
  authoritative_source: cube
cube_mapping:
  view: meta_ads_status_history
  measure: meta_ads_status_history.status_changes
aggregation: additive
unit: count
grain: entity change event
supported_dimensions:
- brand_id
supported_filters:
- date_range
- brand_id
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Meta Ads Status Changes last 30 days
  request:
    measures:
    - meta_status_changes
    time_range:
      preset: last_30d
validation_tests:
- meta_status_changes is defined on view meta_ads_status_history
