id: meta_status_changes
display_name: Meta Ads Status Changes
category: paid_media
status: certified
description: >
  Count of Meta entity snapshot rows where status actually changed. From serve.meta_ads_status_history on the changed_at axis. Not impressions, clicks, or spend — use meta_ad_performance for delivery.
formula:
  human_readable: status_changes
  authoritative_source: cube
cube_mapping:
  view: meta_ads_status_history
  measure: meta_ads_status_history.status_changes
aggregation: additive
unit: count
grain: entity change event
supported_dimensions:
- brand_id
supported_filters:
- date_range
- brand_id
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Meta Ads Status Changes last 30 days
  request:
    measures:
    - meta_status_changes
    time_range:
      preset: last_30d
validation_tests:
- meta_status_changes is defined on view meta_ads_status_history
