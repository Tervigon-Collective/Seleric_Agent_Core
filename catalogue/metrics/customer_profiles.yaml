id: customer_profiles
display_name: Customer Profiles
category: customer
status: draft
description: >-
  Count of customer master-data profiles (consent, acquisition source, default city) from
  serve.customer_data. No revenue or order counts here. Draft: not exposed to search.
formula:
  human_readable: COUNT(customer_id)
  authoritative_source: cube
cube_mapping:
  view: customer_data
  measure: customer_data.customers
aggregation: additive
unit: count
grain: brand × customer
supported_dimensions:
  - brand_id
  - customer_id
  - acquisition_platform
  - acquisition_channel
  - accepts_marketing
  - default_city
  - default_province
  - default_country
supported_filters:
  - brand_id
  - acquisition_platform
  - accepts_marketing
data_owner: Growth / Retention
access_policy:
  roles_allowed: [exec, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
- question: Customer Profiles last 30 days
  request:
    measures:
    - customer_profiles
    time_range:
      preset: last_30d
validation_tests:
  - customer_profiles >= 0
deprecated_aliases: []
dashboard_alignment:
  status: not_implemented
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  note: >
    No customer master-data table or endpoint exists in Node-Backend. Part of
    the broader finding that there is no customer-master or
    lifetime-aggregation layer.
