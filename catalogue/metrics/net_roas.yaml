id: net_roas
display_name: Net ROAS (Shopify-only)
category: finance
status: certified
description: >-
  Net ROAS: (net sales − Net COGS) ÷ Meta+Google ad spend, from period sums on serve.canonical_pnl.
  Same number as net_roas_all_channels — prefer that id unless the user says "Shopify-only".
formula:
  human_readable: (SUM(net_sales) - SUM(net_cogs)) / SUM(shopify_ad_spend)
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.net_roas
aggregation: ratio
unit: ratio
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  scopes:
  - metrics:read
examples:
- question: Net ROAS for June 2026
  request:
    measures:
    - net_roas
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- equals (net_sales - net_cogs) / shopify_ad_spend for the same slice
- June 2026 brand 20 ≈ dashboard 0.86x
deprecated_aliases: []
ratio_components:
  numerator: canonical_pnl.contribution_margin
  denominator: canonical_pnl.shopify_ad_spend
dashboard_alignment:
  status: drift_corrected
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: services/dashboardService.js:143
  note: 'Primary dashboard summary computes net_roas from blended (multi-marketplace) net_sales and net_cogs — see cross-cutting #2.'
