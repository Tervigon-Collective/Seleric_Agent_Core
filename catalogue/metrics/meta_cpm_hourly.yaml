id: meta_cpm_hourly
display_name: Meta CPM (hourly)
category: paid_media
status: certified
description: >
  Meta CPM (hourly) recomputed from aggregated components (ratio-of-aggregates; never SUM/AVG
  of row ratios). Intraday grain from serve.meta_ad_performance_hourly.
formula:
  human_readable: SUM(meta_spend) / SUM(meta_impressions)
  authoritative_source: cube
cube_mapping:
  view: meta_ad_performance_hourly
  measure: meta_ad_performance_hourly.meta_cpm
aggregation: ratio
unit: INR
grain: hourly ad grain
supported_dimensions:
- brand_id
- report_date
- hour_of_day
- report_hour_ts
- ad_account_id
- campaign_id
- campaign_name
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_type
supported_filters:
- brand_id
- report_date
- hour_of_day
- report_hour_ts
- ad_account_id
- campaign_id
- campaign_name
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_type
data_owner: Growth / Paid Media
access_policy:
  roles_allowed: [exec, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
- question: Meta CPM (hourly) last 30 days
  request:
    measures:
    - meta_cpm_hourly
    time_range:
      preset: last_30d
validation_tests:
- meta_cpm_hourly equals numerator/denominator recomputed on any slice
ratio_components:
  numerator: meta_ad_performance_hourly.meta_spend
  denominator: meta_ad_performance_hourly.meta_impressions
currency_default: INR
dashboard_alignment:
  status: match
  audited_on: '2026-07-31'
  source: gold.fct_meta_ads_hourly / gold.fct_google_campaigns_hourly
  note: ratio-of-aggregates over hourly components; reconciles to daily.
