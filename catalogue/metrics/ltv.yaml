id: ltv
display_name: New-customer first-order AOV (LTV card)
category: finance
status: certified
description: 'Period new-customer first-order AOV (misnamed "LTV" on Historical LTV:CAC). = new_customer_revenue
  / new_customers. Revenue arm matches attributed_net_revenue for is_new_customer=1: fct_order_attribution.net_revenue_excl_tax
  is dashboard net sales (cancelled/voided → 0; paid → net ex-GST; unpaid COD → gross_excl − discounts).
  Not lifetime customer_ltv.avg_ltv.

  '
formula:
  human_readable: new_customer_revenue / new_customers
  authoritative_source: cube
  depends_on:
  - new_customers
cube_mapping:
  view: ltv_cac
  measure: ltv_cac.ltv
aggregation: ratio
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Growth / Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  scopes:
  - metrics:read
examples:
- question: New-customer first-order AOV (LTV card) last 30 days
  request:
    measures:
    - ltv
    time_range:
      preset: last_30d
validation_tests: []
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-31'
  source: Seleric_Dashboard fe-dashboard performanceSummary.js
  note: 'First-order AOV for new attributed customers; reconciles with attributed_net_revenue filtered
    to is_new_customer=1. Not lifetime LTV.

    '
ratio_components:
  numerator: ltv_cac.new_customer_revenue
  denominator: ltv_cac.new_customers
