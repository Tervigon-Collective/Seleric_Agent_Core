id: net_sales_all_channels
display_name: Net Sales (all channels)
category: commerce
status: certified
description: >
  All-channels Net Sales (ex-GST) from the canonical P&L spine — the SAME view that produces
  net_profit_all_channels, so the agent's Net Sales and Net Profit always reconcile. Shopify is the
  only channel served, so this equals Shopify net_sales_excl_tax. For the geography/channel
  breakdown use the sales_all_channels view directly; for Shopify-only use
  commerce_net_revenue_daily.
formula:
  human_readable: canonical_pnl net_sales_all_channels_pnl = Shopify net_sales_excl_tax, ex-GST
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.net_sales_all_channels_pnl
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
  - brand_id
  - report_date
supported_filters:
  - date_range
  - brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
- question: Net Sales (all channels) last 30 days
  request:
    measures:
    - net_sales_all_channels
    time_range:
      preset: last_30d
validation_tests:
  - net_profit_all_channels = net_sales_all_channels - net_cogs - total_ad_spend on the same slice (same view)
deprecated_aliases: []
dashboard_alignment:
  status: unclear
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: getHistoricalDashboard net_sales (All channels); canonical_pnl.net_sales_all_channels_pnl
  note: >
    Serve layer is Shopify-only (2026-09-17), so this equals the Shopify figure. A dashboard
    All-channels card that also counts other marketplaces will not match.
