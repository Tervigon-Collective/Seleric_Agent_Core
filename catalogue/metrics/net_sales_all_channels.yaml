id: net_sales_all_channels
display_name: Net Sales (all channels)
category: commerce
status: certified
description: >-
  Business net sales for the period — the default answer to "net sales", "revenue", "sales",
  "topline". = gross sales − discounts on the order date, minus returns and cancellations on the date
  they happen, ex-GST, per brand-day on serve.canonical_pnl (the dashboard Net Sales card). Reconciles
  with net_profit_all_channels. Shopify is the only sales channel, so this equals
  commerce_net_revenue_daily. Brand × day only — no channel, geo or product slices. Not this: by ad
  channel → meta_attribution_net_sales / google_attribution_net_sales (or ad_channel_net_sales by
  channel); by city/UTM/payment → commerce_net_revenue; by product → product_net_revenue.
formula:
  human_readable: canonical_pnl net_sales_all_channels_pnl = Shopify net_sales_excl_tax, ex-GST
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.net_sales_all_channels_pnl
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
  - brand_id
  - report_date
supported_filters:
  - date_range
  - brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
- question: Net Sales (all channels) last 30 days
  request:
    measures:
    - net_sales_all_channels
    time_range:
      preset: last_30d
validation_tests:
  - net_profit_all_channels = net_sales_all_channels - net_cogs - total_ad_spend on the same slice (same view)
deprecated_aliases: []
dashboard_alignment:
  status: unclear
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: getHistoricalDashboard net_sales (All channels); canonical_pnl.net_sales_all_channels_pnl
  note: >
    Serve layer is Shopify-only (2026-09-17), so this equals the Shopify figure. A dashboard
    All-channels card that also counts other marketplaces will not match.
