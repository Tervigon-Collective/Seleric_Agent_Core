id: discounts
display_name: Discounts (Shopify-only, ex-GST)
category: commerce
status: certified
description: >-
  Discount/coupon value given on orders placed in the period, ex-GST, from serve.commerce_orders
  (order date; dashboard Discounts card). Sliceable by geo, payment, UTM, customer type. Gross sales −
  discounts = pre-return net sales.
formula:
  human_readable: 'Sum of total_discounts x ((gross_revenue - total_tax) / gross_revenue) per eligible
    order (is_test = 0, is_revenue_adjustment = 0)

    '
  authoritative_source: cube
cube_mapping:
  view: commerce_orders
  measure: commerce_orders.discount_amount_excl_tax
aggregation: additive
unit: currency
currency_default: INR
grain: order
supported_dimensions:
- brand_id
- order_date
- order_created_at_ist
- payment_method
- payment_bucket
- payment_gateway
- is_cod
- is_prepaid
- is_new_customer
- utm_source
- utm_medium
- utm_campaign
- source_name
- shipping_country
- shipping_region
- shipping_city
- shipping_pincode
- shipping_state_code
- order_status
- return_status
- fulfillment_status
- financial_status
supported_filters:
- date_range
- brand_id
- payment_method
- payment_bucket
- payment_gateway
- is_cod
- is_prepaid
- is_new_customer
- utm_source
- utm_medium
- utm_campaign
- source_name
- shipping_country
- shipping_region
- shipping_city
- shipping_pincode
- shipping_state_code
- order_status
- return_status
- fulfillment_status
- financial_status
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Discounts given last month
  request:
    measures:
    - discounts
    time_range:
      preset: last_month
validation_tests:
- reconciles to dashboard Discounts card for closed periods
deprecated_aliases: []
dashboard_alignment:
