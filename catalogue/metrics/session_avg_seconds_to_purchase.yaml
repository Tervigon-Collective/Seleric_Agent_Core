id: session_avg_seconds_to_purchase
display_name: Avg Seconds to Purchase
category: web_analytics
status: certified
description: 'Avg Seconds to Purchase on serve.session_funnel — the session-grain customer-journey OLAP
  fact. Sliceable at ANY grain: ad (campaign/adset/ad), funnel stage, device, geo, landing page, session
  hour/day, channel. First-touch ad attribution on the session.

  '
formula:
  human_readable: SUM(seconds_to_purchase)/purchased_sessions
  authoritative_source: cube
cube_mapping:
  view: session_funnel
  measure: session_funnel.avg_seconds_to_purchase
aggregation: ratio
unit: seconds
grain: session (journey)
supported_dimensions:
- brand_id
- session_date
- session_hour
- session_day_of_week
- funnel_web_platform
- channel
- funnel_stage
- furthest_stage_bucket
- converted
- device_type
- browser_family
- os_family
- geo_city
- geo_region
- geo_country
- landing_page_path
- landing_page_resolved
- exit_page_path
- utm_source
- utm_medium
- utm_campaign
- utm_content
- utm_term
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- identity_resolution_method
supported_filters:
- brand_id
- session_date
- session_hour
- session_day_of_week
- funnel_web_platform
- channel
- funnel_stage
- furthest_stage_bucket
- converted
- device_type
- browser_family
- os_family
- geo_city
- geo_region
- geo_country
- landing_page_path
- landing_page_resolved
- exit_page_path
- utm_source
- utm_medium
- utm_campaign
- utm_content
- utm_term
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- identity_resolution_method
data_owner: Growth / Web Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Avg Seconds to Purchase last 30 days
  request:
    measures:
    - session_avg_seconds_to_purchase
    time_range:
      preset: last_30d
validation_tests:
- session_avg_seconds_to_purchase resolves on session_funnel at ad/funnel/device grain
currency_default: INR
dashboard_alignment:
  status: not_in_dashboard
  audited_on: '2026-07-31'
  source: serve.session_funnel (Snowplow journey OLAP)
  note: Journey OLAP surface; no direct dashboard card. First-touch ad attribution.
ratio_components:
  numerator: session_funnel.seconds_to_purchase
  denominator: session_funnel.purchased_sessions
