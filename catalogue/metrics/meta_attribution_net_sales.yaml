id: meta_attribution_net_sales
display_name: Meta Attribution Net Sales
category: attribution
status: certified
description: >-
  Net sales from Meta (Facebook/Instagram paid ads) — the default answer to "Meta net sales", "net
  sales from Meta", "Meta channel revenue". Computed on serve.channel_pnl as gross sales − discounts
  on the order date, minus returns and cancellations of Meta-attributed orders on the date they happen
  (the Meta Attribution Overview "Net Sales" card). Because returns/cancels land on their event date,
  a short window can be NEGATIVE when returns of earlier orders exceed new sales — say so rather than
  treating it as an error. Meta = last-touch platform facebook/instagram/meta; organic-social and
  link-in-bio clicks are counted as unattributed, not Meta. Ex-GST, INR. Not this: for sales of orders
  PLACED in the window (no later deductions) use attributed_net_revenue filtered lt_platform=meta; for
  per-campaign/adset/ad Meta sales use ad_channel_net_sales with channel=meta; for Google use
  google_attribution_net_sales.
formula:
  human_readable: Meta gross − discounts − event returns − event cancels
  authoritative_source: cube
cube_mapping:
  view: channel_pnl
  measure: channel_pnl.meta_net_sales
aggregation: additive
unit: currency
currency_default: INR
grain: day
supported_dimensions:
- brand_id
- report_date
- channel
supported_filters:
- date_range
- brand_id
- channel
data_owner: Growth / Attribution
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Meta Attribution Net Sales June 2026
  request:
    measures:
    - meta_attribution_net_sales
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- June 2026 brand 20 ≈ ₹22,96,616.94 (dashboard); Cube may be within ~₹2k of commerce_order_events basis
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: pnlService.getAttributionChannelPnl + lineItemHistoricalSql.buildChannelMetricsSql
companion_measures:
- meta_net_profit
