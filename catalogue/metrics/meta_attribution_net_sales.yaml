id: meta_attribution_net_sales
display_name: Meta Attribution Net Sales
category: attribution
status: certified
description: >-
  Net sales from Meta (Facebook/Instagram paid ads) — the default for "Meta net sales", "net sales from Meta", "Meta channel revenue" (id: meta_attribution_net_sales); formula: Meta gross − discounts − event-date returns/cancels on channel_pnl; grain: day × channel (meta), additive; date axis: report_date (platform account day); scope: Meta last-touch (facebook/instagram/meta), organic-social and link-in-bio are unattributed; siblings: for order-date sales (no later deductions) use attributed_net_revenue filtered lt_platform=meta, for per-campaign/adset/ad use ad_channel_net_sales with channel=meta, for Google use google_attribution_net_sales.
formula:
  human_readable: Meta gross − discounts − event returns − event cancels
  authoritative_source: cube
cube_mapping:
  view: channel_pnl
  measure: channel_pnl.meta_net_sales
aggregation: additive
unit: currency
currency_default: INR
grain: day
supported_dimensions:
- brand_id
- report_date
- channel
supported_filters:
- date_range
- brand_id
- channel
data_owner: Growth / Attribution
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Meta Attribution Net Sales June 2026
  request:
    measures:
    - meta_attribution_net_sales
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- June 2026 brand 20 ≈ ₹22,96,616.94 (dashboard); Cube may be within ~₹2k of commerce_order_events basis
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: pnlService.getAttributionChannelPnl + lineItemHistoricalSql.buildChannelMetricsSql
companion_measures:
- meta_net_profit
