id: cac
display_name: CAC (Customer Acquisition Cost)
category: finance
status: certified
description: >
  Period ad spend (Meta+Google+Amazon) per new attributed customer.
  CAC = total_ad_spend / new_customers. Component of LTV:CAC.
formula:
  human_readable: SUM(total_ad_spend) / SUM(new_customers)
  authoritative_source: cube
cube_mapping:
  view: ltv_cac
  measure: ltv_cac.cac
aggregation: ratio
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Growth / Finance
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst]
  scopes: [metrics:read]
validation_tests: []
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard fe-dashboard performanceSummary.js
