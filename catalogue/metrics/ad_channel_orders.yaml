id: ad_channel_orders
display_name: Attributed Orders (cross-platform, ad grain)
category: attribution
status: certified
description: >-
  Orders per ad channel, campaign, adset and ad (Meta and Google) — "orders by campaign", "which ads
  drive orders". Counts Shopify orders on their placement (order) date by last-touch channel/campaign,
  from serve.ad_channel_pnl_daily. Summed over all rows of a channel it equals that channel's orders
  on serve.channel_pnl. Use with ad_channel_spend and ad_channel_roas. Filter row_type='detail' to
  rank campaigns/ads (reconciliation rows hold unplaceable orders). Not this: all-business orders →
  total_orders; orders by channel only → channel_orders.
formula:
  human_readable: SUM(orders)
  authoritative_source: cube
cube_mapping:
  view: ad_channel_pnl
  measure: ad_channel_pnl.orders
aggregation: additive
unit: count
grain: daily campaign/adset/ad × channel
supported_dimensions:
- brand_id
- report_date
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
supported_filters:
- date_range
- brand_id
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Attributed orders by campaign last 30 days
  request:
    measures:
    - ad_channel_orders
    dimensions:
    - campaign_name
    filters:
    - dimension: row_type
      operator: equals
      values: [detail]
    time_range:
      preset: last_30d
validation_tests:
- ad_channel_orders >= 0 for any slice
