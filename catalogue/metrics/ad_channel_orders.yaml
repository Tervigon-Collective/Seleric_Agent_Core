id: ad_channel_orders
display_name: Attributed Orders (cross-platform, ad grain)
category: attribution
status: certified
description: >
  Attributed orders at campaign/adset/ad grain across both platforms (channel = meta/google),
  on the channel-P&L event-date basis, from ad_channel_pnl. Use with ad_channel_spend /
  ad_channel_roas to judge which campaigns/ads drive volume. Rolls up to channel_pnl.
formula:
  human_readable: SUM(orders)
  authoritative_source: cube
cube_mapping:
  view: ad_channel_pnl
  measure: ad_channel_pnl.orders
aggregation: additive
unit: count
grain: daily campaign/adset/ad × channel
supported_dimensions:
- brand_id
- report_date
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
supported_filters:
- date_range
- brand_id
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Attributed orders by campaign last 30 days
  request:
    measures:
    - ad_channel_orders
    dimensions:
    - campaign_name
    filters:
    - dimension: row_type
      operator: equals
      values: [detail]
    time_range:
      preset: last_30d
validation_tests:
- ad_channel_orders >= 0 for any slice
