id: google_spend
display_name: Google Spend (Google-only)
category: paid_media
status: certified
description: >-
  Google Ads spend as reported by Google, per campaign per day on serve.google_ads_daily (INR) —
  default for "Google spend", "Google Ads cost". Slice by customer account, campaign, campaign_type
  (SEARCH | PERFORMANCE_MAX | SHOPPING | DEMAND_GEN | VIDEO | DISPLAY). Campaign grain only (no ad
  group/ad).
formula:
  human_readable: SUM(google_spend)
  authoritative_source: cube
cube_mapping:
  view: google_ad_performance
  measure: google_ad_performance.google_spend
aggregation: additive
unit: INR
grain: daily campaign grain (brand x customer account x day x campaign)
supported_dimensions:
- brand_id
- report_date
- customer_account_id
- campaign_id
- campaign_name
- campaign_type
supported_filters:
- date_range
- brand_id
- customer_account_id
- campaign_id
- campaign_name
- campaign_type
data_owner: Growth / Paid Media
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Google Spend (Google-only) last 30 days
  request:
    measures:
    - google_spend
    time_range:
      preset: last_30d
validation_tests:
- google_spend >= 0 for any slice
currency_default: INR
dashboard_alignment:
  status: match
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: historicalAnalytics/analyticsClickhouse.js:896
