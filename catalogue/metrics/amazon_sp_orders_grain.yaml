id: amazon_sp_orders_grain
display_name: Amazon SP Orders (order grain)
category: commerce
status: certified
description: Distinct Amazon SP orders on the placement axis from the amazon_orders view (INCL GST).
  Not the all-channels amazon_orders metric and not cancelled-excluded Historical Analytics Total
  Orders slice unless is_cancelled is filtered.
formula:
  human_readable: orders
  authoritative_source: cube
cube_mapping:
  view: amazon_orders
  measure: amazon_orders.orders
aggregation: additive
unit: count
grain: order
supported_dimensions:
- brand_id
- order_date
- order_status
supported_filters:
- date_range
- brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Amazon SP Orders (order grain) last 30 days
  request:
    measures:
    - amazon_sp_orders_grain
    time_range:
      preset: last_30d
validation_tests:
- amazon_sp_orders_grain is defined on amazon_orders
dashboard_alignment:
  status: not_in_dashboard
  audited_on: '2026-09-09'
  source: Seleric_Dashboard/Node-Backend
  note: Certified Cube port; no single Historical Analytics card maps 1:1.
