id: net_profit_all_channels
display_name: Net Profit (all channels — P&L Forecast)
category: finance
status: certified
description: >
  P&L Forecast Net Profit: all-channel net sales (ex-GST) − all-channels TOC − Total Ad Spend
  (Meta+Google). Shopify is the only channel served, so this equals net sales − Net COGS − total ad
  spend. Distinct from Shopify-only net_profit (which uses the same inputs on the Shopify-only
  card).
formula:
  human_readable: net_sales_all_channels - total_operating_cost_all_channels - total_ad_spend
  authoritative_source: cube
  depends_on:
  - net_sales_all_channels
  - total_operating_cost_all_channels
  - total_ad_spend
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.net_profit_all_channels
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  scopes:
  - metrics:read
examples:
- question: P&L Net Profit for June 2026
  request:
    measures:
    - net_profit_all_channels
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- Identity is net_sales_all − TOC_all − total_ad_spend on the same slice.
deprecated_aliases: []
dashboard_alignment:
  status: unclear
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: data_platform/mage-ai/infra/cube/model/cubes/serve_canonical_pnl.yml:240-253
  note: >
    Serve layer is Shopify-only (2026-09-17), so this equals the Shopify figure. A dashboard
    All-channels card that also counts other marketplaces will not match.
companion_measures:
- net_profit
