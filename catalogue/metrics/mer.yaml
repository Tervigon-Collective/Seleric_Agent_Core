id: mer
display_name: MER (Media Efficiency Ratio)
category: finance
status: certified
description: >-
  Marketing efficiency ratio (MER): business net sales ÷ total ad spend (Meta + Google), recomputed
  from period sums on serve.canonical_pnl. Use for "MER", "blended ROAS", "sales per rupee of ads".
  Not net ROAS (which subtracts COGS) and not per-campaign ROAS (ad_channel_roas).
formula:
  human_readable: SUM(net_sales) / SUM(total_ad_spend)
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.mer
aggregation: ratio
unit: ratio
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  scopes:
  - metrics:read
examples:
- question: MER for June 2026
  request:
    measures:
    - mer
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- mer equals sum(net_sales)/sum(total_ad_spend) for the same slice
deprecated_aliases: []
ratio_components:
  numerator: canonical_pnl.net_sales
  denominator: canonical_pnl.total_ad_spend
dashboard_alignment:
  status: not_implemented
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: —
  note: No media-efficiency-ratio (MER) field anywhere in Node-Backend.
