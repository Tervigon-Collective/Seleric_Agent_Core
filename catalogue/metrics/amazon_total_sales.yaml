id: amazon_total_sales
display_name: Total Sales (Amazon-only, incl. GST)
category: commerce
status: certified
description: >
  Amazon SP order_total_header for non-canceled placements in range.
  Matches the Amazon Attribution "Total Sales" card (June 2026 brand 20 =
  ₹268,622.00). Canceled orders contribute ₹0.
formula:
  human_readable: SUM(order_total_header) on non-canceled Amazon SP placements
  authoritative_source: cube
cube_mapping:
  view: amazon_attribution_overview
  measure: amazon_attribution_overview.total_sales
  time_dimension: amazon_attribution_overview.report_date
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
  - brand_id
  - report_date
supported_filters:
  - date_range
  - brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
  - question: Amazon Total Sales June 2026
    request:
      measures: [amazon_total_sales]
      time_range: {start: "2026-06-01", end: "2026-06-30"}
validation_tests:
  - June 2026 brand 20 = ₹268,622.00
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: amazonSummaryMetrics.js amazonDisplayTotalSales
