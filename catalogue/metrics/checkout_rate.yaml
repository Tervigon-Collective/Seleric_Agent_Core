id: checkout_rate
display_name: Checkout rate
category: web_analytics
status: certified
description: 'Sessions reaching checkout ÷ sessions. Grain: session. Date axis: native. Ignores date_axis (its own
  clock, D-36).'
formula:
  human_readable: Sessions reaching checkout ÷ sessions.
  authoritative_source: cube
  depends_on:
  - sessions
cube_mapping:
  view: web_sessions
  measure: web_sessions.checkout_rate
aggregation: ratio
unit: ratio
grain: session
data_owner: Growth / Web Analytics
access_policy:
  roles_allowed:
  - analyst
  - exec
  - growth_lead
  - ops
  scopes:
  - metrics:read
version: 1.0.0
replaces:
- session_checkout_rate
date_axis: native
direction_bad: down
