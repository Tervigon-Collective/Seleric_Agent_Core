id: finance_waterfall_net_profit
display_name: Finance Waterfall Net Profit
category: finance
status: certified
description: >-
  Net profit line of the management P&L waterfall (serve.finance_waterfall_daily), per brand-day
  (INR). Use only when the user asks about the finance waterfall; it is a separate model and will not
  match net_profit_all_channels.
formula:
  human_readable: line_net_profit
  authoritative_source: cube
cube_mapping:
  view: finance_waterfall
  measure: finance_waterfall.line_net_profit
aggregation: additive
unit: INR
grain: daily brand
supported_dimensions:
- brand_id
supported_filters:
- date_range
- brand_id
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Finance Waterfall Net Profit last 30 days
  request:
    measures:
    - finance_waterfall_net_profit
    time_range:
      preset: last_30d
validation_tests:
- finance_waterfall_net_profit is defined on view finance_waterfall
