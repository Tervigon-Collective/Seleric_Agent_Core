id: product_operating_cost
display_name: Product operating cost
category: product
status: certified
description: 'Fulfilment and payment cost = shipping + packaging + gateway + COD + checkout + weight + provisional
  + reverse shipping. Grain: order_line_event. Date axis: switchable. date_axis=order_date (default, orders placed
  in the period) or event_date (outcomes on the day they happen). Redefined in semantic v3 (D-03; D-01; D-02; D-02a;
  D-02b; D-03a; D-05; D-06…): the id is kept, the number may change. Also answers the ids: product_pnl_operating_cost.'
formula:
  human_readable: Fulfilment and payment cost = shipping + packaging + gateway + COD + checkout + weight + provisional
    + reverse shipping.
  authoritative_source: cube
  depends_on:
  - product_shipping_cost
  - product_packaging_cost
  - product_payment_gateway_fees
  - product_order_cod_handling_fee
  - product_order_checkout_fee
  - product_order_weight_discrepancy_cost
  - product_order_provisional_ops_cost
  - product_rto_cost
  composition:
  - metric: product_shipping_cost
    sign: 1
  - metric: product_packaging_cost
    sign: 1
  - metric: product_payment_gateway_fees
    sign: 1
  - metric: product_order_cod_handling_fee
    sign: 1
  - metric: product_order_checkout_fee
    sign: 1
  - metric: product_order_weight_discrepancy_cost
    sign: 1
  - metric: product_order_provisional_ops_cost
    sign: 1
  - metric: product_rto_cost
    sign: 1
cube_mapping:
  view: product_profit
  measure: product_profit.operating_cost
aggregation: additive
unit: INR
currency_default: INR
grain: order_line_event
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
version: 2.0.0
replaces: []
date_axis: switchable
date_axis_dimensions:
  order_date: product_profit.order_date
  event_date: product_profit.event_date
decision_ids:
- D-03
