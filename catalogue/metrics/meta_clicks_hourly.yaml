id: meta_clicks_hourly
display_name: Meta Clicks (hourly)
category: paid_media
status: certified
description: >
  Meta Clicks (hourly). Intraday grain from serve.meta_ad_performance_hourly; hourly
  totals reconcile exactly to the daily metric (meta_clicks).
  Use hour_of_day (IST 0-23) or report_hour_ts (granularity hour). Platform delivery
  only (attribution boundary).
formula:
  human_readable: SUM(meta_clicks)
  authoritative_source: cube
cube_mapping:
  view: meta_ad_performance_hourly
  measure: meta_ad_performance_hourly.meta_clicks
aggregation: additive
unit: count
grain: hourly ad grain
supported_dimensions:
- brand_id
- report_date
- hour_of_day
- report_hour_ts
- ad_account_id
- campaign_id
- campaign_name
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_type
supported_filters:
- brand_id
- report_date
- hour_of_day
- report_hour_ts
- ad_account_id
- campaign_id
- campaign_name
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_type
data_owner: Growth / Paid Media
access_policy:
  roles_allowed: [exec, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
- question: Meta Clicks (hourly) last 30 days
  request:
    measures:
    - meta_clicks_hourly
    time_range:
      preset: last_30d
validation_tests:
- meta_clicks_hourly >= 0 for any slice
- hourly sum equals daily counterpart for the same brand/date
currency_default: INR
dashboard_alignment:
  status: match
  audited_on: '2026-07-31'
  source: gold.fct_meta_ads_hourly / gold.fct_google_campaigns_hourly
  note: Hourly Σ reconciles to the certified daily paid-media metric (verified 2026-07-31 b20).
