id: returns_cancels
display_name: Returns + Cancels Orders (Shopify-only)
category: commerce
status: certified
description: >-
  Orders with a return OR cancellation in the period, counted on the event date, from
  serve.commerce_order_events (dashboard Returns / Cancels card). Sliceable by geo, payment, UTM.
  Split → refunded_orders (returns) and cancelled_orders. Same total as returns_cancels_all_channels.
formula:
  human_readable: 'Distinct orders with a cancellation or return event in period (pnl_refund_class buckets, gift cards excluded)

    '
  authoritative_source: cube
cube_mapping:
  view: commerce_orders
  measure: commerce_orders.returns_cancels_orders
  time_dimension: commerce_orders.event_date
aggregation: additive
unit: count
grain: order
supported_dimensions:
- brand_id
- event_date
- payment_method
- payment_bucket
- utm_source
- utm_medium
- utm_campaign
- source_name
- shipping_country
- shipping_region
- shipping_city
- shipping_pincode
- shipping_state_code
- order_status
- return_status
- fulfillment_status
- payment_gateway
- is_cod
- is_prepaid
- financial_status
- event_type
- item_count
- order_name
- commerce_order_id
supported_filters:
- date_range
- brand_id
- payment_method
- payment_bucket
- utm_source
- utm_medium
- utm_campaign
- source_name
- shipping_country
- shipping_region
- shipping_city
- shipping_pincode
- shipping_state_code
- order_status
- return_status
- fulfillment_status
- payment_gateway
- is_cod
- is_prepaid
- financial_status
- event_type
- item_count
- order_name
- commerce_order_id
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Returns and cancellations last 30 days
  request:
    measures:
    - returns_cancels
    time_range:
      preset: last_30d
validation_tests:
- reconciles to dashboard Returns / Cancels card for closed periods
deprecated_aliases: []
