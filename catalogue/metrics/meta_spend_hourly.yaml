id: meta_spend_hourly
display_name: Meta Spend (hourly)
category: paid_media
status: certified
description: >-
  Meta spend by hour of day (IST 0–23) or hourly timestamp, on serve.meta_ads_hourly (INR) — use for
  intraday / dayparting questions. Hourly values add up exactly to meta_spend for the day.
formula:
  human_readable: SUM(meta_spend)
  authoritative_source: cube
cube_mapping:
  view: meta_ad_performance_hourly
  measure: meta_ad_performance_hourly.meta_spend
aggregation: additive
unit: INR
grain: hourly ad grain
supported_dimensions:
- brand_id
- report_date
- hour_of_day
- report_hour_ts
- ad_account_id
- campaign_id
- campaign_name
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_type
supported_filters:
- brand_id
- report_date
- hour_of_day
- report_hour_ts
- ad_account_id
- campaign_id
- campaign_name
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_type
data_owner: Growth / Paid Media
access_policy:
  roles_allowed: [exec, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
- question: Meta Spend (hourly) last 30 days
  request:
    measures:
    - meta_spend_hourly
    time_range:
      preset: last_30d
validation_tests:
- meta_spend_hourly >= 0 for any slice
- hourly sum equals daily counterpart for the same brand/date
currency_default: INR
dashboard_alignment:
  status: match
  audited_on: '2026-07-31'
  source: gold.fct_meta_ads_hourly / gold.fct_google_campaigns_hourly
  note: Hourly Σ reconciles to the certified daily paid-media metric (verified 2026-07-31 b20).
