id: product_views
display_name: Product Views
category: web_analytics
status: certified
description: >-
  Product detail page (PDP) view events per day and channel on serve.web_events_daily. Counts views,
  not sessions — for sessions that viewed a product use session_pdp_rate.
formula:
  human_readable: SUM(events WHERE event_type = 'product_view')
  authoritative_source: cube
cube_mapping:
  view: web_events_daily
  measure: web_events_daily.product_views
aggregation: additive
unit: count
grain: brand × day × fine channel
supported_dimensions:
- brand_id
- report_date
- channel
supported_filters:
- date_range
- brand_id
- channel
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Product views by channel last 30 days
  request:
    measures:
    - product_views
    dimensions:
    - channel
    time_range:
      preset: last_30_days
validation_tests:
- product_views >= 0
deprecated_aliases: []
dashboard_alignment:
  status: not_implemented
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: channelFunnel/martFunnelClickhouse.js:29
  note: Only session count (pdp_sessions) exists; no product-view event rollup.
