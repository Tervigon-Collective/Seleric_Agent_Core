    orders with product_net + shipping_charged > 0. Date: order date (IST). GST: ex-GST amounts. Shopify: Per order: sum of
    product net over its lines + GST-free shipping > 0. Amazon: Amazon order total / 1.18 > 0 (cancelled orders and orders
    with no order total are out). Excludes: zero-value orders.'
