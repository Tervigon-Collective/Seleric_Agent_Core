id: product_order_discounts
display_name: Product discounts (P&L basis)
category: product
status: certified
description: 'Discounts ex-GST. Memo: already deducted inside gross_sales (D-09a), so not subtracted again in net
  sales. Grain: order_line_event. Date axis: placement only. date_axis=order_date (default, orders placed in the
  period) or event_date (outcomes on the day they happen). Redefined in semantic v3 (D-09a; D-01; D-02; D-02a; D-02b;
  D-03; D-03a; D-05…): the id is kept, the number may change. Also answers the ids: product_discounts, product_pnl_discounts.'
formula:
  human_readable: 'Discounts ex-GST. Memo: already deducted inside gross_sales (D-09a), so not subtracted again
    in net sales.'
  authoritative_source: cube
  depends_on: []
cube_mapping:
  view: product_profit
  measure: product_profit.discounts
aggregation: additive
unit: INR
currency_default: INR
grain: order_line_event
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
version: 2.0.0
replaces: []
date_axis: placement_only
date_axis_dimensions:
