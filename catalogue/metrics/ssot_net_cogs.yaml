description: 'Cost of goods after returns: Gross COGS plus the return courier cost, minus the product cost won back and the
  Amazon fees given back. Formula: placed_cogs + rto_cost - product_cost_credit - fee_reversal. Date: mixed on purpose (D-07):
  placed costs on order date, return-leg items on their event dates. GST: no GST (a cost). Shopify: fee_reversal is 0. Amazon:
  Fees given back reduce the cost. Excludes: ad spend. Grain: brand_day_channel. Date axis: native (one hybrid axis, D-07).
  SSOT P&L view over gold.fct_ssot_pnl_daily (Shopify and Amazon, channel amazon; D-104).'
