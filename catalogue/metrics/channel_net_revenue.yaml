id: channel_net_revenue
display_name: Channel Net Revenue (ex-GST, channel attribution daily)
category: attribution
status: draft
description: >-
  Net sales of orders PLACED in the period, by acquisition channel (meta | google | organic_shopify |
  unattributed) — "sales generated by Meta orders last week". Sums each order's net sales (ex-GST) on
  its order date from serve.channel_attribution_daily; later returns/cancels are NOT deducted, so it
  is never pushed negative by old returns. Differs from the channel Overview cards
  (meta_attribution_net_sales), which deduct returns/cancels on their event date. State which basis
  you used when both are plausible. Draft: not exposed to search.
formula:
  human_readable: SUM(net_revenue_excl_tax) by channel
  authoritative_source: cube
cube_mapping:
  view: channel_attribution
  measure: channel_attribution.net_revenue_excl_tax
aggregation: additive
unit: currency
currency_default: INR
grain: brand × day × channel
supported_dimensions:
  - brand_id
  - report_date
  - channel
  - revenue_basis
  - source_platform
supported_filters:
  - date_range
  - brand_id
  - channel
  - source_platform
data_owner: Growth / Attribution
access_policy:
  roles_allowed: [exec, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
- question: Channel Net Revenue (ex-GST, channel attribution daily) last 30 days
  request:
    measures:
    - channel_net_revenue
    time_range:
      preset: last_30d
validation_tests:
  - channel_net_revenue is Shopify-basis only on meta/google/organic_shopify rows
  - June 2026 brand 20 meta channel ≈ ₹24,24,851.18
deprecated_aliases: []
dashboard_alignment:
  status: not_implemented
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  note: >
    The catalogued channel_attribution_daily split has zero references in Node-Backend; the nearest
    real endpoint uses a different channel definition and excludes cancelled orders.
