id: ssot_cost_amz_shipping
display_name: SSOT Amazon shipping fee
category: finance
status: approved
description: 'Amazon shipping fee (Amazon charges it for delivery) on the placed Amazon orders. Not the shipping a customer
  paid. Formula: sum of effective shipping fee of the orders. Date: purchase date (IST, a calendar date). GST: as stored in
  the warehouse. Shopify: 0. Amazon: fct_amazon_sp_order_pnl.effective_shipping (actual if settled, else estimate), positive
  cost. Grain: brand_day_channel. Date axis: native (one hybrid axis, D-07). SSOT P&L view over gold.fct_ssot_pnl_daily (Shopify
  and Amazon, channel amazon; D-104).'
