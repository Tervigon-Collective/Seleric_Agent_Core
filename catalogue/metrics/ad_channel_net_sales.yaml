id: ad_channel_net_sales
display_name: Ad-grain Channel Net Sales
category: attribution
status: certified
description: >-
  Net sales per ad channel, campaign, adset and ad (Meta and Google) — use for "net sales by campaign / adset / ad" or to compare Meta vs Google campaigns (id: ad_channel_net_sales); formula: gross − discounts on order date − event-date returns/cancels on ad_channel_pnl; grain: daily campaign/adset/ad × channel (meta|google|organic|unattributed), additive; date axis: report_date; scope: event-date basis, include reconciliation rows (row_type=reconciliation) for channel totals, filter row_type=detail for campaign/ad ranking; siblings: for Meta Overview use meta_attribution_net_sales, for Google Overview use google_attribution_net_sales, for brand-day totals use net_sales_all_channels.
formula:
  human_readable: net_sales
  authoritative_source: cube
cube_mapping:
  view: ad_channel_pnl
  measure: ad_channel_pnl.net_sales
aggregation: additive
unit: INR
grain: daily campaign/adset/ad × channel
supported_dimensions:
- brand_id
- report_date
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
supported_filters:
- date_range
- brand_id
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Ad-grain Channel Net Sales last 30 days
  request:
    measures:
    - ad_channel_net_sales
    time_range:
      preset: last_30d
validation_tests:
- ad_channel_net_sales is defined on view ad_channel_pnl
