id: ad_channel_net_sales
display_name: Ad-grain Channel Net Sales
category: attribution
status: certified
description: >-
  Net sales per ad channel, campaign, adset and ad (Meta and Google) — use for "net sales by campaign
  / adset / ad" or to compare Meta vs Google campaigns. Same event-date basis as the Overview cards:
  gross − discounts on the order date, minus returns/cancels on their event date
  (serve.ad_channel_pnl_daily). Ex-GST, INR. Summed over all rows of a channel it equals
  meta_attribution_net_sales / google_attribution_net_sales exactly, because row_type='reconciliation'
  rows (is_unattributed=1) carry sales that cannot be placed on a campaign (and the basis difference).
  Include reconciliation rows for channel totals; filter row_type='detail' (and optionally
  is_unattributed=0) when ranking campaigns/ads. Slice: channel (meta|google|organic|unattributed),
  campaign_*, adset_*, ad_*.
formula:
  human_readable: net_sales
  authoritative_source: cube
cube_mapping:
  view: ad_channel_pnl
  measure: ad_channel_pnl.net_sales
aggregation: additive
unit: INR
grain: daily campaign/adset/ad × channel
supported_dimensions:
- brand_id
- report_date
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
supported_filters:
- date_range
- brand_id
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Ad-grain Channel Net Sales last 30 days
  request:
    measures:
    - ad_channel_net_sales
    time_range:
      preset: last_30d
validation_tests:
- ad_channel_net_sales is defined on view ad_channel_pnl
