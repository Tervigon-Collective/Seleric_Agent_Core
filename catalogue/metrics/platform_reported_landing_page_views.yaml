id: platform_reported_landing_page_views
display_name: Platform reported landing page views
category: paid_media
status: certified
description: 'Landing page views as the ad platform reports them. Diagnostic twin of landing_page_views, hidden
  by default (D-13r); never an ad metric. Grain: ad_day. Date axis: native. Ignores date_axis (its own clock, D-36).'
formula:
  human_readable: Landing page views as the ad platform reports them. Diagnostic twin of landing_page_views, hidden
    by default (D-13r); never an ad metric.
  authoritative_source: cube
  depends_on: []
cube_mapping:
  view: paid_media
  measure: paid_media.platform_reported_landing_page_views
aggregation: additive
unit: count
grain: ad_day
data_owner: Growth / Paid Media
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
version: 1.0.0
replaces: []
date_axis: native
hidden_by_default: true
decision_ids:
- D-13r
bindings:
- name: hourly
  view: paid_media_hourly
  measure: paid_media_hourly.platform_reported_landing_page_views
  granularities:
  - hour
- name: breakdowns
  view: paid_media_breakdowns
  measure: paid_media_breakdowns.platform_reported_landing_page_views
  dimensions:
  - breakdown_type
  - age
  - gender
  - publisher_platform
  - platform_position
  - impression_device
  - device_platform
  - country
  - region
  slice_dimension: breakdown_type
  slices:
    age:
    - age_and_gender
    gender:
    - age_and_gender
    platform_position:
    - placement
    impression_device:
    - placement
    device_platform:
    - platform_device
    publisher_platform:
    - publisher_platform
    - placement
    - platform_device
    region: []
    country: []
  note: 'Meta only: Google reports no audience breakdowns, so Google delivery is not in these rows.'
