id: ssot_net_roas
display_name: SSOT Net ROAS
category: finance
status: approved
description: 'Net ROAS = Gross Profit / ad spend; break-even is 1.00. Grain: brand_day_channel. Date axis: native (one hybrid
  axis: order date for sales and costs, event date for returns and cancels, D-07). SSOT P&L view over gold.fct_ssot_pnl_daily
  (Shopify and Amazon, channel amazon; D-104).'
formula:
