id: amazon_tcs_tds
display_name: Amazon TCS + TDS (settlement)
category: commerce
status: certified
description: >
  Tax collected/deducted at source (TCS + TDS) withheld by Amazon on the
  settlement flat-file (gold.fct_amazon_sp_settlement_order_pnl). Reclaimable
  tax, so it is surfaced SEPARATELY and deliberately NOT included in Amazon
  Total Fees or Net Profit. Presented as a positive magnitude. Only populated
  for SETTLED orders. June 2026 brand 20 = ₹787.90.
formula:
  human_readable: Σ |settlement total_tax_withheld| for settled orders (purchase_date axis)
  authoritative_source: cube
cube_mapping:
  view: amazon_commerce_performance
  measure: amazon_commerce_performance.tcs_tds
  time_dimension: amazon_commerce_performance.report_date
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
  - brand_id
  - report_date
supported_filters:
  - date_range
  - brand_id
data_owner: Finance
access_policy:
  roles_allowed: [exec, finance, analyst, ops]
  scopes: [metrics:read]
examples:
  - question: Amazon TCS and TDS withheld for June 2026
    request:
      measures: [amazon_tcs_tds]
      time_range: {start: "2026-06-01", end: "2026-06-30"}
validation_tests:
  - June 2026 brand 20 = ₹787.90
  - not included in amazon_net_profit
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-08-03'
  source: Seleric_Dashboard/Node-Backend
  evidence: integrations/amazonShared/amazonSettlementPnl.js (settlement_total_tax_withheld, excluded from fees/profit)
