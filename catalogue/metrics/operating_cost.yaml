id: operating_cost
display_name: Operating cost
category: finance
status: certified
description: 'Fulfilment and payment cost = shipping + packaging + gateway + COD + checkout + weight + provisional
  + reverse shipping. Grain: brand_day_channel_ad. Date axis: switchable. date_axis=order_date (default, orders
  placed in the period) or event_date (outcomes on the day they happen). Redefined in semantic v3 (D-03; D-01; D-02;
  D-02a; D-02b; D-03a; D-05; D-06…): the id is kept, the number may change. Also answers the ids: pnl_operating_cost.'
formula:
  human_readable: Fulfilment and payment cost = shipping + packaging + gateway + COD + checkout + weight + provisional
    + reverse shipping.
  authoritative_source: cube
  depends_on:
