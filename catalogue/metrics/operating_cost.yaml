  - packaging_cost
  - payment_gateway_fees
  - cod_handling_fee
  - checkout_fee
  - weight_discrepancy_cost
  - provisional_ops_cost
  - rto_cost
  composition:
  - metric: shipping_cost
    sign: 1
  - metric: packaging_cost
    sign: 1
  - metric: payment_gateway_fees
    sign: 1
  - metric: cod_handling_fee
    sign: 1
  - metric: checkout_fee
    sign: 1
  - metric: weight_discrepancy_cost
    sign: 1
  - metric: provisional_ops_cost
    sign: 1
  - metric: rto_cost
    sign: 1
cube_mapping:
