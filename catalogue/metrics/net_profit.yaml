id: net_profit
display_name: Net Profit (Shopify-only, Meta+Google spend)
category: finance
status: certified
description: 'Canonical P&L net profit in `serve_canonical_pnl`: Shopify net sales (ex-GST) − Shopify
  Net COGS − Shopify ad spend (Meta + Google). This maps to `canonical_pnl.net_profit_shopify` and is
  distinct from all-platform variants (`net_profit_blended`, `net_profit_all_channels`).'
formula:
  human_readable: commerce_net_revenue_daily - net_cogs - (meta_spend + google_spend)
  authoritative_source: cube
  depends_on:
  - commerce_net_revenue_daily
  - net_cogs
  - meta_spend
  - google_spend
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.net_profit_shopify
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  scopes:
  - metrics:read
examples:
- question: Shopify-only Net Profit for June 2026
  request:
    measures:
    - net_profit
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- net_profit can be negative (loss periods are valid)
- net_profit equals net_sales - net_cogs - shopify_ad_spend for the same slice
deprecated_aliases: []
dashboard_alignment:
  status: drift_corrected
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: src/services/dashboardService.js:132,136
  note: >
    Catalogue metric is Shopify-only Cube (`canonical_pnl.net_profit_shopify`).
    Dashboard P&L Forecast Net Profit is blended all-channels and may apply a
    Node-Backend Amazon pending-refund + return-label overlay that Cube does not.
    For all-channel cards use net_profit_all_channels and state the Cube basis.
companion_measures:
- net_profit_all_channels
- net_profit_blended
