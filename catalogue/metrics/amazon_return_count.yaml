id: amazon_return_count
display_name: Return Count (Amazon-only, Dashboard Equivalent)
category: commerce
status: certified
description: >
  Alias for the dashboard "Returns / Cancels" card on Amazon: returned orders
  (delivery-date Returns Report) plus cancelled orders (purchase_date).
  June 2026 brand 20 = 24. Same Cube measure as amazon_returns_cancels.
formula:
  human_readable: amazon_returned_orders + amazon_cancelled_orders
  authoritative_source: cube
cube_mapping:
  view: amazon_attribution_overview
  measure: amazon_attribution_overview.returns_cancels
  time_dimension: amazon_attribution_overview.report_date
aggregation: additive
unit: count
grain: daily
supported_dimensions:
  - brand_id
  - report_date
supported_filters:
  - date_range
  - brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
  - question: Amazon total return count last month
    request:
      measures: [amazon_return_count]
      time_range: {preset: last_month}
validation_tests:
  - amazon_return_count == amazon_returns_cancels
  - June 2026 brand 20 = 24
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: amazonSummaryMetrics.js amazonReturnsCancelsTotal
