id: product_cost_all_channels
display_name: Product Cost (all channels — P&L)
category: finance
status: certified
description: >
  P&L Forecast Product Cost: Shopify merchandise product_cost. Shopify is the only channel served,
  so this equals product_cost.
formula:
  human_readable: SUM(product_cost)
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.product_cost_all_channels
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
  - brand_id
  - report_date
supported_filters:
  - date_range
  - brand_id
data_owner: Finance
access_policy:
  roles_allowed: [exec, finance]
  scopes: [metrics:read]
examples:
  - question: P&L Product Cost for June 2026
    request:
      measures: [product_cost_all_channels]
      time_range: {start: "2026-06-01", end: "2026-06-30"}
validation_tests:
  - product_cost_all_channels equals product_cost for the same slice
deprecated_aliases: []
dashboard_alignment:
  status: unclear
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: src/services/pnlService.js:212-218
  note: >
    Serve layer is Shopify-only (2026-09-17), so this equals the Shopify figure. A dashboard
    All-channels card that also counts other marketplaces will not match.
