    Shopify: Credited quantity per line: cancelled order = full quantity; RTO = full quantity; return = returned quantity;
    exchange origin = exchanged quantity; minus quantity the ops app marks NOT_RESTOCKED. Orders placed before 2026-09-01
    (old costing): the old costing''s refunded product cost of the returned or cancelled line, restock status not checked.
    Active version 3 (closed returns + cancels, old-costing orders included); version 1 counted every return status. Amazon:
    For each refunded order item: min(returned quantity from the Returns Report, ordered quantity) x unit cost, on the first
    refund date of that item. Includes: closed returns, RTO, cancels. Excludes: open returns, written-off stock.'
  authoritative_source: cube
