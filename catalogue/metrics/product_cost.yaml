id: product_cost
display_name: Product cost
category: finance
status: certified
description: 'Product cost net of the restock credit. Grain: brand_day_channel_ad. Date axis: switchable. date_axis=order_date
  (default, orders placed in the period) or event_date (outcomes on the day they happen). Redefined in semantic
  v3 (D-03; D-03a; D-01; D-02; D-02a; D-02b; D-05; D-06…): the id is kept, the number may change. Also answers the
  ids: pnl_product_cost.'
formula:
  human_readable: Product cost net of the restock credit.
  authoritative_source: cube
  depends_on:
  - gross_cogs
  - product_cogs_credit
  composition:
  - metric: gross_cogs
    sign: 1
  - metric: product_cogs_credit
    sign: -1
cube_mapping:
  view: finance
  measure: finance.product_cost
aggregation: additive
unit: INR
currency_default: INR
grain: brand_day_channel_ad
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  scopes:
  - metrics:read
version: 3.0.0
replaces:
- product_cost_all_channels
date_axis: switchable
date_axis_dimensions:
  order_date: finance.order_date
  event_date: finance.event_date
decision_ids:
- D-03
- D-03a
