id: be_roas_all_channels
display_name: Break-Even ROAS (All Channels)
category: finance
status: certified
description: >-
  Break-even ROAS: net sales ÷ (net sales − Net COGS), recomputed from period sums on
  serve.canonical_pnl — the sales-per-rupee-of-ads needed to cover COGS. Default for "break-even ROAS"
  / "BE ROAS". Same number as be_roas. Compare against mer: MER above BE ROAS means ads are profitable
  after COGS.
formula:
  human_readable: net_sales_all_channels / (net_sales_all_channels - total_operating_cost_all_channels)
  authoritative_source: cube
  depends_on:
  - net_sales_all_channels
  - total_operating_cost_all_channels
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.be_roas_all_channels
aggregation: ratio
unit: ratio
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  scopes:
  - metrics:read
examples:
- question: Break-Even ROAS (All Channels) last 30 days
  request:
    measures:
    - be_roas_all_channels
    time_range:
      preset: last_30d
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard Historical Analytics BE ROAS (All channels)
ratio_components:
  numerator: canonical_pnl.net_sales_all_channels_pnl
  denominator: canonical_pnl.total_operating_cost_all_channels
