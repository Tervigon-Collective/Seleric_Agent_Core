id: be_roas_all_channels
display_name: Break-Even ROAS (All Channels)
category: finance
status: certified
description: >
  Historical Analytics All-channels BE ROAS =
  all-channel Net Sales / (all-channel Net Sales − all-channel TOC).
  Shopify-only BE ROAS is be_roas.
formula:
  human_readable: net_sales_all / (net_sales_all - toc_all)
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.be_roas_all_channels
aggregation: ratio
unit: ratio
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
