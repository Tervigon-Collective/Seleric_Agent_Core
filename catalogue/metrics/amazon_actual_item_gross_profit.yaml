  - metrics:read
examples:
- question: Amazon Actual Item Gross Profit last 30 days
  request:
    measures:
    - amazon_actual_item_gross_profit
    time_range:
      preset: last_30d
validation_tests:
- amazon_actual_item_gross_profit is defined on amazon_order_item_pnl
dashboard_alignment:
