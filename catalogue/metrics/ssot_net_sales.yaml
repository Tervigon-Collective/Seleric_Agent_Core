id: ssot_net_sales
display_name: SSOT net sales
category: finance
status: approved
description: 'What the business keeps from sales after returns and cancels. Shipping charged stays inside. Formula: product_net
  + shipping_charged - returns_closed - cancels. Date: mixed on purpose (D-07): placement on order date, returns and cancels
  on their event dates. GST: ex-GST. Shopify: Exchange replacement orders are revenue in their own channel (D-02); nothing
  is removed. Amazon: Same identity; the refund (principal) is the only deduction. Includes: shipping charged, exchange replacements.
  Excludes: discounts (already out of product_net). Grain: brand_day_channel. Date axis: native (one hybrid axis, D-07). SSOT
  P&L view over gold.fct_ssot_pnl_daily (Shopify and Amazon, channel amazon; D-104).'
formula:
  human_readable: 'What the business keeps from sales after returns and cancels. Shipping charged stays inside. Formula: product_net
    + shipping_charged - returns_closed - cancels. Date: mixed on purpose (D-07): placement on order date, returns and cancels
    on their event dates. GST: ex-GST. Shopify: Exchange replacement orders are revenue in their own channel (D-02); nothing
    is removed. Amazon: Same identity; the refund (principal) is the only deduction. Includes: shipping charged, exchange
    replacements. Excludes: discounts (already out of product_net).'
  authoritative_source: cube
  depends_on: []
cube_mapping:
  view: ssot_pnl
  measure: ssot_pnl.net_sales
aggregation: additive
unit: INR
grain: brand_day_channel
data_owner: Finance
access_policy:
