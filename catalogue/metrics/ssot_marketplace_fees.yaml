id: ssot_marketplace_fees
display_name: SSOT Amazon marketplace fees
category: finance
status: approved
description: 'Amazon marketplace fees (Total Fees): commission + closing + shipping + other service fees on the purchase date,
  minus the fees Amazon gives back on refunds (refund date). Equals the Dashboard Amazon page platform fees; tax withheld
  (TCS/TDS) not included. Amazon only. Grain: brand_day_channel. Date axis: native (one hybrid axis, D-07). SSOT P&L view
  over gold.fct_ssot_pnl_daily (Shopify and Amazon, channel amazon; D-104).'
formula:
  human_readable: 'Amazon marketplace fees (Total Fees): commission + closing + shipping + other service fees on the purchase
    date, minus the fees Amazon gives back on refunds (refund date). Equals the Dashboard Amazon page platform fees; tax withheld
    (TCS/TDS) not included. Amazon only.'
  authoritative_source: cube
  depends_on:
  - ssot_cost_amz_commission
  - ssot_cost_amz_closing
  - ssot_cost_amz_shipping
  - ssot_cost_amz_other
  - ssot_fee_reversal
cube_mapping:
  view: ssot_pnl
  measure: ssot_pnl.marketplace_fees
aggregation: additive
unit: INR
grain: brand_day_channel
data_owner: Finance
access_policy:
  roles_allowed:
  - analyst
  - exec
  - finance
  - growth_lead
  - ops
  scopes:
  - metrics:read
version: 1.0.0
replaces: []
