id: ssot_campaign_net_roas
display_name: SSOT Net ROAS by campaign / ad
category: finance
status: approved
description: 'Gross Profit earned per rupee of ad spend. 1.00 means ads exactly pay for themselves before overheads. Formula:
  gross_profit / ad_spend. Date: mixed. GST: ex-GST. Shopify: As formula. Amazon: As formula. Grain: brand_day_channel. Date
  axis: native (one hybrid axis, D-07). SSOT P&L view over gold.fct_ssot_pnl_daily (Shopify and Amazon, channel amazon; D-104).
  Campaign / ad set / ad grain: this is the same measure as ssot_net_roas split by channel, campaign, ad set and ad (Cube
  view ssot_ad_pnl, Shopify), summing to it per day and channel; use it for any breakdown or filter by campaign, ad set or
  ad. Google is campaign grain.'
formula:
  human_readable: 'Gross Profit earned per rupee of ad spend. 1.00 means ads exactly pay for themselves before overheads.
    Formula: gross_profit / ad_spend. Date: mixed. GST: ex-GST. Shopify: As formula. Amazon: As formula.'
  authoritative_source: cube
  depends_on:
  - ssot_gross_profit
  - ssot_ad_spend
cube_mapping:
  view: ssot_ad_pnl
  measure: ssot_ad_pnl.net_roas
aggregation: ratio
unit: ratio
grain: brand_day_channel_campaign_adset_ad
data_owner: Finance
access_policy:
