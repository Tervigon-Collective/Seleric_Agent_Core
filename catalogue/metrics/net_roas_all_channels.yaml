id: net_roas_all_channels
display_name: Net ROAS (All Channels)
category: finance
status: certified
description: >-
  Net ROAS for the business: (net sales − Net COGS) ÷ total ad spend, recomputed from period sums on
  serve.canonical_pnl — default for "ROAS", "net ROAS", "return on ad spend". Measures contribution
  earned per rupee of ads; below 1 means ads cost more than the margin they bring. Same number as
  net_roas. Not this: sales ÷ spend → mer; per campaign/ad → ad_channel_roas.
formula:
  human_readable: (net_sales_all_channels - total_operating_cost_all_channels) / total_ad_spend
  authoritative_source: cube
  depends_on:
  - net_sales_all_channels
  - total_operating_cost_all_channels
  - total_ad_spend
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.net_roas_all_channels
aggregation: ratio
unit: ratio
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  scopes:
  - metrics:read
examples:
- question: Net ROAS (All Channels) last 30 days
  request:
    measures:
    - net_roas_all_channels
    time_range:
      preset: last_30d
deprecated_aliases: []
dashboard_alignment:
  status: drift_corrected
  audited_on: '2026-07-27'
  note: Inherits Shopify commerce_performance net (~7k) and FE COGS residuals.
ratio_components:
  numerator: canonical_pnl.net_sales_all_channels_pnl
  denominator: canonical_pnl.total_ad_spend
