    <= 0) drops the free draft in the Dashboard; the mart keeps it, so consumers with the KPI rule read one order less until
    their SSOT flag is on. Amazon: Every row of the Amazon order P&L (fct_amazon_sp_order_pnl), cancelled orders included,
