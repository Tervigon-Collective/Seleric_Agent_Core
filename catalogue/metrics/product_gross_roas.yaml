id: product_gross_roas
display_name: Product gross ROAS (allocated)
category: product
status: certified
description: 'Product gross ROAS = attributed gross sales ÷ allocated ad spend. Grain: campaign_day_line. Date axis:
  cohort only. Order-date cohort only (refuses event_date). Redefined in semantic v3 (D-19o; D-27; D-06): the id
  is kept, the number may change.'
formula:
  human_readable: Product gross ROAS = attributed gross sales ÷ allocated ad spend.
  authoritative_source: cube
  depends_on:
  - product_ad_spend
cube_mapping:
  view: product_ads
  measure: product_ads.product_gross_roas
aggregation: ratio
unit: ratio
grain: campaign_day_line
data_owner: Growth / Paid Media
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
version: 2.0.0
replaces: []
date_axis: cohort_only
date_axis_refusal: 'allocated product-ad family (D-19o, D-27, D-34): use date_axis=order_date; ad spend is not an
  event of an order'
decision_ids:
- D-19o
- D-27
