id: amazon_net_profit
display_name: Net Profit (Amazon-only — Attribution)
category: commerce
status: certified
description: 'Amazon Attribution / Historical Amazon-only Net Profit: Net Sales − Total Fees − Product
  Cost − Amazon Ads spend. Matches the Amazon Attribution Overview "Net Profit" card (June 2026 brand
  20 = ₹66,586.02 after the 2026-08-03 settlement rework — Total Fees now settlement-sourced GST-free
  for settled orders, label fees removed). This is NOT marketplace_net_payout (settlement cash to seller)
  — use amazon_net_payout for payout. Scope: Amazon SP-only.

  '
formula:
  human_readable: amazon_net_sales - amazon_platform_fees - amazon product_cost - amazon_ads_spend
  authoritative_source: cube
  depends_on:
  - amazon_net_sales
  - amazon_ads_spend
cube_mapping:
  view: amazon_attribution_overview
  measure: amazon_attribution_overview.net_profit
  time_dimension: amazon_attribution_overview.report_date
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Amazon net profit for June 2026
  request:
    measures:
    - amazon_net_profit
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- June 2026 brand 20 = ₹66,586.02 (settlement-aware; was ₹59,346.00 pre-2026-08-03)
- amazon_net_profit != amazon_net_payout
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: amazonSummaryMetrics.js amazonDisplayNetProfit; AmazonSummaryCards.jsx
companion_measures:
- amazon_net_payout
