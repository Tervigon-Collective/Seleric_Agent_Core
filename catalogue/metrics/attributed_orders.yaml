id: attributed_orders
display_name: Attributed Orders
category: attribution
status: certified
description: >
  Order-grain last-touch attribution, one row per order over the FULL Shopify
  placement cohort — the SAME population as commerce Total Orders (Shopify).
  Every order carries a last-touch channel; orders with no resolved touch fold into
  unattributed (lt_platform 'unattributed' or empty-signal organic, attribution_method
  'unattributed'), exactly like
  the dashboard channel split. So attributed_orders == total_orders (Shopify) and
  per-channel (lt_platform) breakdowns reconcile to it by construction. For the
  RESOLVED subset (orders with an identified touch) use touch_attributed_orders and
  attribution_rate. This is NOT the Meta Attribution Analysis dashboard: for orders
  attributed to a Meta campaign/adset/ad (the Meta Attribution Table) use
  meta_attr_orders; for the Meta Attribution Overview "Total Orders" card use
  meta_attribution_orders (different grain/cohort — they will not tie to this).
formula:
  human_readable: COUNT(order_id)
  authoritative_source: cube
cube_mapping:
  view: order_attribution
  measure: order_attribution.attributed_orders
aggregation: additive
unit: count
grain: order (last-touch attribution)
supported_dimensions:
- brand_id
- order_date
- lt_platform
- lt_channel
- lt_utm_source
- lt_utm_medium
- lt_utm_campaign
- lt_campaign_id
