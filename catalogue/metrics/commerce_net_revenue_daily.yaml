id: commerce_net_revenue_daily
display_name: Net Sales (Shopify-only, Dashboard Parity)
category: commerce
status: certified
description: >-
  Shopify net sales for the period = gross − discounts on order date − event-date returns/cancels, ex-GST, per brand-day on serve.commerce_performance_daily (dashboard Net Sales card) (id: commerce_net_revenue_daily); formula: sum of net_sales_excl_tax from daily commerce rollup by report_date; grain: brand × day, additive; date axis: report_date (IST calendar day); scope: Shopify eligible placements, includes later cancels, excludes test orders; siblings: use net_sales_all_channels for all-channels default, for city/UTM/payment breakdowns use commerce_net_revenue, for product breakdown use product_net_revenue.
formula:
  human_readable: Sum of net_sales_excl_tax from the daily commerce performance rollup, by report_date
  authoritative_source: cube
cube_mapping:
  view: commerce_performance
  measure: commerce_performance.commerce_net_revenue
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Net sales for June 2026
  request:
    measures:
    - commerce_net_revenue_daily
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- commerce_net_revenue_daily period total reconciles exactly to the dashboard Net Sales card for the same
  brand and period
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: lineItemHistoricalSql.js:604-611
