id: product_net_revenue
display_name: Product Net Revenue (ex-GST)
category: product
status: certified
description: >-
  Net sales per product / SKU / variant — the default for "sales by product", "top products", "SKU revenue" (id: product_net_revenue); formula: sum of (net_pre_refund_excl_gst − cancelled_revenue_excl_gst − returned_revenue_excl_gst) on eligible lines on ORDER date, returns pulled back to order month; grain: order_item (line), additive; date axis: order_date; scope: line-level basis (excludes order-level shipping), total will not equal net_sales_all_channels; siblings: for brand-day totals use net_sales_all_channels, for city/UTM/payment use commerce_net_revenue, for order-grain use orders.
formula:
  human_readable: 'Sum of (net_pre_refund_excl_gst − cancelled_revenue_excl_gst − returned_revenue_excl_gst) on eligible lines

    '
  authoritative_source: cube
cube_mapping:
  view: product_performance
  measure: product_performance.net_line_revenue_ex_gst
aggregation: additive
unit: currency
currency_default: INR
grain: order_item
supported_dimensions:
- brand_id
- order_date
- product_title
- variant_title
- sku
- product_type
- vendor
- shipping_city
- shipping_region
- shipping_country
- order_status
- return_status
- payment_method
- payment_bucket
- payment_gateway
- is_cod
- is_prepaid
- is_new_customer
- product_id
- variant_id
- pnl_refund_class
- source_name
supported_filters:
- date_range
- brand_id
- product_title
- sku
- product_type
- vendor
- payment_method
- payment_bucket
- payment_gateway
- is_cod
- is_prepaid
- is_new_customer
- product_id
- variant_id
- pnl_refund_class
- source_name
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  scopes:
  - metrics:read
examples:
- question: Top products by revenue last 30 days
  request:
    measures:
    - product_net_revenue
    dimensions:
    - product_title
    time_range:
      preset: last_30d
    sort:
    - field: product_net_revenue
      direction: desc
    limit: 10
validation_tests:
- matches dashboard product-performance lifecycle revenue for closed months
- reconciles to commerce net sales within documented band
