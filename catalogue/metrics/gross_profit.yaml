id: gross_profit
display_name: Gross profit
category: finance
status: certified
description: 'Gross profit = gross sales − gross COGS − ad spend. Grain: brand_day_channel_ad. Date axis: placement
  only. date_axis=order_date (default, orders placed in the period) or event_date (outcomes on the day they happen).
  Redefined in semantic v3 (D-09a; D-03; D-01; D-02; D-02a; D-02b; D-03a; D-05…): the id is kept, the number may
  change.'
formula:
  human_readable: Gross profit = gross sales − gross COGS − ad spend.
  authoritative_source: cube
  depends_on:
  - order_pnl_gross_sales
  - gross_cogs
  - order_pnl_ad_spend
  composition:
  - metric: order_pnl_gross_sales
    sign: 1
  - metric: gross_cogs
    sign: -1
  - metric: order_pnl_ad_spend
    sign: -1
cube_mapping:
  view: finance
  measure: finance.gross_profit
aggregation: additive
unit: INR
currency_default: INR
grain: brand_day_channel_ad
data_owner: Growth / Attribution
access_policy:
  roles_allowed:
  - analyst
  - exec
  - finance
  - growth_lead
  scopes:
  - metrics:read
version: 3.0.0
replaces:
- channel_gross_profit
- pnl_gross_profit
date_axis: placement_only
date_axis_dimensions:
  order_date: finance.order_date
  event_date: finance.event_date
decision_ids:
- D-09a
- D-03
