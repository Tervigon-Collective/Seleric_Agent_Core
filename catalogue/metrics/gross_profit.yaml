id: gross_profit
display_name: Gross Profit (Shopify-only)
category: finance
status: certified
description: >-
  Net sales − Net COGS (before ad spend) for the period, per brand-day on serve.canonical_pnl (ex-GST,
  INR). Identical to contribution_margin. Note: Net COGS here already includes shipping, packaging,
  gateway and RTO, not just product cost. Not this: per product/SKU → product_gross_margin_pct; after
  ads → net_profit_all_channels.
formula:
  human_readable: commerce_net_revenue_daily - net_cogs
  authoritative_source: cube
  depends_on:
  - commerce_net_revenue_daily
  - net_cogs
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.gross_profit
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  scopes:
  - metrics:read
examples:
- question: P&L gross profit for June 2026
  request:
    measures:
    - gross_profit
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- gross_profit = net_sales - net_cogs for the same slice
deprecated_aliases: []
dashboard_alignment:
  status: drift_corrected
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: src/integrations/historicalAnalytics/analyticsClickhouse.js:543
  note: 'Dashboard summary may use a different blended path. This metric is aligned to canonical Cube
    semantic execution (`canonical_pnl.gross_profit`).

    '
companion_measures:
- net_profit
- contribution_margin
