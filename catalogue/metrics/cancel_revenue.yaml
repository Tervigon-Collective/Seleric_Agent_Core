id: cancel_revenue
display_name: Cancelled Revenue (Shopify-only, ex-GST)
category: commerce
status: certified
description: >-
  Revenue deducted by CANCELLATIONS in the period, ex-GST, on the cancel date, per brand-day on
  serve.canonical_pnl. Brand × day total only. For breakdowns by state/region/payment use
  event_cancel_revenue. Not an order count (cancelled_orders).
formula:
  human_readable: SUM(cancel_revenue_excl_tax)
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.cancel_revenue
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Cancelled revenue for June 2026
  request:
    measures:
    - cancel_revenue
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- June 2026 brand 20 ≈ ₹1,49,048.15
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: historicalAnalytics/lineItemHistoricalSql.js:279-305
