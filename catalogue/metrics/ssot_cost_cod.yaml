id: ssot_cost_cod
display_name: SSOT COD handling fee
category: finance
status: approved
description: 'Cash-on-delivery handling fee charged by the courier on COD orders. Formula: sum of COD handling fee of the
  placed lines. Date: order date (IST). GST: no GST (a cost). Shopify: Ops app costing. Since D-109 an order that carries
  this fee is COD in payment_type, so the fee sits only on COD orders. Amazon: 0. Excludes: gateway fee. Grain: brand_day_channel.
  Date axis: native (one hybrid axis, D-07). SSOT P&L view over gold.fct_ssot_pnl_daily (Shopify and Amazon, channel amazon;
  D-104).'
