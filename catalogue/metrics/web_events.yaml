id: web_events
display_name: Website Events
category: web_analytics
status: certified
description: >-
  All tracked website events per day, event type and channel on serve.web_events_daily. event_type
  values: page_view, product_view, collection_view, add_to_cart, remove_from_cart, checkout,
  checkout_step, site_search, purchase, refund, client_event, unstruct.
formula:
  human_readable: SUM(events)
  authoritative_source: cube
cube_mapping:
  view: web_events_daily
  measure: web_events_daily.events
aggregation: additive
unit: count
grain: brand × day × event type × fine channel
supported_dimensions:
- brand_id
- report_date
- event_type
- channel
supported_filters:
- date_range
- brand_id
- event_type
- channel
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Website events by type last 7 days
  request:
    measures:
    - web_events
    dimensions:
    - event_type
    time_range:
      preset: last_7_days
validation_tests:
- web_events >= 0
deprecated_aliases: []
dashboard_alignment:
  status: not_implemented
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: —
  note: No all-event-types daily rollup exists in Node-Backend.
