id: amazon_gross_sales
display_name: Gross Sales (Amazon-only — ex-GST)
category: commerce
status: certified
description: >
  Amazon SP gross sales EX-GST on non-canceled placements =
  effective_gross_revenue − revenue_tax. Matches the Amazon Attribution
  "Gross Sales" card (June 2026 brand 20 = ₹227,645.99). Cancelled orders
  excluded. Distinct from amazon_total_sales (incl-GST order_total_header).
formula:
  human_readable: SUM(coalesce(effective_gross_revenue, estimated_gross_revenue) - revenue_tax), non-canceled placements (ex-GST)
  authoritative_source: cube
cube_mapping:
  view: amazon_attribution_overview
  measure: amazon_attribution_overview.gross_sales
  time_dimension: amazon_attribution_overview.report_date
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
  - brand_id
  - report_date
supported_filters:
  - date_range
  - brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst, ops]
  scopes: [metrics:read]
validation_tests:
  - June 2026 brand 20 = ₹227,645.99
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: amazonSummaryMetrics.js amazonDisplayGrossSales
