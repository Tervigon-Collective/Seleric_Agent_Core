id: hook_rate
display_name: Hook rate
category: paid_media
status: approved
description: 'Hook rate = 3-second video views ÷ impressions (Meta). Grain: ad_day. Date axis: native. Ignores date_axis
  (its own clock, D-36).'
formula:
  human_readable: Hook rate = 3-second video views ÷ impressions (Meta).
  authoritative_source: cube
  depends_on:
  - impressions
cube_mapping:
  view: paid_media
  measure: paid_media.hook_rate
aggregation: ratio
unit: ratio
grain: ad_day
data_owner: Growth / Paid Media
access_policy:
  roles_allowed:
  - analyst
  - exec
  - growth_lead
  - ops
  scopes:
  - metrics:read
version: 1.0.0
replaces:
- meta_hook_rate
date_axis: native
valid_for:
  ad_platform:
  - meta
valid_for_reason: Meta-only measure (Google reports no such field).
