id: gross_sales_all_channels
display_name: Gross Sales (all channels, ex-GST)
category: commerce
status: certified
description: >
  All-channels Gross Sales (ex-GST): Shopify gross_sales_excl_tax plus Amazon
  ex-GST gross (effective_gross_revenue − revenue_tax, non-canceled placements —
  see amazon_gross_sales). 2026-07-27 fix: Amazon leg was incl-GST; now ex-GST,
  matching the Amazon Attribution Gross Sales card. Matches Historical Analytics
  All channels Gross Sales. For Shopify-only use gross_sales.
formula:
  human_readable: SUM(shopify gross_sales_excl_tax) + SUM(amazon effective_gross_revenue - revenue_tax), ex-GST
  authoritative_source: cube
cube_mapping:
  view: sales_all_channels
  measure: sales_all_channels.gross_sales
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
  - brand_id
  - report_date
  - channel
  - shipping_region
  - shipping_country
  - shipping_city
supported_filters:
  - date_range
  - brand_id
  - channel
  - shipping_region
  - shipping_country
  - shipping_city
data_owner: Commerce Ops
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
- question: Gross Sales (all channels, ex-GST) last 30 days
  request:
    measures:
    - gross_sales_all_channels
    time_range:
      preset: last_30d
validation_tests:
  - June 2026 brand 20 ≈ ₹41,44,768.43
  - gross_sales_all_channels >= shopify gross_sales for same slice
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: lineItemHistoricalSql.js:586
