id: product_ltv_cac_ratio
display_name: Product LTV:CAC ratio (allocated)
category: product
status: certified
description: 'Product LTV:CAC = net sales ex-GST of first-time-customer lines of the product ÷ its allocated ad
  spend (the brand LTV:CAC basis at product grain). Grain: campaign_day_line. Date axis: cohort only. Order-date
  cohort only (refuses event_date). Redefined in semantic v3 (D-19o; D-27; D-01; D-02; D-02a; D-02b; D-03; D-03a…):
  the id is kept, the number may change.'
formula:
  human_readable: Product LTV:CAC = net sales ex-GST of first-time-customer lines of the product ÷ its allocated
    ad spend (the brand LTV:CAC basis at product grain).
  authoritative_source: cube
  depends_on:
  - product_new_customers
cube_mapping:
  view: product_ads
  measure: product_ads.product_ltv_cac_ratio
aggregation: ratio
unit: ratio
grain: campaign_day_line
data_owner: Growth / Paid Media
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
version: 2.0.0
replaces: []
date_axis: cohort_only
date_axis_refusal: 'allocated product-ad family (D-19o, D-27, D-34): use date_axis=order_date; ad spend is not an
  event of an order'
