id: total_sales_all_channels
display_name: Total Sales (all channels, incl. GST)
category: commerce
status: certified
description: >
  Historical Analytics / P&L Total Sales when All channels is selected: eligible Total Sales
  (gross_revenue + total_discounts, incl. GST). Shopify is the only channel served, so this equals
  total_sales.
formula:
  human_readable: SUM(shopify total_sales)
  authoritative_source: cube
cube_mapping:
  view: sales_all_channels
  measure: sales_all_channels.total_sales
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
- channel
- shipping_region
- shipping_country
- shipping_city
- payment_method
- payment_bucket
- payment_gateway
- is_cod
- is_prepaid
supported_filters:
- date_range
- brand_id
- channel
- shipping_region
- shipping_country
- shipping_city
- payment_method
- payment_bucket
- payment_gateway
- is_cod
- is_prepaid
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Total Sales June 2026 all channels
  request:
    measures:
    - total_sales_all_channels
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- total_sales_all_channels equals total_sales for the same slice
deprecated_aliases: []
dashboard_alignment:
  status: unclear
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  note: >
    Serve layer is Shopify-only (2026-09-17), so this equals the Shopify figure. A dashboard
    All-channels card that also counts other marketplaces will not match.
