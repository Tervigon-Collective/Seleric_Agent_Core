id: google_attribution_net_sales
display_name: Google Attribution Net Sales
category: attribution
status: certified
description: >-
  Net sales from Google Ads — the default answer to "Google net sales", "net sales from Google",
  "Google channel revenue". Computed on serve.channel_pnl as gross sales − discounts on the order
  date, minus returns and cancellations of Google-attributed orders on the date they happen (the
  Google Attribution Overview "Net Sales" card). Can be negative in a short window when returns of
  earlier orders exceed new sales. Google = last-touch platform google/google-ads (Search, Shopping,
  PMax). Ex-GST, INR. Not this: for sales of orders PLACED in the window use attributed_net_revenue
  filtered lt_platform=google; per-campaign Google sales → ad_channel_net_sales with channel=google;
  Meta → meta_attribution_net_sales.
formula:
  human_readable: Google gross − discounts − event returns − event cancels
  authoritative_source: cube
cube_mapping:
  view: channel_pnl
  measure: channel_pnl.google_net_sales
aggregation: additive
unit: currency
currency_default: INR
grain: day
supported_dimensions:
- brand_id
- report_date
- channel
supported_filters:
- date_range
- brand_id
- channel
data_owner: Growth / Attribution
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Google Attribution Net Sales last 30 days
  request:
    measures:
    - google_attribution_net_sales
    time_range:
      preset: last_30d
validation_tests:
- June 2026 brand 20 ≈ ₹9,52,068.84 (dashboard)
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend
  evidence: pnlService.getAttributionChannelPnl + lineItemHistoricalSql.buildChannelMetricsSql
