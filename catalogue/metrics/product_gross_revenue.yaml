id: product_gross_revenue
display_name: Product Gross Revenue (ex-GST)
category: product
status: certified
description: >-
  Gross sales per product / SKU / variant — use for "gross sales by product", "gross revenue by variant" (id: product_gross_revenue); formula: sum of (net_pre_refund_excl_gst + discount_excl_gst) on eligible lines; grain: order_item (line), additive; date axis: order_date; scope: line-level basis before returns and cancellations; siblings: for net sales by product use product_net_revenue, for brand-day total gross use gross_sales_all_channels.
formula:
  human_readable: 'Sum of gross_line_revenue_ex_gst on eligible lines'
  authoritative_source: cube
cube_mapping:
  view: product_performance
  measure: product_performance.gross_line_revenue_ex_gst
aggregation: additive
unit: currency
currency_default: INR
grain: order_item
supported_dimensions:
- brand_id
- order_date
- product_title
- variant_title
- sku
- product_type
- vendor
- shipping_city
- shipping_region
- shipping_country
- order_status
- return_status
- payment_method
- payment_bucket
- payment_gateway
- is_cod
- is_prepaid
- is_new_customer
- product_id
- variant_id
- pnl_refund_class
- source_name
supported_filters:
- date_range
- brand_id
- product_title
- sku
- product_type
- vendor
- payment_method
- payment_bucket
- payment_gateway
- is_cod
- is_prepaid
- is_new_customer
- product_id
- variant_id
- pnl_refund_class
- source_name
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  scopes:
  - metrics:read
examples:
- question: Top products by gross revenue last 30 days
  request:
    measures:
    - product_gross_revenue
    dimensions:
    - product_title
    time_range:
      preset: last_30d
    sort:
    - field: product_gross_revenue
      direction: desc
    limit: 10
validation_tests:
- matches dashboard product-performance gross revenue
deprecated_aliases: []
dashboard_alignment:
  status: aligned
  audited_on: '2026-10-05'
  source: Seleric_Dashboard
  evidence: new_metric
  note: ''
