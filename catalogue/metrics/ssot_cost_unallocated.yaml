id: ssot_cost_unallocated
display_name: SSOT cost not split into lines
category: finance
status: approved
description: 'Cost that is in Gross COGS but not in any of the cost lines. Zero from 2026-09; before that it shows the old
  payment-fee rule. Formula: placed_cogs - (twelve cost lines). Date: order date (IST). GST: no GST (a cost). Shopify: Zero
  for dates from 2026-09-01. For older dates the COD / checkout / weight lines were not recorded and the gap shows here, not
  hidden. Amazon: 0. Grain: brand_day_channel. Date axis: native (one hybrid axis, D-07). SSOT P&L view over gold.fct_ssot_pnl_daily
  (Shopify and Amazon, channel amazon; D-104).'
formula:
  human_readable: 'Cost that is in Gross COGS but not in any of the cost lines. Zero from 2026-09; before that it shows the
