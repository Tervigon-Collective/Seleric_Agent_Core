id: ssot_discounts
display_name: SSOT discounts
category: finance
status: approved
description: 'Discount given on the orders, with GST taken out. Memo line: Product net is already after discount, and Gross
  Sales adds the discount back. Formula: sum over lines of line discount x (order total - order GST) / order total. Date:
  order date (IST). GST: ex-GST by the ORDER-level ratio (order total - order GST) / order total, the same ratio GSTR-1 uses
  (D-21, patch P4); orders with no GST keep the discount as is. Shopify: int_finance_order_lines.discount_excl_gst. Amazon:
  0 (Amazon discounts are already inside the order total). Grain: brand_day_channel. Date axis: native (one hybrid axis, D-07).
  SSOT P&L view over gold.fct_ssot_pnl_daily (Shopify and Amazon, channel amazon; D-104).'
formula:
  human_readable: 'Discount given on the orders, with GST taken out. Memo line: Product net is already after discount, and
    Gross Sales adds the discount back. Formula: sum over lines of line discount x (order total - order GST) / order total.
    Date: order date (IST). GST: ex-GST by the ORDER-level ratio (order total - order GST) / order total, the same ratio GSTR-1
    uses (D-21, patch P4); orders with no GST keep the discount as is. Shopify: int_finance_order_lines.discount_excl_gst.
    Amazon: 0 (Amazon discounts are already inside the order total).'
  authoritative_source: cube
  depends_on: []
cube_mapping:
  view: ssot_pnl
  measure: ssot_pnl.discounts
aggregation: additive
unit: INR
grain: brand_day_channel
data_owner: Finance
access_policy:
  roles_allowed:
  - analyst
  - exec
  - finance
  - growth_lead
  - ops
  scopes:
  - metrics:read
version: 1.0.0
replaces: []
date_axis: native
currency_default: INR
