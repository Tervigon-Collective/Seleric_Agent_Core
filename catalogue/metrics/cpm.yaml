id: cpm
display_name: CPM
category: paid_media
status: certified
description: 'Cost per 1,000 impressions. Grain: ad_day. Date axis: native. Ignores date_axis (its own clock, D-36).'
formula:
  human_readable: Cost per 1,000 impressions.
  authoritative_source: cube
  depends_on:
  - ad_spend
  - impressions
cube_mapping:
  view: paid_media
  measure: paid_media.cpm
aggregation: ratio
ratio_components:
  numerator: ad_spend
  denominator: impressions
  multiplier: 1000
unit: INR
currency_default: INR
grain: ad_day
data_owner: Growth / Paid Media
access_policy:
  roles_allowed:
  - analyst
  - exec
  - growth_lead
  - ops
  scopes:
  - metrics:read
version: 1.0.0
replaces:
- google_cpm
- meta_breakdown_cpm
- meta_cpm
date_axis: native
bindings:
- name: hourly
  view: paid_media_hourly
  measure: paid_media_hourly.cpm
  granularities:
  - hour
- name: breakdowns
  view: paid_media_breakdowns
  measure: paid_media_breakdowns.cpm
  dimensions:
  - breakdown_type
  - age
  - gender
  - publisher_platform
  - platform_position
  - impression_device
  - device_platform
  - country
  - region
  slice_dimension: breakdown_type
  slices:
    age:
    - age_and_gender
    gender:
    - age_and_gender
    platform_position:
    - placement
    impression_device:
    - placement
    device_platform:
    - platform_device
    publisher_platform:
    - publisher_platform
    - placement
    - platform_device
    region:
    - region
    country: []
  note: 'Meta only: Google reports no audience breakdowns, so Google delivery is not in these rows.'
