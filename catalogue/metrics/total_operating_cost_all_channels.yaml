id: total_operating_cost_all_channels
display_name: Total Operating Cost (all channels — P&L)
category: finance
status: certified
description: >
  Historical / P&L all-channels Total Operating Cost: Shopify Net COGS. Shopify is the only channel
  served, so this equals total_operating_cost / net_cogs.
formula:
  human_readable: net_cogs
  authoritative_source: cube
  depends_on:
  - net_cogs
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.total_operating_cost_all_channels
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  scopes:
  - metrics:read
examples:
- question: P&L Total Operating Cost for June 2026
  request:
    measures:
    - total_operating_cost_all_channels
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- total_operating_cost_all_channels equals net_cogs for the same slice
deprecated_aliases: []
dashboard_alignment:
  status: unclear
  audited_on: '2026-09-04'
  source: Seleric_Dashboard/Node-Backend
  evidence: infra/cube/model/cubes/serve_canonical_pnl.yml total_operating_cost_all_channels
  note: >
    Serve layer is Shopify-only (2026-09-17), so this equals the Shopify figure. A dashboard
    All-channels card that also counts other marketplaces will not match.
