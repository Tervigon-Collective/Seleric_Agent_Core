id: product_order_net_cogs
display_name: Product net cogs (P&L basis)
category: product
status: certified
description: 'Net COGS = product cost + operating cost + exchange cost, net of returns. Grain: order_line_event.
  Date axis: switchable. date_axis=order_date (default, orders placed in the period) or event_date (outcomes on
  the day they happen). Redefined in semantic v3 (D-03; D-03a; D-01; D-02; D-02a; D-02b; D-05; D-06…): the id is
  kept, the number may change. Also answers the ids: product_net_cogs, product_pnl_net_cogs.'
formula:
  human_readable: Net COGS = product cost + operating cost + exchange cost, net of returns.
  authoritative_source: cube
  depends_on:
  - product_order_product_cost
  - product_operating_cost
  - product_order_exchange_cost
  composition:
  - metric: product_order_product_cost
    sign: 1
  - metric: product_operating_cost
    sign: 1
  - metric: product_order_exchange_cost
    sign: 1
cube_mapping:
  view: product_profit
  measure: product_profit.net_cogs
aggregation: additive
unit: INR
currency_default: INR
grain: order_line_event
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
version: 2.0.0
replaces: []
date_axis: switchable
date_axis_dimensions:
  order_date: product_profit.order_date
  event_date: product_profit.event_date
decision_ids:
- D-03
- D-03a
