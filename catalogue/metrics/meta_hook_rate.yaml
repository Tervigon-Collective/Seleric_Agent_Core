id: meta_hook_rate
display_name: Meta Hook Rate
category: paid_media
status: approved
description: >
  Meta platform-delivery metric computed in the Cube/gold layer (verified 2026-09-24); not surfaced on the Node-Backend dashboard. Meta Hook Rate recomputed from
  aggregated components — never SUM/AVG of row ratios.
formula:
  human_readable: SUM(3s views) / SUM(impressions) — approved gold formula
  authoritative_source: cube
cube_mapping:
  view: meta_ad_performance
  measure: meta_ad_performance.meta_hook_rate
aggregation: ratio
unit: ratio
grain: daily ad grain (brand x account x day x campaign x adset x ad)
supported_dimensions:
- brand_id
- report_date
- ad_account_id
- campaign_id
- campaign_name
- campaign_status
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_id
- creative_type
- creative_name
- creative_cta_type
- ad_format
- adset_optimization_goal
- neurohack_tag_codes
supported_filters:
- date_range
- brand_id
- ad_account_id
- campaign_id
- campaign_name
- campaign_status
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_id
- creative_type
- creative_name
- creative_cta_type
- ad_format
- adset_optimization_goal
- neurohack_tag_codes
data_owner: Growth / Paid Media
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Meta Hook Rate last 30 days
  request:
    measures:
    - meta_hook_rate
    time_range:
      preset: last_30d
validation_tests:
- meta_hook_rate equals meta_video_3s_views / meta_impressions recomputed on any slice
ratio_components:
  numerator: meta_ad_performance.meta_video_3s_views
  denominator: meta_ad_performance.meta_impressions
companion_measures:
- meta_impressions
dashboard_alignment:
  status: platform_only
  audited_on: '2026-09-24'
  source: Seleric_Dashboard/Node-Backend
  note: >
    Not computed on the Node-Backend dashboard, but the numerator
    (meta_video_3s_views) IS present in gold.fct_meta_ads_daily and the Cube
    measure verifies live (0.189 = 374,911 3s-views / 1,983,144 impressions,
    brand 20, last 30d, 2026-09-24). Platform-delivery metric; certified as
    approved (queryable) on that basis, not dashboard parity.
