id: meta_net_profit
display_name: Meta Net Profit
category: attribution
status: certified
description: >-
  Profit from Meta ads after product costs and Meta spend — the answer to "is Meta profitable", "Meta
  net profit". = Meta net sales (meta_attribution_net_sales) − Meta net COGS (meta_net_cogs) − Meta ad
  spend, all from serve.channel_pnl (Meta Overview "Net Profit" card). Ex-GST, INR; can be negative.
  Not this: per-campaign/adset/ad profit → ad_channel_net_profit with channel=meta; whole-business
  profit → net_profit_all_channels.
formula:
  human_readable: meta_attribution_net_sales - meta_net_cogs - meta_spend
  authoritative_source: cube
  depends_on:
  - meta_attribution_net_sales
  - meta_net_cogs
  - meta_spend
cube_mapping:
  view: channel_pnl
  measure: channel_pnl.meta_net_profit
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Growth / Attribution
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  scopes:
  - metrics:read
examples:
- question: Meta Net Profit last 30 days
  request:
    measures:
    - meta_net_profit
    time_range:
      preset: last_30d
validation_tests: []
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend getAttributionChannelPnl
