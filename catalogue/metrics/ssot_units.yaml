  of the placed lines (gift cards out); zero-value reship drafts count 0, like Orders. Amazon: Ordered units of the order
  (cancelled Amazon orders carry 0). Excludes: gift cards, zero-value reship drafts. Grain: brand_day_channel. Date axis:
  native (one hybrid axis, D-07). SSOT P&L view over gold.fct_ssot_pnl_daily (Shopify and Amazon, channel amazon; D-104).'
