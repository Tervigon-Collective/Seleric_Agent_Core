id: pdp_engaged_rate
display_name: PDP engaged rate
category: web_analytics
status: approved
description: 'Engaged page views / all page views. A lower bound - page views that left before the first checkpoint count
  as not engaged unless they interacted. Grain: page_view. Measured from 2026-10-26 18:19 UTC; bots excluded. Not certified.'
formula:
  human_readable: Engaged page views / all page views. A lower bound - page views that left before the first checkpoint count
    as not engaged unless they interacted.
  authoritative_source: cube
  depends_on:
  - pdp_engaged_page_views
  - pdp_page_views
cube_mapping:
  view: pdp_visits
  measure: pdp_visits.pdp_engaged_rate
aggregation: ratio
ratio_components:
  numerator: pdp_engaged_page_views
  denominator: pdp_page_views
unit: ratio
grain: page_view
data_owner: Growth / Web Analytics
access_policy:
  roles_allowed:
  - analyst
  - exec
  - growth_lead
  - ops
  scopes:
  - metrics:read
version: 1.0.0
replaces: []
date_axis: native
direction_bad: down
