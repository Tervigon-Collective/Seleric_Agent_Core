id: aov
display_name: Average Order Value (Shopify-only)
category: commerce
status: certified
description: 'Shopify Average Order Value at commerce order grain: Total Sales (incl. GST) ÷ placement
  orders — matches dashboard "Average Order Value" / storeMetrics.

  '
formula:
  human_readable: total_sales / orders
  authoritative_source: cube
  depends_on:
  - total_sales
  - orders
cube_mapping:
  view: commerce_orders
  measure: commerce_orders.aov
  measure_pct: null
aggregation: ratio
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- order_date
- shipping_region
- shipping_country
- shipping_city
supported_filters:
- date_range
- brand_id
- shipping_region
- shipping_country
- shipping_city
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: AOV by shipping region this quarter
  request:
    measures:
    - aov
    dimensions:
    - shipping_region
    time_range:
      preset: last_90d
validation_tests:
- aov > 0 for any slice with orders
- aov equals total_sales_incl_tax ÷ orders for the same slice
deprecated_aliases:
- daily_pnl.avg_order_value
dashboard_alignment:
  status: MATCH
  audited_on: '2026-09-04'
  source: Seleric_Dashboard/fe-dashboard
  evidence: src/lib/metrics/dashboardMetricDefinitions.js Average Order Value; storeMetrics.js totalSales/orders
  note: 'Cube commerce_orders.aov already uses total_sales_incl_tax / orders. Distinct from Attribution
    card AOV (Gross Sales ÷ Orders) and True AOV.

    '
ratio_components:
  numerator: commerce_orders.total_sales
  denominator: commerce_orders.orders
