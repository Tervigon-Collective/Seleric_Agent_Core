id: meta_net_cogs
display_name: Meta Net COGS
category: attribution
status: certified
description: >-
  Cost of goods for Meta-attributed orders (product + shipping + packaging + payment-gateway fees +
  RTO), from serve.channel_pnl. Placement costs land on the order date; return/cancel cost adjustments
  land on their event date — the Meta Overview "Net COGS" card. Ex-GST, INR. Use as the COGS leg of
  Meta profitability; Meta Net Profit = meta_attribution_net_sales − meta_net_cogs − Meta ad spend
  (meta_net_profit). Not SKU-level product_cogs.
formula:
  human_readable: SUM(meta channel product + ship + pack + gateway + rto)
  authoritative_source: cube
cube_mapping:
  view: channel_pnl
  measure: channel_pnl.meta_net_cogs
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Growth / Attribution
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst]
  scopes: [metrics:read]
examples:
- question: Meta Net COGS last 30 days
  request:
    measures:
    - meta_net_cogs
    time_range:
      preset: last_30d
validation_tests: []
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-27'
  source: Seleric_Dashboard/Node-Backend getAttributionChannelPnl
