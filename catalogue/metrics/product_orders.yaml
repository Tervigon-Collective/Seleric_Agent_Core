id: product_orders
display_name: Orders with the product
category: product
status: certified
description: 'Orders containing the product / variant (distinct root orders with a sold line). Summed over products
  this exceeds the order count (D-34). Grain: order_line_event. Date axis: placement only. date_axis=order_date
  (default, orders placed in the period) or event_date (outcomes on the day they happen). Redefined in semantic
  v3 (D-01; D-08; D-02b; D-03; D-03a; D-05; D-08a; D-09a…): the id is kept, the number may change. Also answers
  the ids: product_order_orders.'
formula:
  human_readable: Orders containing the product / variant (distinct root orders with a sold line). Summed over products
    this exceeds the order count (D-34).
  authoritative_source: cube
  depends_on: []
cube_mapping:
  view: product_profit
  measure: product_profit.product_orders
aggregation: additive
unit: count
grain: order_line_event
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - analyst
  - exec
  - finance
  - growth_lead
  scopes:
  - metrics:read
version: 2.0.0
replaces: []
date_axis: placement_only
date_axis_dimensions:
  order_date: product_profit.order_date
  event_date: product_profit.event_date
decision_ids:
- D-01
- D-08
