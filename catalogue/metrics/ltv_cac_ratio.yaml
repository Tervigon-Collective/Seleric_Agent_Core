id: ltv_cac_ratio
display_name: LTV:CAC
category: finance
status: certified
description: 'Historical Analytics LTV:CAC for first-time attributed customers in the period. "LTV" here
  is new-customer first-order AOV = new_customer_revenue / new_customers; CAC = total_ad_spend / new_customers;
  ratio = LTV / CAC. Matches getNewCustomerMetrics + Meta+Google+Amazon spend. new_customer_revenue uses
  fct_order_attribution.net_revenue_excl_tax (dashboard net sales: cancelled/voided → 0; paid → net ex-GST;
  unpaid COD → gross_excl − discounts) — same basis as attributed_net_revenue for is_new_customer=1.

  '
formula:
  human_readable: ltv / cac
  authoritative_source: cube
  depends_on:
  - ltv
  - cac
cube_mapping:
  view: ltv_cac
  measure: ltv_cac.ltv_cac_ratio
aggregation: ratio
unit: ratio
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Growth / Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  scopes:
  - metrics:read
examples:
- question: LTV:CAC for June 2026
  request:
    measures:
    - ltv_cac_ratio
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests: []
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-31'
  source: Seleric_Dashboard/Node-Backend
  evidence: historicalAnalytics/analyticsClickhouse.js getNewCustomerMetrics + fe performanceSummary.js
ratio_components:
  numerator: ltv_cac.ltv
  denominator: ltv_cac.cac
