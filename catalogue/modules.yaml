modules:
  webanalytics:
    display_name: Funnel Analytics
    description: On-site session funnel, web events, and funnel-stage rates.
    extra_views:
    - web_sessions
    - web_funnel
    - web_events
    - web_event_detail
    - funnel_orders
  commerce:
    display_name: Commerce Rollup
    description: Orders, sales, and refunds/returns across all channels.
    extra_views:
    - commerce
    - returns
    - payments
  product:
    display_name: Product Performance
    description: Per-product units, revenue, COGS, and margin.
    extra_views:
    - product_profit
    - product_ads
  paidmedia:
    display_name: Paid Media Delivery
    description: Meta / Google ad delivery metrics (spend, CTR, CPC, CPM).
    extra_views:
    - paid_media
    - paid_media_hourly
    - paid_media_breakdowns
    - paid_media_changes
    - finance
  attribution:
    display_name: Attribution
    description: 'Last-touch, first-party attributed orders and revenue across all channels (Meta / Google / Organic).
      Filter by lt_platform for a channel view.

      '
    extra_views:
    - attribution
    - attribution_paths
    - commerce
  customer:
    display_name: Customer Intelligence
    description: Customer LTV, repeat behaviour, and purchase sequences.
    extra_views:
    - customers
    - commerce
    - finance
  finance:
    display_name: Finance / P&L
    description: Canonical daily P&L — spend, COGS, contribution, net profit, MER.
    extra_views:
    - finance
    - product_profit
  operations:
    display_name: Returns & Refunds
    description: Shopify refund events and return lifecycle.
    extra_views:
    - returns
    - payments
    - stock_movements
    - stock_levels
    - stock_layers
    - stock_sync_errors
    - purchase_orders
    - purchase_order_lines
    - quality_checks
    - vendors
    - procurement_sampling
