register: Semantic v3 known limits — what the data or the model cannot do (yet), its impact, and what happens next
source_of_truth: this file; rendered into KNOWN_LIMITS.md and the plan by scripts/render_semantic_v3_docs.py
status_values:
  accepted: owner-accepted limit, shown to users (coverage flags / labels)
  open: needs a fix or an owner decision — next_step says which
  planned: removed in the named phase
limits:
- id: L-01
  area: Attribution
  limit: Multi-touch attribution (last_non_direct, first_touch, linear, journey last-touch) exists only from 2026-06-01; ~8 % of later orders lack it too.
  impact: 16,484 pre-June sale orders (₹2.87 Cr gross) + 811 since (₹17.5L) use the last-touch fallback under the default model; other models show no_model_data.
  affects: campaign / ad / channel revenue, ROAS, CAC by model
  handled_by: [D-06a]
  status: accepted
  next_step: rows carry model_used; Agent shows coverage % with every model answer (Phase 6)
- id: L-02
  area: Attribution
  limit: Google website sessions often lack campaign (29 %) and ad (88 %) ids; 45 % of credited Google touches have no campaign.
  impact: 792 Google orders (₹17.8L) + 279 Meta (₹5.6L) credited to a session without campaign; 328 filled from last-touch, the rest sit in `campaign unknown`.
  affects: Google campaign / ad ROAS and LPV
  handled_by: [D-06b, D-17]
  status: accepted
  next_step: tracking fix upstream (gclid → campaign mapping) would shrink `campaign unknown`
- id: L-03
  area: Ads
  limit: Google Performance Max (74 % of Google spend) has no ad group / ad level.
  impact: PMax drill stops at campaign (+ device / network); synthetic pmax / pmax_* / camp_* ids are NULL.
  affects: Google ad-level questions
  handled_by: [D-14]
  status: accepted
  next_step: none — platform limitation
- id: L-04
  area: Ads
  limit: Hourly delivery exists only from 2026-04-01 for Meta and 2024-11-15 for Google; Google hourly has no ad group / ad level.
  impact: hourly answers before those dates are unavailable (not zero).
  affects: hour-of-day analysis
  handled_by: []
  status: accepted
  next_step: Cube v3 refuses hourly queries before coverage starts (Phase 5)
- id: L-05
  area: Ads
  limit: Meta reach is only valid per ad-day; it cannot be summed across ads or days, and frequency cannot be averaged.
  impact: no brand / campaign reach totals.
  affects: reach / frequency questions
  handled_by: []
  status: accepted
  next_step: expose reach only at native grain (reach_native)
- id: L-06
  area: Ads
  limit: Platform-reported conversions (Meta purchases / value, Google conversions) are hidden; website purchase value is a tracking-quality metric only.
  impact: platform ROAS is not available as a business metric.
  affects: ROAS comparisons with Ads Manager
  handled_by: [D-00, D-13, D-13r, D-09]
  status: accepted
  next_step: none
- id: L-07
  area: Costs
  limit: COD handling, checkout fee and weight discrepancy were never recorded before 2026-09.
  impact: legacy-era variable cost is understated by those three components (shown as cost_method not_recorded, never estimated).
  affects: contribution / margin before 2026-09, cross-era comparisons
  handled_by: [D-11a]
  status: accepted
  next_step: none unless a historical rate card appears
- id: L-08
  area: Costs
  limit: Legacy shipping, packaging, gateway and RTO costs are per-unit rate-card estimates, not courier / gateway invoices.
  impact: cost_method rate_card / estimated_backfill; legacy RTO reverse shipping back-filled (₹2.75L).
  affects: cost accuracy before 2026-09
  handled_by: [D-11, D-11c]
  status: accepted
  next_step: invoice-based costs would be a new cost source
- id: L-09
  area: Costs
  limit: Product cost is missing on 247 brand-20 lines (0.8 %); 410 lines since 2026-09 are provisional (one lump estimated_ops_cost).
  impact: shown as cost_status missing / provisional, never zero.
  affects: COGS, gross profit, contribution
  handled_by: [D-03]
  status: accepted
  next_step: cost data owner fills product cost; provisional rows finalise upstream
- id: L-10
  area: Orders
  limit: 68 sale orders (₹96k) have conflicting or no outcome evidence (Unknown).
  impact: booked as cancelled in the ledger; outcome stays `unknown` and visible.
  affects: cancel / RTO / return rates
  handled_by: [D-22, D-22h]
  status: accepted
  next_step: none
- id: L-11
  area: Orders
  limit: Delivery and RTO evidence depends on the era — bare RTO tag (Dec 2024 – Nov 2025), no tagging (Jan – Jun 2026), Logisy tags (Jul 2026 on); courier status is mostly empty on older returns.
  impact: outcomes for those eras follow owner rulings on evidence patterns, not direct proof.
  affects: RTO vs return vs cancel split before 2026-07
  handled_by: [D-22a, D-22b, D-22c, D-22d, D-22e]
  status: accepted
  next_step: none
- id: L-12
  area: Revenue
  limit: Gold's order header treats shipping as tax-free; v3 taxes shipping at the principal line rate (composite supply).
  impact: ex-GST view differs from gold's header by ₹23k (= shipping GST); incl-GST ties to the paisa.
  affects: comparisons with gold / v2 headers
  handled_by: [D-25, D-10]
  status: accepted
  next_step: none
- id: L-13
  area: Revenue
  limit: Exchange price adjustment is a value difference; same-value exchanges show ₹134 average noise from discounts.
  impact: small residual on same-value exchanges.
  affects: exchange price adjustment
  handled_by: [D-01a]
  status: accepted
  next_step: none
- id: L-14
  area: Revenue
  limit: No operating-expense source in the warehouse.
  impact: top figure is contribution after ads; `net_profit` ids mean contribution after ads (opex excluded).
  affects: net profit questions
  handled_by: [D-18, D-18r]
  status: accepted
  next_step: add an opex source to enable true net profit
- id: L-15
  area: Scope
  limit: Amazon (marketplace + Amazon Ads) is out of scope; brand overview = D2C Shopify only.
  impact: brand 20 Amazon sales and spend are not in any total.
  affects: brand overview
  handled_by: [D-04]
  status: accepted
  next_step: separate project
- id: L-16
  area: Scope
  limit: Brand 28 is spend-only (no commerce); brands 24–27 have 1–32 orders.
  impact: profit / ROAS / AOV are refused for brand 28 (v2 computes −spend, F0-3; refusal built in Cube v3, 18/18 refusal checks). Brands 24–27 are answered like any brand with no flag; v3 is certified on brand 20 only.
  affects: those brands
  handled_by: [D-44]
  status: accepted
  next_step: 'none — owner 2026-10-16: no action on other brands, only brand 20 data (D-44); Q11 (brand 28 value → refusal) is confirmed at the Phase 7 variance sign-off'
- id: L-17
  area: Reconciliation
  limit: v2's cost total (order_pnl_daily.net_cogs) is ₹17–18L below gold's posted line costs; that v2-internal composition is not decomposed by cause.
  impact: the v2 → v3 contribution change (−₹16.9L all history) is only partly itemised (gold → v3 is fully proven).
  affects: variance sign-off
  handled_by: []
  status: open
  next_step: decompose v2 cost composition for the Phase 7 variance report
- id: L-18
  area: Freshness
  limit: v3 semantic tables refresh every 5 minutes while gold reloads continuously (CDC).
  impact: up to ~5 min lag; live checks exclude orders gold changed after the last refresh and report them as pending.
  affects: near-real-time questions, live reconciliation
  handled_by: []
  status: accepted
  next_step: none
- id: L-19
  area: Data quality
  limit: 12 gold payments belong to orders missing from gold.fct_orders.
  impact: excluded from serve.fct_payment.
  affects: payment totals (tiny)
  handled_by: []
  status: open
  next_step: upstream (dbt) investigation
- id: L-20
  area: Web
  limit: Checkout-timing session metrics (seconds to checkout / purchase, checkout steps) are structurally empty — Shopify checkout events are server-side without a session id.
  impact: those metrics stay unavailable (data-quality waiver).
  affects: funnel timing questions
  handled_by: []
  status: open
  next_step: dbt fix (plumb cart journey checkout time into sessions)
- id: L-21
  area: Operations
  limit: system.query_log keeps 7 days.
  impact: the "14 days of zero reads" rule before dropping old views cannot run as written.
  affects: Phase 9 cleanup
  handled_by: []
  status: open
  next_step: owner chooses longer TTL or two 7-day checks (Q8)
- id: L-22
  area: Operations
  limit: Live v2 defects — 4 tax metrics and customers × first-order product fail in Cube v2 today.
  impact: those Agent answers error until the v3 cutover.
  affects: Agent today
  handled_by: [D-26]
  status: planned
  next_step: delivered by v3 (Phase 5–8)
- id: L-23
  area: Model
  limit: Event-date P&L, monthly close / as-of snapshots, allocated product-ad metrics and period profit were not built.
  impact: resolved in Phase 4 — serve.mart_period_profit, mart_pnl_event, mart_product_ad_allocated and the closed views exist.
  affects: pnl_* family, closed months, product ad metrics
  handled_by: [D-07, D-12, D-19o, D-21]
  status: accepted
  next_step: Cube v3 wires them in Phase 5
- id: L-24
  area: 'Marts'
  limit: 'The event-date family (pnl_*) dates cancels / RTO / returns by the v3 ledger event date; v2 pnl_daily used another gold fact plus an undated reconciliation plug row.'
  impact: 'per month, v3 − v2 net profit = cohort leg (bridged, with causes) + an event-dating leg between the two builds (brand 20, after the D-30 restock-credit rule: Jul −2.81L, Aug +0.11L, Sep +3.84L; it nets to 0 over all history). Owner accepted v3 dating (D-21b); the figures are in doc/semantic_v3/VARIANCE_REPORT.md §3.'
  affects: 'month-by-month pnl_* comparisons with v2'
  handled_by: [D-21, D-21a, D-21b]
  status: accepted
  next_step: 'month-by-month differences are in the Phase 7 variance report (done 2026-10-16); owner sign-off at the checkpoint'
- id: L-25
  area: 'Marts'
  limit: 'Period profit and the event-date family use the default attribution model only (last_non_direct, credit 1 per order).'
  impact: 'campaign / ad profit under first_touch, linear or last_touch is not offered; those models stay in serve.bridge_order_attribution for attribution questions.'
  affects: 'model comparison on profit'
  handled_by: [D-06]
  status: accepted
  next_step: 'none — fractional credits would break the exact roll-up (FIN-07); no v2 capability did this'
- id: L-26
  area: 'Allocated family'
  limit: 'Spend is allocated only within a campaign-day that has a credited sale line with sales; the rest is an `Unallocated` row. Sale lines with no allocated row sit on `Organic` rows and the order''s own postings on `Order level` rows (P&L only, no delivery, D-38), so product totals tie to the brand.'
  impact: 'Sep 2026 brand 20: ₹7.86L allocated, ₹4.08L unallocated of ₹11.93L. Free-gift lines (zero sales) get no share. Website LPV of sessions without a campaign id stays out of the allocation.'
  affects: 'product_* spend, ROAS, MER, CAC, delivery metrics (explicit family only)'
  handled_by: [D-19o, D-27, D-27b]
  status: accepted
  next_step: 'none — owner chose the same-day rule (D-27); never used in default answers'
- id: L-27
  area: 'Monthly close'
  limit: 'Only August 2026 is locked (2026-10-16, D-43); the close script has no schedule.'
  impact: 'every month before and after August is labelled `reconstructed` or open; `serve.mart_*_closed` holds August only.'
  affects: 'closed-month reproducibility'
  handled_by: [D-12, D-12b]
  status: open
  next_step: 'owner decides the recurring schedule: close_month.py is on the semantic-v3 branch only (cron checkouts run main), and a run on the 1st would lock the previous month while it is still `maturing` (45 days, D-12a) — decide close on the 1st (restatable) or after maturity; install at cutover'
- id: L-28
  area: 'Schema'
  limit: 'apply_v3.py never ALTERs and tables are CREATE IF NOT EXISTS, so a column added to an applied v3 table does not land by itself.'
  impact: 'a new column in mart_profit_fact needs a reviewed manual ALTER of the table (and of snap_profit_monthly); close_month.py refuses on drift and inserts by explicit column list.'
  affects: 'Phase 5 additions to the marts or the snapshot'
  handled_by: []
  status: accepted
  next_step: 'decide with the owner whether apply_v3 may run ADD COLUMN IF NOT EXISTS before the first Cube v3 column request'
- id: L-29
  area: 'Dates'
  limit: 'No courier / shipment timestamp exists in gold, so there is no physical RTO or delivery date.'
  impact: 'an RTO is dated by Shopify''s cancellation or return-event date (3,187 brand 20 RTO lines, ₹52.4L; 92 reversal, 2,880 cancellation, 169 return-event dates). The event axis dates the decision to cancel / book the return, not the day the parcel came back.'
  affects: 'event_date of every RTO amount; RTO lag statistics (median 19 days, max 518)'
  handled_by: [D-29]
  status: accepted
  next_step: 'a courier / shipment event source would give a physical RTO date; until then event_date_source shows which Shopify column supplied the date'
- id: L-30
  area: 'Dates'
  limit: 'Some cancelled / RTO / returned lines have no outcome timestamp at all.'
  impact: 'Live 2026-10-15, brand 20: 52 orders / 84 lines / 257 ledger rows, revenue deduction −₹81,680 (planning count 2026-10-14: 50 lines ₹77k + 2 refund-date-only lines ₹1.9k; the member grows when a new RTO tag arrives before Shopify dates it). 226 of the 257 rows (41 orders, −₹71.4k) are ACTIVE orders with an RTO tag and no cancel / return date (31 orders Aug–Oct 2026, 21 from 2025); 4 are returns with no evidence (−₹8.1k). They are Undated on the event axis, with their derived cost and credit rows; they stay in every reconciliation. Owner confirmed keeping them Undated (2026-10-15).'
  affects: 'event-axis period totals (dated only); Undated member'
  handled_by: [D-29, D-32]
  status: accepted
  next_step: 'the Undated member is shown on every event_date answer; shrinks if gold / upstream backfills the outcome date'
- id: L-31
  area: 'Dates'
  limit: 'Cohort-defined rates have no event-axis meaning.'
  impact: 'return rate, cancel rate, RTO rate, repeat rate, LTV, net AOV and LTV:CAC ratio (the last two owner-confirmed 2026-10-15 by the D-31 principle) are refused on event_date (pointer to order_date); net ROAS, MER, BE ROAS and margin % are allowed with a label and NULL when event-axis net sales ≤ 0 (Sep 2026: event net sales ₹4.21L vs cohort ₹15.7L).'
  affects: 'event_date answers for ratios'
  handled_by: [D-31]
  status: accepted
  next_step: 'none — by design'
- id: L-32
  area: 'Schema'
  limit: 'event_date is a non-nullable Date inside the sort key of semantic.mart_profit_fact and semantic.snap_profit_monthly, and neither table has event_date_source.'
  impact: 'Resolved by the rebuild. Was: Undated (NULL event_date) and event_date_source cannot land by ALTER alone: the tables must be rebuilt (new table version) or carry an is_undated flag with a sentinel date; extends L-28. Every apply is an owner-confirmed production write.'
  affects: 'Phase 4.5 build of mart_profit_fact, snap_profit_monthly, close_month.py (explicit column list)'
  handled_by: [D-29, D-32]
  status: accepted
  next_step: 'Resolved 2026-10-14: owner chose rebuild (Q12); ledger_order_component_v2, mart_profit_fact_v2 and snap_profit_monthly_v2 applied with Nullable event_date + event_date_source. The old tables stay for rollback until Phase 9 (retire the _v2 names then).'
- id: L-33
  area: 'Web'
  limit: 'Snowplow add_to_cart fires twice per add (two events, different event_id, one client_event_id, within 2 s).'
  impact: 'Sep 2026, Meta-tagged sessions, brand 20: 4,035 events but 2,148 distinct client_event_id (1,876 pairs, 1,847 within 2 s), 1,831 session x variant, 1,489 sessions. Before the serve fix event counts of add_to_cart were about 1.9x the real add actions; session counts were never affected. Meta reports 769, so the double-firing does not explain the Meta gap. remove_from_cart events (502 in 164 sessions) carry no variant id and cannot be netted per item. client_event_id as the deduplication key is an inference.'
  affects: 'event_add_to_carts and any add-to-cart event count; add-to-cart rates built on events'
  handled_by: [D-13]
  status: accepted
  next_step: 'Applied 2026-10-16 (owner OK): serve.fct_web_event drops the second add_to_cart of a pair (same session / variant / quantity within 2 s; Sep 2026 all traffic 3,977 kept vs 3,959 distinct client_event_id; Meta sessions 2,159 vs 2,148); contract WEB-ATC-DEDUP. The real fix is upstream (tracker fires twice; gold.fct_web_events should carry client_event_id): dbt / storefront owner.'
- id: L-34
  area: 'Reconciliation'
  limit: 'Meta-reported purchases (679, Sep 2026) exceed Shopify sale orders credited to Meta paid (587).'
  impact: 'Reconciles to 2 % with exchange replacement orders of Meta-credited originals (78 -> 665; D-01: replacements are not sales, Meta counts them). A 7-day any-touch window gives 555 orders (1 d: 547, 28 d: 562), so the window is not the cause; the rest (about 46 with a 7-day window plus all replacements) is view-through / cross-device that leaves no visit on the site. Jun-Aug 2026 Meta claimed about as many purchases as all Shopify orders (ratio 1.6-2.1); the ratio fell to about 1.1 from 1 Sep 2026. The Meta attribution window / setting is not stored (ingest uses use_unified_attribution_setting=true) and has not been checked.'
  affects: 'any platform-vs-first-party purchase comparison; Phase 7 variance report'
  handled_by: [D-00, D-13, D-01, D-06]
  status: open
  next_step: 'Checked 2026-10-16 from the stored per-row attribution_setting (Pipe Board / Ads Manager history not reachable): the setting mix did NOT change on 1 Sep (about 70 % of spend 1d_view_7d_click, 25 % 7d_click); days are loaded once at D+7. Meta purchases per 1,000 INR of spend fell 1.41 (Aug) -> 0.79 (Sep) while our Meta-credited orders per 1,000 INR stayed 0.69, so the drop is on the Meta side (measurement: pixel / Conversions API matching, modelled conversions), not our window. Owner: check Events Manager diagnostics for September.'
- id: L-35
  area: 'Orders'
  limit: 'Payment method / gateway is the literal text `manual` on most orders since the Sep 2026 checkout change.'
  impact: 'brand 20 Sep 2026: 864 of 931 sale orders are bucket `manual`; only 51 COD + 13 online are classified, so COD vs prepaid shares are understated for that period. The `manual` member is unclassified, not a payment type; slices by payment_bucket / payment_method / payment_gateway / is_cod say so (a planner warning). The cod_orders / prepaid_orders totals are not flagged.'
  affects: 'payment-mix answers, cod_orders / prepaid_orders, payment_bucket slices from Sep 2026'
  handled_by: [D-41]
  status: accepted
  next_step: 'upstream: checkout-app / dbt owner to emit the real gateway or method; v3 changes nothing until then'
