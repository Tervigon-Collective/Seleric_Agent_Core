- id: D-01
  title: Exchange treatment
  status: implemented
  phase: 1
  decided: '2026-10-14'
  ruling: 'DECIDED 2026-10-14: Continuation + separate exchange lifecycle. Original order is the only commercial sale (keeps order date,
    customer, attribution). Replacement = linked fulfilment child: no order count, no sales revenue. Price-difference charges/refunds
    adjust the original order cohort. Exchange COGS, inventory recovery, shipping and handling are separate economic components. Non-cash
    exchange credits are internal transfers — not cash refunds, not sales deductions. Exchanged items never enter ordinary return metrics.
    All exchange components reconcile to the original order''s line economics and the canonical P&L.'
  options: (a) replacement = continuation of original sale (no new order, no new revenue; price difference only) (b) replacement = new
    order/sale (today)
  evidence: 'F-07–F-10: 498 replacement orders, ₹8.39L counted as sales; ~390 originals counted as returns; ₹7.14L non-cash "refunds"'
  implemented_in:
  - mage-ai:serve/semantic_v3/views/01_core_order_class.sql (order_type exchange_replacement, parent/root chain)
  - mage-ai:serve/semantic_v3/views/03_ledger_order_component.sql (exchange family; no revenue on replacements)
  - mage-ai:serve/core/views/fct_order.sql (is_sale_order, root_order_id)
  evidence_codes:
  - exchange_replacement_linked
  tests:
  - FIN-14
  - EXCH-ROOT
  - LEDGER-NO-REVENUE-NONSALE
  - 'bridge: D-01 replacement not a sale / exchanged item is not a return'
  change_how: 'edit the rule in implemented_in (search for the decision id), then: apply_v3.py --check; v3_contracts.py --preview --inline
    <changed objects>; v3_reconcile_gold.py --preview --inline <changed objects>; owner OK; apply_v3.py --apply <objects>; update this
    entry + spec §0B row'
