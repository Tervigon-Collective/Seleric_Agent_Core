- id: D-05
  title: Cancel vs RTO vs return as separate concepts
  status: implemented
  phase: 2
  decided: '2026-10-14'
  ruling: 'DECIDED 2026-10-14: Three concepts. *Cancelled* (before dispatch: no fulfilment cost), *RTO* (shipped, not delivered: forward
    + reverse shipping, no revenue, stock recovered), *Customer return* (delivered then returned: revenue reversed, reverse shipping,
    restock). Each has its own rate and cost components, all on the original order date. Exchanges (D-01) are a fourth, separate lifecycle.
    Refined by D-22 (four evidence-based outcomes incl. Unknown).'
  options: three classes with own costs vs today's two
  evidence: 'F-11: ≥643 shipped "cancellations"'
  implemented_in:
  - mage-ai:serve/semantic_v3/views/03_ledger_order_component.sql (no_fulfilment on cancelled lines)
  tests:
  - LINE packaging_D05 / fwd_shipping_D05
  - 'cost bridge: D-05'
  change_how: 'edit the rule in implemented_in (search for the decision id), then: apply_v3.py --check; v3_contracts.py --preview --inline
