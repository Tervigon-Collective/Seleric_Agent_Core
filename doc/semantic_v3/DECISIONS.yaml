  decided: '2026-10-14'
  ruling: 'DECIDED 2026-10-14: owner: "all Actives means actually delivered" → net sales = delivered. D-02a DECIDED 2026-10-14: an ACTIVE
    line (not cancelled / RTO / returned) is treated as delivered; missing delivery flags are considered incomplete tracking. Net sales
    = ACTIVE lines as of cutoff. (Recent in-transit ACTIVE ≈ ₹2.2L will therefore count as sales and move to RTO/return if they fail.)'
  options: booked at order (minus cancels/returns as-of) vs delivery-recognised (realised)
  evidence: 'F-14: ₹22.2L ACTIVE not yet delivered; of which ₹21.5L (1,226 lines, 90% COD) are >45 days old and still lack delivery
