- id: D-07
  title: Ad cost allocation to orders/products
  status: implemented
  phase: 4
  decided: '2026-10-14'
  ruling: 'DECIDED 2026-10-14: Period match, no allocation. Period profit = contribution of orders placed in the period − ad spend delivered
    in the period. Campaign drill = attributed contribution (default model D-06) − that campaign''s spend; *Unattributed/organic* contribution
    and *spend without attributed orders* are explicit rows so Σ campaigns + unattributed = brand total exactly. Product/line profit
    stops before ad spend unless explicitly requested. No spend-to-order allocation ledger in this rebuild. Default unchanged; the explicit
    `allocated` product family (D-19o) is the only allocation and never feeds default/overview answers.'
  options: none (spend stays at ad level, revenue credited) vs allocate by attribution credit
  evidence: §6.5
  implemented_in:
  - mage-ai:serve/semantic_v3/views/05_mart_profit_fact.sql (D-07, delivery-date spend, no allocation)
  - mage-ai:serve/core/views/mart_period_profit.sql (D-07)
  tests:
