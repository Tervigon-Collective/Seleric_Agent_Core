- id: D-03
  title: COGS definition and return recovery
  status: implemented
  phase: 2
  decided: '2026-10-14'
  ruling: 'DECIDED 2026-10-14: Split layers. COGS = product (landed purchase) cost only. Packaging, forward/reverse shipping, gateway,
    COD handling, RTO, checkout fee, weight discrepancy = separate *fulfilment & payment cost* components. Gross profit = net sales
    − product COGS; contribution = gross profit − fulfilment & payment costs − ad spend. Restock-credit policy: see D-03a'
  options: pure product COGS vs landed (product+packaging+shipping+gateway); restocked returns credit product cost back or not
  evidence: F-15, F-20
  implemented_in:
  - mage-ai:serve/semantic_v3/views/03_ledger_order_component.sql (product_cost vs fulfilment_cost families)
  tests:
