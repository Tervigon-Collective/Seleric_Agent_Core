id: ltv
display_name: LTV
one_liner: Lifetime value; new-customer first-order AOV unless lifetime is asked.
aliases: [ltv, lifetime value, customer lifetime value]
axes:
  horizon: {values: [first_order, lifetime], default: first_order}
resolves:
  - when: {horizon: first_order}
    metric: ltv
  - when: {horizon: lifetime}
    metric: avg_ltv
disambiguation: >
  The Historical "LTV" card is new-customer first-order AOV (ltv); customer lifetime
  net revenue / customers is avg_ltv.
