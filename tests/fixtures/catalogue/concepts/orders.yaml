id: orders
display_name: Orders
one_liner: Count of orders; all-channels total unless a scope/status/attribution is named.
aliases: [orders, order count, order volume, number of orders]
axes:
  attribution: {values: [none, last_touch, channel, platform], default: none}
  scope: {values: [company, shopify, product], default: company}
  status: {values: [all, cod, prepaid, new, cancelled, returned, first, repeat, active], default: all}
  grain: {values: [period, order, daily], default: period}
resolves:
  - when: {attribution: none, scope: company, status: all}
    metric: total_orders
  - when: {attribution: none, scope: shopify, status: all}
    metric: orders
  - when: {attribution: none, scope: product, status: all}
    metric: product_orders
  - when: {attribution: last_touch, status: all}
    metric: attributed_orders
  - when: {attribution: channel, status: all}
    metric: channel_orders
    filter: {channel_type: attribution_closed_set}
  - when: {attribution: platform, status: all}
    metric: ad_channel_orders
    filter: {channel_type: pnl_overview}
  - when: {status: cod}
    metric: cod_orders
  - when: {status: prepaid}
    metric: prepaid_orders
  - when: {status: new}
    metric: new_customer_orders
  - when: {status: cancelled}
    metric: cancelled_orders
  - when: {status: returned}
    metric: refunded_orders
  - when: {status: first}
    metric: first_orders
  - when: {status: repeat}
    metric: repeat_orders
  - when: {status: active}
    metric: active_orders
disambiguation: >
  "by channel" (closed set) and last-touch/platform order counts measure different
  channel axes and do not reconcile with the Shopify total.
