id: ad_channel_net_profit
display_name: Ad Net Profit (cross-platform, ad grain)
category: attribution
status: certified
description: >-
  Net profit per ad channel, campaign, adset and ad (Meta and Google) — the scale/kill metric: "which
  campaigns make money", "profit by campaign". = net sales − net COGS − ad spend per row, on the same
  event-date basis as the channel Overview cards (serve.ad_channel_pnl_daily). Ex-GST, INR; can be
  negative. Summed over all rows of a channel it equals meta_net_profit / google_net_profit;
  row_type='reconciliation' rows hold the part not placeable on a campaign — include them for totals,
  filter row_type='detail' to rank campaigns/ads. Not platform-reported (Meta/Google Ads Manager)
  numbers.
formula:
  human_readable: SUM(net_profit)
  authoritative_source: cube
cube_mapping:
  view: ad_channel_pnl
  measure: ad_channel_pnl.net_profit
aggregation: additive
unit: INR
currency_default: INR
grain: daily campaign/adset/ad × channel
supported_dimensions:
- brand_id
- report_date
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
supported_filters:
- date_range
- brand_id
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  scopes:
  - metrics:read
examples:
- question: Net profit by campaign last 30 days
  request:
    measures:
    - ad_channel_net_profit
    dimensions:
    - campaign_name
    filters:
    - dimension: row_type
      operator: equals
      values: [detail]
    time_range:
      preset: last_30d
validation_tests:
- SUM over all rows ties to channel_pnl net profit for the same slice
