id: gross_sales_all_channels
display_name: Gross Sales (all channels, ex-GST)
category: commerce
status: certified
description: >-
  Gross sales for the business: order value before discounts, ex-GST, on the order date, from
  serve.sales_all_channels — default for "gross sales". Includes later-cancelled orders. Same total as
  gross_sales. Slice by shipping region/country/city.
formula:
  human_readable: SUM(shopify gross_sales_excl_tax), ex-GST
  authoritative_source: cube
cube_mapping:
  view: sales_all_channels
  measure: sales_all_channels.gross_sales
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
  - brand_id
  - report_date
  - channel
  - shipping_region
  - shipping_country
  - shipping_city
supported_filters:
  - date_range
  - brand_id
  - channel
  - shipping_region
  - shipping_country
  - shipping_city
data_owner: Commerce Ops
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
- question: Gross Sales (all channels, ex-GST) last 30 days
  request:
    measures:
    - gross_sales_all_channels
    time_range:
      preset: last_30d
validation_tests:
  - gross_sales_all_channels equals shopify gross_sales for the same slice
deprecated_aliases: []
dashboard_alignment:
  status: unclear
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: lineItemHistoricalSql.js:586
  note: >
    Serve layer is Shopify-only (2026-09-17), so this equals the Shopify figure. A dashboard
    All-channels card that also counts other marketplaces will not match.
