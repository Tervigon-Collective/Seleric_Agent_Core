id: product_cost
display_name: Product Cost (Shopify-only)
category: finance
status: certified
description: >-
  Merchandise (product) cost component of Net COGS for the period, per brand-day on
  serve.canonical_pnl (INR). Excludes shipping, packaging, gateway and RTO. Same number as
  product_cost_all_channels. There is no queryable per-SKU cost metric; for per-SKU profitability use
  product_gross_margin_pct.
formula:
  human_readable: SUM(product_cost)
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.product_cost
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  scopes:
  - metrics:read
examples:
- question: Product Cost for June 2026
  request:
    measures:
    - product_cost
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- product_cost + shipping_cost + packaging_cost + payment_gateway_fees + rto_cost = net_cogs
- June 2026 brand 20 ≈ ₹11,16,485.37
deprecated_aliases: []
dashboard_alignment:
  status: drift_corrected
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: lineItemHistoricalSql.js:615,639
  note: Value is correct at brand×day but validation_test (product_cost+shipping+packaging+gateway+rto=net_cogs) is falsified in the dashboard because its net_cogs also includes marketplace costs.
