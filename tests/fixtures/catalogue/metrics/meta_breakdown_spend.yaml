id: meta_breakdown_spend
display_name: Meta Spend (breakdown)
category: paid_media
status: draft
description: >-
  Meta spend by audience/placement breakdown (age & gender, placement, platform & device, publisher
  platform, region) on serve.meta_ads_breakdown_daily (INR). MUST filter exactly one breakdown_type
  (age_and_gender | placement | platform_device | publisher_platform | region) — each type repeats the
  same spend, so mixing them multiplies totals. Draft: not exposed to search.
formula:
  human_readable: SUM(meta_spend) within one breakdown_type
  authoritative_source: cube
cube_mapping:
  view: meta_ad_breakdown_performance
  measure: meta_ad_breakdown_performance.meta_spend
aggregation: additive
unit: INR
grain: daily ad x breakdown-slice grain (filter exactly one breakdown_type per query)
supported_dimensions:
- brand_id
- report_date
- breakdown_type
- age
- gender
- publisher_platform
- platform_position
- region
- campaign_name
- adset_name
- ad_name
supported_filters:
- date_range
- brand_id
- breakdown_type
- age
- gender
- publisher_platform
- platform_position
- region
- campaign_name
- adset_name
- ad_name
data_owner: Growth / Paid Media
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Meta Spend (breakdown) last 30 days
  request:
    measures:
    - meta_breakdown_spend
    time_range:
      preset: last_30d
validation_tests:
- single breakdown_type totals reconcile to meta_spend/meta_impressions on meta_ad_performance
currency_default: INR
dashboard_alignment:
  status: not_implemented
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  note: >
    The entire meta_ad_breakdown_performance cube view has no dashboard
    analog — no breakdown_type gating or single-select filter exists in
    Node-Backend. The nearest real feature (getAudienceInsights) returns
    several breakdowns simultaneously via a live Graph API call, not this
    ClickHouse-backed metric.
