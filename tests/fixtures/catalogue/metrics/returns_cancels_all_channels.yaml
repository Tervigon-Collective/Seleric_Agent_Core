id: returns_cancels_all_channels
display_name: Returns / Cancels (All Channels)
category: commerce
status: certified
description: >-
  Orders with a return or cancellation in the period, counted on the event date, from serve.returns_cancels_all_channels — default for "returns and cancellations" (id: returns_cancels_all_channels); formula: shopify event-date returns+cancels; grain: brand × day, additive; date axis: report_date (IST calendar day); scope: Shopify event-date returns/cancels; siblings: same total as returns_cancels (Shopify-only), for event-grain use refund_events / return_lifecycle on refund_date.
formula:
  human_readable: shopify event-date returns+cancels
  authoritative_source: cube
cube_mapping:
  view: returns_cancels_all_channels
  measure: returns_cancels_all_channels.returns_cancels
aggregation: additive
unit: count
grain: brand × day
supported_dimensions:
- brand_id
- report_date
- channel
supported_filters:
- date_range
- brand_id
- channel
data_owner: Commerce Ops
access_policy:
  roles_allowed: [exec, finance, growth_lead, analyst, ops]
  scopes: [metrics:read]
examples:
- question: Returns / Cancels (All Channels) last 30 days
  request:
    measures:
    - returns_cancels_all_channels
    time_range:
      preset: last_30d
validation_tests: []
deprecated_aliases: []
dashboard_alignment:
  status: unclear
  audited_on: '2026-07-27'
  source: Seleric_Dashboard Historical Analytics All-channels Returns/Cancels
  note: >
    Serve layer is Shopify-only (2026-09-17), so this equals the Shopify figure. A dashboard
    All-channels card that also counts other marketplaces will not match.
