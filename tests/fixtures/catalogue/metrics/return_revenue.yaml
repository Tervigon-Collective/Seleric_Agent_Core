id: return_revenue
display_name: Returns Revenue (Shopify-only, ex-GST)
category: commerce
status: certified
description: >-
  Revenue deducted by RETURNS in the period, ex-GST, on the return date, per brand-day on
  serve.canonical_pnl. Brand × day total only. For breakdowns by state/region/payment use
  event_return_revenue; by product use product_return_revenue. Not an order count (refunded_orders).
formula:
  human_readable: SUM(return_revenue_excl_tax)
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.return_revenue
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Returns revenue for June 2026
  request:
    measures:
    - return_revenue
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- June 2026 brand 20 ≈ ₹4,37,371.90
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: lineItemHistoricalSql.js:307-333
