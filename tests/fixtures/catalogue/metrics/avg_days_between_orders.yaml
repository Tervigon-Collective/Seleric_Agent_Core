id: avg_days_between_orders
display_name: Average Days Between Orders
category: customer
status: draft
description: >-
  Average days between a customer's consecutive orders, over repeat orders only (order number > 1), on
  serve.purchase_sequence (order date). Draft: not exposed to search.
formula:
  human_readable: SUM(days_since_prev_order) / repeat_orders
  authoritative_source: cube
cube_mapping:
  view: purchase_sequence
  measure: purchase_sequence.avg_days_between_orders
aggregation: ratio
unit: days
grain: order (eligible orders, per-customer sequenced)
supported_dimensions:
- brand_id
- order_date
- order_status
- is_cod
- order_seq
- order_seq_band
- is_first_order
- payment_method
- payment_bucket
- payment_gateway
- is_prepaid
supported_filters:
- date_range
- brand_id
- order_status
- is_cod
- order_seq
- order_seq_band
- is_first_order
- payment_method
- payment_bucket
- payment_gateway
- is_prepaid
data_owner: Growth / CRM
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  scopes:
  - metrics:read
examples:
- question: Average Days Between Orders for June 2026
  request:
    measures:
    - avg_days_between_orders
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests: []
deprecated_aliases: []
dashboard_alignment:
  status: not_implemented
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  note: 'No order-interval calculation exists anywhere in Node-Backend. Part of the broader finding that
    there is no customer-master or lifetime-aggregation layer.

    '
ratio_components:
  numerator: purchase_sequence.days_since_prev_order
  denominator: purchase_sequence.repeat_orders
