id: ad_channel_spend
display_name: Ad Spend (cross-platform, ad grain)
category: paid_media
status: certified
description: >-
  Ad spend per channel, campaign, adset and ad for BOTH Meta and Google in one table, on
  serve.ad_channel_pnl_daily (INR) — use for "spend by campaign", "Meta vs Google spend", or to put
  spend next to first-party sales/profit (ad_channel_net_sales, ad_channel_net_profit,
  ad_channel_roas). Sums to total_ad_spend over a period. For delivery detail (impressions, clicks,
  creatives, hourly) use meta_spend / google_spend.
formula:
  human_readable: SUM(ad_spend)
  authoritative_source: cube
cube_mapping:
  view: ad_channel_pnl
  measure: ad_channel_pnl.ad_spend
aggregation: additive
unit: INR
currency_default: INR
grain: daily campaign/adset/ad × channel
supported_dimensions:
- brand_id
- report_date
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
supported_filters:
- date_range
- brand_id
- channel
- campaign_id
- campaign_name
- adset_id
- adset_name
- ad_id
- ad_name
- row_type
- is_unattributed
data_owner: Growth / Paid Media
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Ad spend by platform last 30 days
  request:
    measures:
    - ad_channel_spend
    dimensions:
    - channel
    time_range:
      preset: last_30d
validation_tests:
- ad_channel_spend >= 0 for any slice
- SUM over all rows (row_type detail + reconciliation) ties to channel_pnl ad spend
