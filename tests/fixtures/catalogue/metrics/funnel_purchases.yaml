id: funnel_purchases
display_name: Funnel Purchases
category: web_analytics
status: certified
description: >-
  Orders per day and fine channel (ig_feed, fb_feed, google_pmax, organic, …) on serve.funnel_daily,
  assigned by last-touch order attribution (includes active, partially refunded and payment-pending
  orders).
formula:
  human_readable: SUM(purchases)
  authoritative_source: cube
cube_mapping:
  view: funnel_daily
  measure: funnel_daily.purchases
aggregation: additive
unit: count
grain: brand × day × fine channel
supported_dimensions:
- brand_id
- report_date
- channel
supported_filters:
- date_range
- brand_id
- channel
data_owner: Growth / Analytics
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Funnel Purchases last 30 days
  request:
    measures:
    - funnel_purchases
    time_range:
      preset: last_30d
validation_tests:
- funnel_purchases >= 0
deprecated_aliases: []
dashboard_alignment:
  status: drift_corrected
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: channelFunnel/martFunnelClickhouse.js:6-9,33,49
  note: Live mart uses session-attributed purchase counts that double-count per the code comment; catalogue claims last-touch attributed orders.
