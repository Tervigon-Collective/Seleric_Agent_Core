id: new_customer_orders
display_name: New Customer Orders (Shopify-only)
category: commerce
status: approved
description: >-
  Orders placed in the period that are a customer's first order (is_new_customer=1), from serve.commerce_orders on order date (id: new_customer_orders); formula: count of orders where customer has no prior order; grain: order, additive; date axis: order_date (IST); scope: Shopify eligible placements, includes later cancels, excludes test orders; siblings: for attributed new customers by marketing source use attributed_new_customer_orders, for CAC use new_customers / cac, for all orders use orders.
formula:
  human_readable: Count of orders where the customer has no prior order
  authoritative_source: cube
cube_mapping:
  view: commerce_orders
  measure: commerce_orders.new_customer_orders
aggregation: additive
unit: count
grain: order
supported_dimensions:
- brand_id
- order_date
- order_created_at_ist
- payment_method
- payment_bucket
- payment_gateway
- is_cod
- is_prepaid
- is_new_customer
- utm_source
- utm_medium
- utm_campaign
- source_name
- shipping_country
- shipping_region
- shipping_city
- shipping_pincode
- shipping_state_code
- order_status
- return_status
- fulfillment_status
- financial_status
supported_filters:
- date_range
- brand_id
- payment_method
- payment_bucket
- payment_gateway
- is_cod
- is_prepaid
- is_new_customer
- utm_source
- utm_medium
- utm_campaign
- source_name
- shipping_country
- shipping_region
- shipping_city
- shipping_pincode
- shipping_state_code
- order_status
- return_status
- fulfillment_status
- financial_status
data_owner: Growth
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  scopes:
  - metrics:read
examples:
- question: Share of new customer orders last month
  request:
    measures:
    - new_customer_orders
    - orders
    time_range:
      preset: last_month
validation_tests:
- new_customer_orders <= orders for any slice
