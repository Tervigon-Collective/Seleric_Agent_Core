id: net_cogs
display_name: Net COGS (Shopify-only FE lifecycle)
category: finance
status: certified
description: >-
  Total cost of goods and fulfilment (Net COGS) for the period = product cost + shipping + packaging +
  payment-gateway fees + RTO, per brand-day on serve.canonical_pnl (INR). Placement costs land on the
  order date; cancellations add gateway cost and returns add RTO (and shipping/packaging/gateway when
  fully returned) on the event date. Same number as total_operating_cost and
  total_operating_cost_all_channels. For product cost alone use product_cost. There is no queryable
  SKU-level COGS metric; for per-SKU profitability use product_gross_margin_pct.
formula:
  human_readable: SUM(net_cogs)
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.net_cogs
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  scopes:
  - metrics:read
examples:
- question: Net COGS for June 2026
  request:
    measures:
    - net_cogs
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- net_cogs >= 0 for any slice
- net_cogs equals product_cost + shipping_cost + packaging_cost + payment_gateway_fees + rto_cost for the same slice
deprecated_aliases: []
dashboard_alignment:
  status: drift_corrected
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: data_platform/mage-ai/infra/cube/model/cubes/serve_canonical_pnl.yml:66-72
  note: >
    Dashboard summary may blend other marketplace channels in a separate path. This metric is
    aligned to canonical Cube semantic execution (`canonical_pnl.net_cogs`),
    which is Shopify lifecycle Net COGS.
