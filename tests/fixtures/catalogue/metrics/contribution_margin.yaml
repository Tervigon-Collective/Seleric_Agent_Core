id: contribution_margin
display_name: Contribution Margin (Shopify-only)
category: finance
status: certified
description: >-
  Profit before advertising: net sales − Net COGS for the period, per brand-day on serve.canonical_pnl
  (ex-GST, INR). Use for "contribution margin", "profit before ads", "how much can we spend on ads".
  Same number as gross_profit. Not this: after ad spend → net_profit_all_channels; as a % of sales →
  contribution_margin_pct.
formula:
  human_readable: net_sales - net_cogs
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.contribution_margin
aggregation: additive
unit: currency
currency_default: INR
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  scopes:
  - metrics:read
examples:
- question: Contribution margin before ads for June 2026
  request:
    measures:
    - contribution_margin
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- contribution_margin = net_sales - net_cogs for the same slice
deprecated_aliases: []
dashboard_alignment:
  status: match
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: src/integrations/attributionPnLHelpers.js:195
