id: cost_coverage_pct
display_name: Product Cost Coverage %
category: finance
status: draft
description: >-
  Intended share of net sales with a known product cost. The column is currently hard-coded to 0 in
  serve.canonical_pnl, so this metric always returns 0 — do not use it. Draft: not exposed to search.
formula:
  human_readable: SUM(product_cost_coverage_pct * net_sales) / SUM(net_sales)
  authoritative_source: cube
cube_mapping:
  view: canonical_pnl
  measure: canonical_pnl.cost_coverage_pct
aggregation: ratio
unit: percent
grain: daily
supported_dimensions:
- brand_id
- report_date
supported_filters:
- date_range
- brand_id
data_owner: Finance
access_policy:
  roles_allowed:
  - exec
  - finance
  scopes:
  - metrics:read
examples:
- question: Product Cost Coverage % for June 2026
  request:
    measures:
    - cost_coverage_pct
    time_range:
      start: '2026-06-01'
      end: '2026-06-30'
validation_tests:
- cost_coverage_pct is between 0 and 100 for any slice
deprecated_aliases: []
dashboard_alignment:
  status: not_implemented
  audited_on: '2026-07-21'
  source: Seleric_Dashboard/Node-Backend
  evidence: —
  note: No cost-coverage concept in the live dashboard; catalogue already marked draft.
ratio_components:
  numerator: canonical_pnl.net_sales
  denominator: canonical_pnl.net_sales
