id: google_attribution_net_sales
display_name: Google Attribution Net Sales
category: attribution
status: certified
description: >-
  Net sales from Google Ads — the default for "Google net sales", "net sales from Google", "Google channel revenue" (id: google_attribution_net_sales); formula: Google gross − discounts − event-date returns/cancels on channel_pnl; grain: day × channel (google), additive; date axis: report_date (platform account day); scope: Google last-touch (google/google-ads Search/Shopping/PMax); siblings: for order-date sales (no later deductions) use attributed_net_revenue filtered lt_platform=google, for per-campaign use ad_channel_net_sales with channel=google, for Meta use meta_attribution_net_sales.
formula:
  human_readable: Google gross − discounts − event returns − event cancels
  authoritative_source: cube
cube_mapping:
  view: channel_pnl
  measure: channel_pnl.google_net_sales
aggregation: additive
unit: currency
currency_default: INR
grain: day
supported_dimensions:
- brand_id
- report_date
- channel
supported_filters:
- date_range
- brand_id
- channel
data_owner: Growth / Attribution
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Google Attribution Net Sales last 30 days
  request:
    measures:
    - google_attribution_net_sales
    time_range:
      preset: last_30d
validation_tests:
- June 2026 brand 20 ≈ ₹9,52,068.84 (dashboard)
