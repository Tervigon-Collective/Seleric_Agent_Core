id: orders
display_name: Orders (Shopify-only)
category: commerce
status: certified
description: >-
  Shopify orders placed in the period (order date), excluding test/revenue-adjustment orders, including later-cancelled (id: orders); formula: count of eligible orders (is_test=0, is_revenue_adjustment=0); grain: order, additive; date axis: order_date (IST); scope: Shopify eligible placements, includes later cancels, excludes test orders; siblings: for all-channels default use total_orders, for new customers use new_customer_orders, for attributed orders use attributed_orders, for event-date cancels/returns use cancelled_orders / refunded_orders on event_date.
formula:
  human_readable: Count of eligible orders placed (is_test = 0, is_revenue_adjustment = 0)
  authoritative_source: cube
cube_mapping:
  view: commerce_orders
  measure: commerce_orders.orders
aggregation: additive
unit: count
grain: order
supported_dimensions:
- brand_id
- order_date
- order_created_at_ist
- payment_method
- payment_bucket
- payment_gateway
- is_cod
- is_prepaid
- is_new_customer
- utm_source
- utm_medium
- utm_campaign
- source_name
- shipping_country
- shipping_region
- shipping_city
- shipping_pincode
- shipping_state_code
- order_status
- return_status
- fulfillment_status
- financial_status
- item_count
- order_name
- commerce_order_id
supported_filters:
- date_range
