data_owner: Commerce Ops
access_policy:
  roles_allowed:
  - exec
  - finance
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Orders by payment method last 30 days
  request:
    measures:
    - orders
    dimensions:
    - payment_method
    time_range:
      preset: last_30d
validation_tests:
- orders >= active_orders for any slice
