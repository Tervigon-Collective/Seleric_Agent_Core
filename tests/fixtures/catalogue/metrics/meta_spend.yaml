id: meta_spend
display_name: Meta Spend (Meta-only)
category: paid_media
status: certified
description: >-
  Meta (Facebook/Instagram) ad spend as reported by Meta, per ad per day on serve.meta_ads_daily (INR) (id: meta_spend); formula: SUM(meta_spend); grain: daily ad grain (brand × account × day × campaign × adset × ad), additive; date axis: report_date (platform account day); scope: Meta delivery only; siblings: for Google use google_spend, for both platforms use total_ad_spend, for Meta spend with first-party sales per campaign use ad_channel_spend with channel=meta.
formula:
  human_readable: SUM(meta_spend)
  authoritative_source: cube
cube_mapping:
  view: meta_ad_performance
  measure: meta_ad_performance.meta_spend
aggregation: additive
unit: INR
grain: daily ad grain (brand x account x day x campaign x adset x ad)
supported_dimensions:
- brand_id
- report_date
- ad_account_id
- campaign_id
- campaign_name
- campaign_status
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_id
- creative_type
- creative_name
- creative_cta_type
- ad_format
- adset_optimization_goal
- neurohack_tag_codes
supported_filters:
- date_range
- brand_id
- ad_account_id
- campaign_id
- campaign_name
- campaign_status
- campaign_objective
- adset_id
- adset_name
- ad_id
- ad_name
- creative_id
- creative_type
- creative_name
- creative_cta_type
- ad_format
- adset_optimization_goal
- neurohack_tag_codes
data_owner: Growth / Paid Media
access_policy:
  roles_allowed:
  - exec
  - growth_lead
  - analyst
  - ops
  scopes:
  - metrics:read
examples:
- question: Meta Spend (Meta-only) last 30 days
  request:
    measures:
    - meta_spend
    time_range:
      preset: last_30d
validation_tests:
- meta_spend >= 0 for any slice
currency_default: INR
dashboard_alignment:
