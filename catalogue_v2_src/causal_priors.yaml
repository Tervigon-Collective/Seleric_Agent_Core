# Business mechanism layer of the metric dependency graph: hand-authored, reviewed by people who know the business.
# scripts/build_dependency_graph.py merges it with what the catalogue already states (compositions, ratio
# components, concept twins) into doc/dependency_graph/dependency_graph.json, and refuses ids that do not exist,
# causal edges between two measurements of the same quantity, and lag-0 cycles.
#
# What belongs here and what does not
#   - Accounting (net_sales = gross − discounts − deductions) is NOT authored here: it comes from formula.composition
#     and ratio_components in catalogue_v2/metrics, which scripts/verify_compositions.py checks on real rows.
#   - Two metrics that measure the same quantity on another date basis or grain (net_sales / pnl_net_sales,
#     orders / product_orders) are NOT authored here: they come from the concepts' date / scope axes.
#   - This file holds what no formula can state: which volume drives which (mechanisms), which metrics measure the
#     same events in different systems (co_measures), which ones are a subset or allocation of another, how results
#     feed back into decisions, and the funnel order (tiers) that discovery must respect.
#
# Mechanism edges are PRIORS: the direction is business knowledge, the existence and size of the effect in a
# given brand and period are for the data to show (DoWhy / discovery). `confidence` says how sure the direction is:
#   structural  the business cannot work otherwise (a unit shipped costs shipping)
#   strong      standard performance-marketing / e-commerce mechanism, direction not in doubt
#   moderate    usual direction, but known to reverse or vanish in some setups
# `lag_days` is [min, max] days between a move in `from` and its effect on `to` on their own date axes.
# `rate` names the catalogue ratio that measures the mechanism on that edge when one exists: a change in the rate
# is a change in the mechanism itself (CTR down = the impressions→clicks mechanism weakened), not a separate node.

version: 1

# --------------------------------------------------------------------------- funnel tiers
# Lag-0 edges may only point from a lower tier to a higher one. A metric not listed gets its view's tier.
tiers:
  0: {name: intervention, note: "Changes people make: budget, bid strategy, status edits"}
  1: {name: spend, note: "Money put into acquisition"}
  2: {name: delivery, note: "Ad delivery bought with it"}
  3: {name: ad_engagement, note: "Interaction with the ad"}
  4: {name: site_traffic, note: "Arrivals on the store"}
  5: {name: on_site_intent, note: "Browsing and cart actions"}
  6: {name: purchase, note: "Orders and the customers who place them"}
  7: {name: order_value, note: "What the orders are worth"}
  8: {name: post_purchase, note: "Cancellations, returns, refunds, RTO: happen after the order"}
  9: {name: cost, note: "Cost of fulfilling and selling"}
  10: {name: profit, note: "What is left"}

