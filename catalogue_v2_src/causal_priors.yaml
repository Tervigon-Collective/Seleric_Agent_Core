# --------------------------------------------------------------------------- mechanisms (directed priors)
# Canonical nodes are the brand-level, order-date (or delivery / session date) metrics. Their twins on other date
# bases and grains inherit the edge through the twin relation; they are not repeated here.
mechanisms:
  # Interventions -> spend and delivery
  - {from: budget_changes, to: ad_spend, sign: "+/-", lag_days: [0, 1], confidence: strong,
     note: "A budget edit changes what the platform may spend from the next delivery hour"}
  - {from: status_changes, to: ad_spend, sign: "+/-", lag_days: [0, 1], confidence: strong,
     note: "Pausing / enabling a campaign, ad set or ad stops or starts its spend"}
  - {from: bid_strategy_changes, to: impressions, sign: "+/-", lag_days: [0, 3], confidence: moderate,
     note: "A new bid strategy changes how much delivery the same spend buys; platforms re-learn for days"}

  # Spend -> delivery -> engagement (paid media, delivery date)
  - {from: ad_spend, to: impressions, sign: "+", lag_days: [0, 0], rate: cpm, confidence: strong,
     note: "Spend buys impressions at the auction price; CPM is the price of that mechanism (higher CPM = fewer impressions per rupee)"}
  - {from: impressions, to: clicks, sign: "+", lag_days: [0, 0], rate: ctr, confidence: strong,
     note: "CTR is the mechanism: creative fatigue or audience change shows up as a CTR change"}
  - {from: impressions, to: link_clicks, sign: "+", lag_days: [0, 0], confidence: strong}
  - {from: impressions, to: thruplays, sign: "+", lag_days: [0, 0], rate: hook_rate, confidence: strong,
     note: "Video ads only; hook and hold rates measure the creative"}
  - {from: link_clicks, to: landing_page_views, sign: "+", lag_days: [0, 0], confidence: strong,
     note: "Meta only; the gap is page-load loss (slow site, broken link)"}

  # Ad engagement -> site traffic (crosses from the ad platform to the site tracker)
  - {from: landing_page_views, to: sessions, sign: "+", lag_days: [0, 0], confidence: strong,
     note: "Paid Meta arrivals; read on the paid / Meta slice of sessions, the rest is organic and other channels. LPV and paid Meta sessions count nearly the same arrivals in two systems, so a widening gap between them is a tracking or site-speed signal, not a cause"}
  - {from: link_clicks, to: sessions, sign: "+", lag_days: [0, 0], confidence: strong,
     note: "Paid arrivals incl. Google, which reports no landing page views"}

  # Site traffic -> intent -> purchase (session date)
  - {from: sessions, to: session_product_views, sign: "+", lag_days: [0, 0], rate: product_view_rate, confidence: strong}
  - {from: session_collection_views, to: session_product_views, sign: "+", lag_days: [0, 0], confidence: moderate,
     note: "Browsing collections leads to product pages"}
  - {from: site_searches, to: session_product_views, sign: "+", lag_days: [0, 0], confidence: moderate}
  - {from: session_product_views, to: add_to_carts, sign: "+", lag_days: [0, 0], rate: add_to_cart_rate, confidence: strong}
  - {from: add_to_carts, to: funnel_purchases, sign: "+", lag_days: [0, 1], rate: checkout_to_purchase_rate, confidence: strong,
     note: "Through checkout (add_to_cart_to_checkout_rate, checkout_to_purchase_rate); no reliable checkout count exists (checkout_steps is broken)"}
  - {from: sessions, to: orders, sign: "+", lag_days: [0, 1], rate: conversion_rate, confidence: strong,
     note: "The store-wide conversion mechanism; crosses from the web tracker to the order ledger"}
  - {from: add_to_carts, to: orders, sign: "+", lag_days: [0, 1], confidence: strong}

  # Price and promotion
  - {from: discounts, to: orders, sign: "+", lag_days: [0, 0], confidence: moderate,
     note: "Deeper discounts win orders. Discounts in rupees also scale with orders, so test the discount RATE (discounts ÷ gross_sales) as the lever, not the rupee amount, or the edge is circular"}
  - {from: discounts, to: net_aov, sign: "-", lag_days: [0, 0], confidence: strong,
     note: "Also an accounting fact (net sales deduct discounts); the behavioural part is basket composition"}

  # Purchase -> order value
  - {from: orders, to: units_ordered, sign: "+", lag_days: [0, 0], rate: units_per_order, confidence: structural}
  - {from: units_ordered, to: gross_sales, sign: "+", lag_days: [0, 0], confidence: structural,
     note: "Units × selling price; a price change is a change in this mechanism"}
  - {from: orders, to: new_customers, sign: "+", lag_days: [0, 0], confidence: structural,
     note: "New customers are first orders; the share of new vs repeat is the mechanism"}
  - {from: orders, to: cod_orders, sign: "+", lag_days: [0, 0], confidence: structural,
     note: "COD share is the mechanism (checkout payment options, COD fees, pincode serviceability)"}
  - {from: orders, to: prepaid_orders, sign: "+", lag_days: [0, 0], confidence: structural}

  # Purchase -> post-purchase (order-date cohort: these mature over days / weeks)
  - {from: orders, to: cancelled_orders, sign: "+", lag_days: [0, 3], confidence: structural}
  - {from: cod_orders, to: cancelled_orders, sign: "+", lag_days: [0, 3], confidence: strong,
     note: "COD orders are cancelled far more often than prepaid ones"}
  - {from: cod_orders, to: rto_cost, sign: "+", lag_days: [3, 15], confidence: strong,
     note: "Return-to-origin is mostly refused COD deliveries"}
  - {from: orders, to: returned_orders, sign: "+", lag_days: [3, 30], rate: return_rate, confidence: structural,
     note: "Order-date return metrics are incomplete for orders younger than the return window: a recent 'drop in returns' or 'rise in net sales' can be immaturity, not behaviour"}
  - {from: returned_orders, to: return_revenue, sign: "+", lag_days: [0, 0], confidence: structural}
  - {from: cancelled_orders, to: cancel_revenue, sign: "+", lag_days: [0, 0], confidence: structural}
  - {from: units_ordered, to: returned_units, sign: "+", lag_days: [3, 30], rate: unit_return_rate, confidence: structural}

  # Purchase -> cost
  - {from: units_sold, to: product_cost, sign: "+", lag_days: [0, 0], confidence: structural,
     note: "Unit cost × units; a supplier price change is a change in this mechanism"}
  - {from: orders, to: shipping_cost, sign: "+", lag_days: [0, 0], confidence: structural,
     note: "Per-shipment rate × orders; a courier rate change is a change in this mechanism"}
  - {from: orders, to: packaging_cost, sign: "+", lag_days: [0, 0], confidence: structural}
  - {from: prepaid_orders, to: payment_gateway_fees, sign: "+", lag_days: [0, 0], confidence: structural}

  # Customers
  - {from: new_customers, to: customers, sign: "+", lag_days: [0, 0], confidence: structural}
  - {from: new_customers, to: repeat_customers, sign: "+", lag_days: [14, 180], rate: repeat_rate, confidence: strong,
     note: "Today's new customers are the repeat customers of the coming months"}

# --------------------------------------------------------------------------- feedback (lagged only)
# Results feed back into the levers: people raise budgets on good ROAS, platform algorithms bid toward conversions.
# Never at lag 0. Without these, discovery reads "orders cause spend" as a contradiction instead of a known loop.
feedback:
  - {from: net_sales, to: ad_spend, sign: "+", lag_days: [1, 14], confidence: strong,
     note: "Budget decisions follow results; value-based bidding spends more where it converts"}
  - {from: orders, to: ad_spend, sign: "+", lag_days: [1, 7], confidence: moderate,
     note: "Conversion-optimised campaigns pace spend on conversions"}
  - {from: orders, to: cpm, sign: "-", lag_days: [1, 7], confidence: moderate,
     note: "Conversion signal improves auction outcomes"}

# --------------------------------------------------------------------------- co-measures (no causal edge)
# The same real-world events counted by two systems. Never use one to explain the other; a divergence between them
# is a data / measurement observation (tracking break, pixel loss, sync lag).
co_measures:
  - {a: orders, b: funnel_purchases, systems: [shopify, snowplow], expected: "funnel ≤ orders (ad blockers, app orders, server-side gaps)"}
  - {a: orders, b: funnel_order_purchases, systems: [shopify, snowplow]}
  - {a: net_sales, b: funnel_revenue, systems: [shopify, snowplow], expected: "Snowplow revenue is ex-tax at purchase; net sales also nets later returns / cancels"}
  - {a: net_sales, b: funnel_order_revenue, systems: [shopify, snowplow]}
  - {a: ad_spend, b: pnl_ad_spend, systems: [paid_media, finance_pnl], expected: equal}
  - {a: ad_spend, b: order_pnl_ad_spend, systems: [paid_media, order_pnl], expected: equal}
  - {a: net_sales, b: order_pnl_net_sales, systems: [commerce, order_pnl], expected: "near-equal, both order date"}
  - {a: gross_sales, b: order_pnl_gross_sales, systems: [commerce, order_pnl], expected: "near-equal, both order date"}
  - {a: discounts, b: order_pnl_discounts, systems: [commerce, order_pnl], expected: "near-equal, both order date"}
  - {a: return_revenue, b: order_pnl_return_revenue, systems: [commerce, order_pnl], expected: "near-equal, both order date"}
  - {a: cancel_revenue, b: order_pnl_cancel_revenue, systems: [commerce, order_pnl], expected: "near-equal, both order date"}
  - {a: product_cost, b: product_line_cost, systems: [order_pnl, product], expected: "equal in total (catalogue: product-grain twin)"}
  - {a: gross_cogs, b: product_gross_cogs, systems: [order_pnl, product], expected: "equal in total"}
  - {a: gross_sales, b: product_gross_sale, systems: [commerce, product], expected: "equal in total (catalogue: product-grain twin)"}
  - {a: product_gross_sale, b: product_order_gross_sales, systems: [product, product_pnl], expected: "near-equal, both order date"}
  - {a: product_net_revenue, b: product_order_net_sales, systems: [product, product_pnl], expected: "near-equal, both order date"}
  - {a: product_orders, b: product_order_orders, systems: [product, product_pnl]}
  - {a: product_line_cost, b: product_order_product_cost, systems: [product, product_pnl]}
  - {a: product_discounts, b: product_order_discounts, systems: [product, product_pnl]}
  - {a: product_return_revenue, b: product_order_return_revenue, systems: [product, product_pnl]}
  - {a: product_cancel_revenue, b: product_order_cancel_revenue, systems: [product, product_pnl]}
  - {a: product_net_cogs, b: product_order_net_cogs, systems: [product, product_pnl]}
  - {a: product_ad_spend, b: product_order_ad_spend, systems: [product, product_pnl], expected: equal}
  - {a: returns_excl_tax, b: pnl_return_revenue, systems: [returns, finance_pnl], expected: "both on the return / refund date; near-equal"}
  - {a: refund_count, b: pnl_returned_orders, systems: [returns, finance_pnl]}
  - {a: payment_amount, b: paid_sales, systems: [payments, commerce], expected: "different dates (transaction vs order) and refunds negative"}
  - {a: page_views, b: session_page_views, systems: [web_events, web_sessions], expected: "session_page_views ≈1.3% below page_views"}

# --------------------------------------------------------------------------- product-grain twins on two date bases
# product_order_X (order date) and product_pnl_X (event / finance date) are the same quantity on two date axes.
# Stated here because the concepts map the finance product P&L but not product_order_*.
date_twin_prefixes:
  # concepts.yaml header: "pnl_X = event date, X = its order-date twin".
  - {order_date: "", finance_date: "pnl_"}
  - {order_date: "product_order_", finance_date: "product_pnl_"}
  - {order_date: "product_", finance_date: "product_pnl_"}

# --------------------------------------------------------------------------- subsets and partitions (no causal edge)
subsets:
  - {part: link_clicks, whole: clicks}
  - {part: new_customers, whole: orders, note: "first orders ⊂ orders"}
  - {part: cod_orders, whole: orders}
  - {part: prepaid_orders, whole: orders}
  - {part: payment_orders, whole: orders}
  - {part: orders_with_touchpoints, whole: orders}
  - {part: cancelled_orders, whole: orders}
  - {part: returned_orders, whole: orders}
  - {part: repeat_customers, whole: customers}

# --------------------------------------------------------------------------- allocations (model output, no causal edge)
# Allocated metrics are a share of a platform metric, split by the product's share of attributed REVENUE. They are
# computed FROM the product's sales, so "product_ad_spend explains product sales" is circular: never use an
# allocated metric as a driver of the same product's revenue, orders or profit.
allocations:
  - {allocated: product_ad_spend, source: ad_spend, key: product share of attributed line revenue}
  - {allocated: product_order_ad_spend, source: ad_spend, key: product share of attributed line revenue}
  - {allocated: product_pnl_ad_spend, source: ad_spend, key: product share of attributed line revenue}
  - {allocated: product_impressions, source: impressions, key: product share of attributed revenue}
  - {allocated: product_clicks, source: clicks, key: product share of attributed revenue}
  - {allocated: product_link_clicks, source: link_clicks, key: product share of attributed revenue}
  - {allocated: product_landing_page_views, source: landing_page_views, key: product share of attributed revenue}
  - {allocated: product_thruplays, source: thruplays, key: product share of attributed revenue}
  - {allocated: product_shipping_cost, source: shipping_cost, key: line revenue share of the order}
  - {allocated: product_packaging_cost, source: packaging_cost, key: line revenue share of the order}
  - {allocated: product_payment_gateway_fees, source: payment_gateway_fees, key: line revenue share of the order}
  - {allocated: product_rto_cost, source: rto_cost, key: line revenue share of the order}
