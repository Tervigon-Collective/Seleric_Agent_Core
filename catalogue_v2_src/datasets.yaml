Ads.Delivery:
  domain: advertising
  role: primary_fact
  description: Unified ad delivery (Meta ∪ Google), ad × day (with hourly binding)
  physical_bindings:
    daily: serve.ad_delivery_daily
    hourly: serve.ad_delivery_hourly
  grain:
    declared_keys:
    - brand_id
    - report_date
    - ad_platform
    - account_id
    - campaign_id
    - adset_id
    - ad_id
  date_policy:
    default: report_date
    meaning: ad_delivery_date
  supported_platforms:
  - meta
  - google
  certification:
    status: pending_verification
Meta.Breakdowns:
  domain: advertising
  role: primary_fact
  description: Meta delivery breakdown slices (repeats full delivery per breakdown_type)
  physical_bindings:
    daily: serve.meta_ads_breakdown_daily
  grain:
    declared_keys:
    - brand_id
    - report_date
    - breakdown_type
    - age
    - gender
    - publisher_platform
    - platform_position
    - device_platform
    - region
    - ad_account_id
    - campaign_id
    - adset_id
    - ad_id
  date_policy:
    default: report_date
    meaning: ad_delivery_date
  supported_platforms:
  - meta
  slice_dimension: breakdown_type
  certification:
    status: certified
    certified_on: '2026-10-12'
    evidence: doc/semantic_datasets/certification.json
