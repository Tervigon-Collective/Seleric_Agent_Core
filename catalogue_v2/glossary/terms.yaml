- term: sales by state
  canonical_id: total_sales
  definition: 'Break down total_sales (and/or orders) with dimension shipping_region (alias state/province) — never
    Cube members like sales_all_channels.total_sales. For "with order count" request BOTH total_sales and orders
    in one metrics_query; expect composed multi-view parts — narrate separately, do not join. Shopify-only: total_sales
    + orders on the same view. City → shipping_city. Geo values are uppercased (MAHARASHTRA).'
